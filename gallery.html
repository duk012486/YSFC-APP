<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>사진첩 · YSFC</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Apple SD Gothic Neo', '맑은 고딕', sans-serif; background: #f4f4f4; }
    .header { background: linear-gradient(135deg, #1a7c3e, #25a85a); color: white; padding: 16px 20px; display: flex; align-items: center; justify-content: space-between; }
    .header-left { display: flex; align-items: center; gap: 12px; }
    .back-btn { font-size: 22px; text-decoration: none; color: white; cursor: pointer; background: none; border: none; }
    .header h1 { font-size: 18px; font-weight: 700; }
    .add-btn { background: rgba(255,255,255,0.2); color: white; border: none; padding: 6px 12px; border-radius: 20px; font-size: 13px; cursor: pointer; }
    .album-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; padding: 14px 14px 90px; }
    .album-card { background: white; border-radius: 14px; overflow: hidden; box-shadow: 0 2px 8px rgba(0,0,0,0.08); cursor: pointer; position: relative; }
    .album-cover { width: 100%; aspect-ratio: 1; object-fit: cover; background: #e8f5ee; display: flex; align-items: center; justify-content: center; font-size: 42px; }
    .album-info { padding: 10px 12px; }
    .album-title { font-size: 13px; font-weight: 700; color: #333; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .album-meta { font-size: 11px; color: #aaa; margin-top: 3px; display: flex; justify-content: space-between; }
    .album-count { background: rgba(0,0,0,0.6); color: white; font-size: 10px; padding: 2px 8px; border-radius: 20px; position: absolute; top: 8px; right: 8px; }
    .detail-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 4px; padding: 14px 14px 90px; }
    .detail-photo { width: 100%; aspect-ratio: 1; object-fit: cover; border-radius: 6px; cursor: pointer; }
    .detail-header-info { padding: 14px 14px 0; }
    .detail-title { font-size: 18px; font-weight: 700; color: #333; }
    .detail-date { font-size: 12px; color: #aaa; margin-top: 4px; }
    .detail-actions { display: flex; gap: 8px; margin-top: 12px; }
    .da-btn { flex: 1; padding: 10px; border-radius: 10px; border: none; font-size: 13px; font-weight: 600; cursor: pointer; }
    .da-edit { background: #e8f5ee; color: #1a7c3e; }
    .da-del { background: #fde8e8; color: #e53e3e; }
    .da-add { background: #1a7c3e; color: white; }
    .viewer { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.95); z-index: 200; align-items: center; justify-content: center; }
    .viewer.show { display: flex; }
    .viewer img { max-width: 100%; max-height: 90%; object-fit: contain; }
    .viewer-close { position: fixed; top: 16px; right: 20px; color: white; font-size: 32px; cursor: pointer; background: none; border: none; z-index: 201; }
    .viewer-nav { position: fixed; top: 50%; transform: translateY(-50%); color: white; font-size: 40px; cursor: pointer; background: rgba(0,0,0,0.3); border: none; padding: 10px 16px; }
    .viewer-prev { left: 10px; } .viewer-next { right: 10px; }
    .modal-bg { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.5); z-index: 100; }
    .modal-bg.show { display: flex; align-items: flex-end; }
    .modal { background: white; width: 100%; border-radius: 20px 20px 0 0; padding: 20px; max-height: 88vh; overflow-y: auto; }
    .modal-title { font-size: 16px; font-weight: 700; margin-bottom: 16px; text-align: center; }
    .form-group { margin-bottom: 14px; }
    .form-label { font-size: 12px; color: #888; margin-bottom: 6px; display: block; }
    .form-input { width: 100%; padding: 10px 12px; border: 1px solid #eee; border-radius: 8px; font-size: 14px; font-family: inherit; }
    .img-upload-area { border: 2px dashed #ddd; border-radius: 8px; padding: 24px; text-align: center; cursor: pointer; color: #aaa; font-size: 13px; }
    .preview-count { font-size: 12px; color: #1a7c3e; font-weight: 600; margin-top: 8px; }
    .preview-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin-top: 8px; }
    .preview-item { position: relative; }
    .preview-item img { width: 100%; aspect-ratio: 1; object-fit: cover; border-radius: 6px; }
    .preview-del { position: absolute; top: 2px; right: 2px; background: rgba(0,0,0,0.7); color: white; border: none; border-radius: 50%; width: 20px; height: 20px; font-size: 12px; cursor: pointer; line-height: 1; }
    .form-btn { width: 100%; padding: 14px; background: #1a7c3e; color: white; border: none; border-radius: 12px; font-size: 15px; font-weight: 700; cursor: pointer; margin-top: 8px; }
    .form-btn:disabled { background: #aaa; }
    .cancel-btn { width: 100%; padding: 12px; background: #f4f4f4; color: #666; border: none; border-radius: 12px; font-size: 14px; cursor: pointer; margin-top: 8px; }
    .loading { text-align: center; padding: 40px; color: #aaa; font-size: 14px; grid-column: 1 / -1; }
    .bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; background: white; border-top: 1px solid #eee; display: flex; justify-content: space-around; padding: 10px 0 16px; z-index: 10; }
    .nav-item { text-align: center; text-decoration: none; color: #aaa; font-size: 10px; }
    .nav-item.active { color: #1a7c3e; }
    .nav-item .nav-icon { font-size: 22px; display: block; margin-bottom: 2px; }
  </style>
</head>
<body>
  <div class="header">
    <div class="header-left">
      <button class="back-btn" id="back-btn" onclick="goBack()">←</button>
      <h1 id="header-title">📸 사진첩</h1>
    </div>
    <button class="add-btn" id="add-album-btn" onclick="openModal()">➕ 앨범 추가</button>
  </div>

  <div id="album-view">
    <div class="album-grid" id="album-grid"><div class="loading">사진첩을 불러오는 중...</div></div>
  </div>

  <div id="detail-view" style="display:none;">
    <div class="detail-header-info">
      <div class="detail-title" id="detail-title"></div>
      <div class="detail-date" id="detail-date"></div>
      <div class="detail-actions">
        <button class="da-btn da-add" onclick="openAddPhotos()">➕ 사진 추가</button>
        <button class="da-btn da-edit" onclick="openEditAlbum()">✏️ 제목수정</button>
        <button class="da-btn da-del" onclick="deleteAlbum()">🗑️ 삭제</button>
      </div>
    </div>
    <div class="detail-grid" id="detail-grid"></div>
  </div>

  <div class="viewer" id="viewer">
    <button class="viewer-close" onclick="closeViewer()">✕</button>
    <button class="viewer-nav viewer-prev" onclick="viewerNav(-1)">‹</button>
    <img id="viewer-img" src="" alt="">
    <button class="viewer-nav viewer-next" onclick="viewerNav(1)">›</button>
  </div>

  <div class="modal-bg" id="modal-bg">
    <div class="modal">
      <div class="modal-title" id="modal-title">➕ 새 앨범</div>
      <div class="form-group">
        <label class="form-label">앨범 제목</label>
        <input class="form-input" id="form-title" placeholder="예: 6월 서천대회" />
      </div>
      <div class="form-group" id="upload-group">
        <label class="form-label">📷 사진 (여러 번 골라도 계속 추가됩니다)</label>
        <div class="img-upload-area" onclick="document.getElementById('img-input').click()">📷 사진 선택 / 더 추가하기</div>
        <input type="file" id="img-input" accept="image/*" multiple style="display:none" onchange="addImgs(this)">
        <div class="preview-count" id="preview-count"></div>
        <div class="preview-grid" id="preview-grid"></div>
      </div>
      <button class="form-btn" id="submit-btn" onclick="submitAlbum()">📸 앨범 만들기</button>
      <button class="cancel-btn" onclick="closeModal()">취소</button>
    </div>
  </div>

  <nav class="bottom-nav">
    <a href="index.html" class="nav-item"><span class="nav-icon">🏠</span>홈</a>
    <a href="notice.html" class="nav-item"><span class="nav-icon">📢</span>공지</a>
    <a href="schedule.html" class="nav-item"><span class="nav-icon">📅</span>일정</a>
    <a href="gallery.html" class="nav-item active"><span class="nav-icon">📸</span>사진</a>
    <a href="players.html" class="nav-item"><span class="nav-icon">👦</span>선수</a>
  </nav>

  <script>
    const CLOUD_NAME = "dq4qx2qfg";
    const UPLOAD_PRESET = "YSFC-APP";
    let allAlbums = [];
    let selectedFiles = [];
    let currentAlbum = null;
    let viewerPhotos = [];
    let viewerIdx = 0;
    let modalMode = 'new';
    let db = null;

    async function initFirebase() {
      try {
        const { initializeApp } = await import("https://www.gstatic.com/firebasejs/12.14.0/firebase-app.js");
        const { getFirestore, collection, addDoc, getDocs, doc, updateDoc, deleteDoc } = await import("https://www.gstatic.com/firebasejs/12.14.0/firebase-firestore.js");
        const firebaseConfig = {
          apiKey: "AIzaSyABY7cdBTXJVbnNVVJmhuo9nXNLerbtVEo",
          authDomain: "ysfc-app-ff413.firebaseapp.com",
          projectId: "ysfc-app-ff413",
          storageBucket: "ysfc-app-ff413.firebasestorage.app",
          messagingSenderId: "791661747168",
          appId: "1:791661747168:web:3540aacb15306331afe985"
        };
        const app = initializeApp(firebaseConfig);
        db = getFirestore(app);
        window._addDoc = addDoc; window._collection = collection; window._getDocs = getDocs;
        window._doc = doc; window._updateDoc = updateDoc; window._deleteDoc = deleteDoc;
        await loadAlbums();
      } catch(e) {
        console.error('Firebase 오류:', e);
        document.getElementById('album-grid').innerHTML = '<div class="loading">연결 오류가 발생했습니다 😢</div>';
      }
    }

    function getTime(ts) {
      if (!ts) return 0;
      if (ts.toDate) return ts.toDate().getTime();
      return new Date(ts).getTime();
    }

    async function loadAlbums() {
      try {
        const snapshot = await window._getDocs(window._collection(db, 'albums'));
        allAlbums = [];
        snapshot.forEach(d => allAlbums.push({ id: d.id, ...d.data() }));
        allAlbums.sort((a, b) => getTime(b.createdAt) - getTime(a.createdAt));
        renderAlbums();
      } catch(e) {
        console.error(e);
        document.getElementById('album-grid').innerHTML = '<div class="loading">데이터를 불러올 수 없습니다 😢</div>';
      }
    }

    function renderAlbums() {
      if (allAlbums.length === 0) {
        document.getElementById('album-grid').innerHTML = '<div class="loading">등록된 앨범이 없습니다<br>➕ 앨범 추가 버튼으로 만들어주세요!</div>';
        return;
      }
      document.getElementById('album-grid').innerHTML = allAlbums.map(a => {
        const photos = a.photos || [];
        const cover = photos.length > 0 ? `<img class="album-cover" src="${photos[0]}" alt="${a.title}">` : `<div class="album-cover">📷</div>`;
        const date = a.createdAt?.toDate ? a.createdAt.toDate() : (a.createdAt ? new Date(a.createdAt) : new Date());
        const dateStr = `${date.getFullYear()}.${String(date.getMonth()+1).padStart(2,'0')}.${String(date.getDate()).padStart(2,'0')}`;
        return `
          <div class="album-card" onclick="openAlbum('${a.id}')">
            ${cover}
            <span class="album-count">${photos.length}장</span>
            <div class="album-info">
              <div class="album-title">${a.title}</div>
              <div class="album-meta"><span>${dateStr}</span></div>
            </div>
          </div>`;
      }).join('');
    }

    window.openAlbum = function(id) {
      currentAlbum = allAlbums.find(a => a.id === id);
      if (!currentAlbum) return;
      const photos = currentAlbum.photos || [];
      const date = currentAlbum.createdAt?.toDate ? currentAlbum.createdAt.toDate() : (currentAlbum.createdAt ? new Date(currentAlbum.createdAt) : new Date());
      document.getElementById('detail-title').textContent = currentAlbum.title;
      document.getElementById('detail-date').textContent = `${date.getFullYear()}.${String(date.getMonth()+1).padStart(2,'0')}.${String(date.getDate()).padStart(2,'0')} · ${photos.length}장`;
      document.getElementById('detail-grid').innerHTML = photos.map((p, i) =>
        `<img class="detail-photo" src="${p}" onclick="openViewer(${i})">`
      ).join('');
      document.getElementById('album-view').style.display = 'none';
      document.getElementById('detail-view').style.display = 'block';
      document.getElementById('header-title').textContent = '📸 앨범';
      document.getElementById('add-album-btn').style.display = 'none';
    };

    window.goBack = function() {
      if (document.getElementById('detail-view').style.display === 'block') {
        document.getElementById('detail-view').style.display = 'none';
        document.getElementById('album-view').style.display = 'block';
        document.getElementById('header-title').textContent = '📸 사진첩';
        document.getElementById('add-album-btn').style.display = 'block';
        currentAlbum = null;
      } else {
        location.href = 'index.html';
      }
    };

    window.openViewer = function(idx) {
      viewerPhotos = currentAlbum.photos || [];
      viewerIdx = idx;
      document.getElementById('viewer-img').src = viewerPhotos[idx];
      document.getElementById('viewer').classList.add('show');
    };
    window.closeViewer = function() { document.getElementById('viewer').classList.remove('show'); };
    window.viewerNav = function(dir) {
      viewerIdx = (viewerIdx + dir + viewerPhotos.length) % viewerPhotos.length;
      document.getElementById('viewer-img').src = viewerPhotos[viewerIdx];
    };

    // 누적 추가!
    window.addImgs = function(input) {
      const files = Array.from(input.files);
      selectedFiles = selectedFiles.concat(files);
      input.value = ''; // 같은 파일도 다시 고를 수 있게 초기화
      renderPreviews();
    };

    function renderPreviews() {
      const grid = document.getElementById('preview-grid');
      const count = document.getElementById('preview-count');
      count.textContent = selectedFiles.length > 0 ? `선택된 사진 ${selectedFiles.length}장` : '';
      grid.innerHTML = '';
      selectedFiles.forEach((file, idx) => {
        const reader = new FileReader();
        reader.onload = e => {
          const div = document.createElement('div');
          div.className = 'preview-item';
          div.innerHTML = `<img src="${e.target.result}"><button class="preview-del" onclick="removePreview(${idx})">✕</button>`;
          grid.appendChild(div);
        };
        reader.readAsDataURL(file);
      });
    }

    window.removePreview = function(idx) {
      selectedFiles.splice(idx, 1);
      renderPreviews();
    };

    async function uploadToCloudinary(file) {
      const formData = new FormData();
      formData.append('file', file);
      formData.append('upload_preset', UPLOAD_PRESET);
      const res = await fetch(`https://api.cloudinary.com/v1_1/${CLOUD_NAME}/image/upload`, { method: 'POST', body: formData });
      if (!res.ok) throw new Error('업로드 실패');
      const data = await res.json();
      if (!data.secure_url) throw new Error('URL 없음');
      return data.secure_url;
    }

    window.openModal = function() {
      modalMode = 'new';
      document.getElementById('modal-title').textContent = '➕ 새 앨범';
      document.getElementById('submit-btn').textContent = '📸 앨범 만들기';
      document.getElementById('upload-group').style.display = 'block';
      document.getElementById('form-title').value = '';
      document.getElementById('form-title').parentElement.style.display = 'block';
      selectedFiles = [];
      renderPreviews();
      document.getElementById('modal-bg').classList.add('show');
    };

    window.openEditAlbum = function() {
      modalMode = 'edit';
      document.getElementById('modal-title').textContent = '✏️ 제목 수정';
      document.getElementById('submit-btn').textContent = '✅ 수정 완료';
      document.getElementById('upload-group').style.display = 'none';
      document.getElementById('form-title').parentElement.style.display = 'block';
      document.getElementById('form-title').value = currentAlbum.title;
      document.getElementById('modal-bg').classList.add('show');
    };

    window.openAddPhotos = function() {
      modalMode = 'addPhotos';
      document.getElementById('modal-title').textContent = '➕ 사진 추가';
      document.getElementById('submit-btn').textContent = '📸 사진 추가';
      document.getElementById('upload-group').style.display = 'block';
      document.getElementById('form-title').parentElement.style.display = 'none';
      selectedFiles = [];
      renderPreviews();
      document.getElementById('modal-bg').classList.add('show');
    };

    window.closeModal = function() {
      document.getElementById('modal-bg').classList.remove('show');
      selectedFiles = [];
      document.getElementById('form-title').parentElement.style.display = 'block';
    };

    window.submitAlbum = async function() {
      const btn = document.getElementById('submit-btn');
      if (!db) { alert('잠시 후 다시 시도해주세요'); return; }

      if (modalMode === 'edit') {
        const title = document.getElementById('form-title').value.trim();
        if (!title) { alert('제목을 입력해주세요!'); return; }
        btn.disabled = true; btn.textContent = '수정 중...';
        try {
          await window._updateDoc(window._doc(db, 'albums', currentAlbum.id), { title });
          alert('수정되었습니다! ✅');
          closeModal();
          await loadAlbums();
          currentAlbum.title = title;
          document.getElementById('detail-title').textContent = title;
        } catch(e) { alert('수정 중 오류가 발생했습니다 😢'); }
        finally { btn.disabled = false; btn.textContent = '✅ 수정 완료'; }
        return;
      }

      if (modalMode === 'addPhotos') {
        if (selectedFiles.length === 0) { alert('사진을 선택해주세요!'); return; }
        btn.disabled = true;
        try {
          const urls = [];
          for (let i = 0; i < selectedFiles.length; i++) {
            btn.textContent = `업로드 중... (${i+1}/${selectedFiles.length})`;
            urls.push(await uploadToCloudinary(selectedFiles[i]));
          }
          const newPhotos = [...(currentAlbum.photos || []), ...urls];
          await window._updateDoc(window._doc(db, 'albums', currentAlbum.id), { photos: newPhotos });
          alert('사진이 추가되었습니다! ✅');
          closeModal();
          await loadAlbums();
          currentAlbum = allAlbums.find(a => a.id === currentAlbum.id);
          openAlbum(currentAlbum.id);
        } catch(e) { alert('업로드 중 오류가 발생했습니다 😢'); }
        finally { btn.disabled = false; btn.textContent = '📸 사진 추가'; }
        return;
      }

      const title = document.getElementById('form-title').value.trim();
      if (!title) { alert('앨범 제목을 입력해주세요!'); return; }
      if (selectedFiles.length === 0) { alert('사진을 1장 이상 선택해주세요!'); return; }
      btn.disabled = true;
      try {
        const urls = [];
        for (let i = 0; i < selectedFiles.length; i++) {
          btn.textContent = `업로드 중... (${i+1}/${selectedFiles.length})`;
          urls.push(await uploadToCloudinary(selectedFiles[i]));
        }
        await window._addDoc(window._collection(db, 'albums'), { title, photos: urls, createdAt: new Date() });
        alert('앨범이 만들어졌습니다! ✅');
        closeModal();
        await loadAlbums();
      } catch(e) { alert('업로드 중 오류가 발생했습니다 😢'); }
      finally { btn.disabled = false; btn.textContent = '📸 앨범 만들기'; }
    };

    window.deleteAlbum = async function() {
      if (!confirm('이 앨범을 삭제할까요?\n(사진 전체가 삭제됩니다)')) return;
      try {
        await window._deleteDoc(window._doc(db, 'albums', currentAlbum.id));
        alert('삭제되었습니다 ✅');
        goBack();
        await loadAlbums();
      } catch(e) { console.error(e); alert('삭제 중 오류가 발생했습니다 😢'); }
    };

    initFirebase();
  </script>
</body>
</html>
