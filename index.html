<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#1a7c3e">
  <link rel="manifest" href="manifest.json">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="YSFC">
  <link rel="apple-touch-icon" href="logo.png">
  <title>YSFC</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Apple SD Gothic Neo', '맑은 고딕', sans-serif; background: #f5f6f8; }

    /* 헤더 */
    .header { background: white; padding: 16px 20px 14px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid #f0f0f0; }
    .header-left { display: flex; align-items: center; gap: 12px; }
    .header-logo { width: 44px; height: 44px; border-radius: 12px; object-fit: contain; background: #f0f0f0; }
    .header-text .name { font-size: 18px; font-weight: 700; color: #111; letter-spacing: -0.5px; }
    .header-text .sub { font-size: 10px; color: #aaa; letter-spacing: 0.3px; margin-top: 1px; }
    .mypage-btn { display: flex; align-items: center; gap: 6px; background: #f5f6f8; border: none; border-radius: 20px; padding: 8px 14px; font-size: 12px; font-weight: 600; color: #555; cursor: pointer; text-decoration: none; }

    /* 최근경기 */
    .match-section { padding: 16px 16px 0; }
    .section-label { font-size: 11px; font-weight: 700; color: #aaa; letter-spacing: 0.8px; margin-bottom: 10px; }
    .match-card { background: white; border-radius: 16px; padding: 18px; border: 1px solid #f0f0f0; }
    .match-inner { display: flex; align-items: center; justify-content: space-around; }
    .team-block { text-align: center; }
    .team-name { font-size: 12px; font-weight: 700; color: #1a7c3e; margin-bottom: 6px; }
    .team-name.opp { color: #999; }
    .team-score { font-size: 34px; font-weight: 700; color: #111; line-height: 1; }
    .team-score.opp { color: #bbb; }
    .match-vs { text-align: center; }
    .vs-text { font-size: 11px; color: #ddd; font-weight: 700; display: block; margin-bottom: 8px; }
    .result-pill { font-size: 11px; font-weight: 700; padding: 5px 12px; border-radius: 20px; }
    .result-win { background: #e8f5ee; color: #1a7c3e; }
    .result-draw { background: #fff8e1; color: #f59e0b; }
    .result-lose { background: #fde8e8; color: #e53e3e; }
    .match-meta { margin-top: 14px; padding-top: 12px; border-top: 1px solid #f5f5f5; display: flex; justify-content: space-between; font-size: 11px; color: #bbb; }

    /* 공지 배너 */
    .notice-banner { margin: 14px 16px 0; background: white; border-radius: 14px; border: 1px solid #f0f0f0; padding: 14px 16px; display: flex; align-items: center; gap: 12px; text-decoration: none; }
    .notice-bar-line { width: 4px; height: 36px; background: #1a7c3e; border-radius: 4px; flex-shrink: 0; }
    .notice-bar-content { flex: 1; }
    .notice-bar-label { font-size: 10px; font-weight: 700; color: #1a7c3e; letter-spacing: 0.5px; margin-bottom: 4px; }
    .notice-bar-title { font-size: 13px; font-weight: 600; color: #111; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .notice-arrow { font-size: 16px; color: #ddd; }
    .unread-dot { width: 8px; height: 8px; background: #ef4444; border-radius: 50%; flex-shrink: 0; display: none; }

    /* 메뉴 */
    .menu-section { padding: 14px 16px 0; }
    .menu-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .menu-card { background: white; border: 1px solid #eef5ef; border-radius: 14px; padding: 14px 12px; display: flex; align-items: center; gap: 10px; text-decoration: none; transition: transform 0.1s; }
    .menu-card:active { transform: scale(0.97); }
    .menu-icon-wrap { width: 36px; height: 36px; border-radius: 10px; background: #1a7c3e; display: flex; align-items: center; justify-content: center; font-size: 18px; flex-shrink: 0; }
    .menu-text .label { font-size: 13px; font-weight: 700; color: #111; }
    .menu-text .desc { font-size: 10px; color: #bbb; margin-top: 2px; }
    .menu-card .badge { background: #ef4444; color: white; font-size: 9px; font-weight: 700; padding: 1px 5px; border-radius: 8px; margin-left: 4px; display: none; }

    /* 바텀 네비 */
    .bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; background: white; border-top: 1px solid #f0f0f0; display: flex; justify-content: space-around; padding: 10px 0 18px; }
    .nav-item { text-align: center; text-decoration: none; color: #ccc; font-size: 10px; display: flex; flex-direction: column; align-items: center; gap: 3px; }
    .nav-item.active { color: #1a7c3e; }
    .nav-icon { font-size: 22px; }
    .nav-dot { width: 4px; height: 4px; background: #ef4444; border-radius: 50%; display: none; }

    .content { padding-bottom: 90px; }
    .loading-text { text-align: center; padding: 20px; color: #bbb; font-size: 13px; }
  </style>
</head>
<body>

  <!-- 헤더 -->
  <div class="header">
    <div class="header-left">
      <img src="logo.png" alt="YSFC" class="header-logo">
      <div class="header-text">
        <div class="name">YSFC</div>
        <div class="sub">용인 유소년 축구클럽</div>
      </div>
    </div>
    <a href="mypage.html" class="mypage-btn">👤 내 정보</a>
  </div>

  <div class="content">

    <!-- 최근 경기 -->
    <div class="match-section">
      <div class="section-label">최근 경기 결과</div>
      <div class="match-card" id="match-card">
        <div class="loading-text">불러오는 중...</div>
      </div>
    </div>

    <!-- 공지 배너 -->
    <a href="notice.html" class="notice-banner" id="notice-banner">
      <div class="notice-bar-line"></div>
      <div class="notice-bar-content">
        <div class="notice-bar-label">최신 공지</div>
        <div class="notice-bar-title" id="banner-title">불러오는 중...</div>
      </div>
      <div class="unread-dot" id="unread-dot"></div>
      <div class="notice-arrow">›</div>
    </a>

    <!-- 메뉴 -->
    <div class="menu-section">
      <div class="menu-grid">
        <a href="notice.html" class="menu-card">
          <div class="menu-icon-wrap">📢</div>
          <div class="menu-text">
            <div class="label">공지사항 <span class="badge" id="notice-badge"></span></div>
            <div class="desc">알림·유니폼·차량</div>
          </div>
        </a>
        <a href="gallery.html" class="menu-card">
          <div class="menu-icon-wrap">📸</div>
          <div class="menu-text">
            <div class="label">사진첩</div>
            <div class="desc">경기·훈련 사진</div>
          </div>
        </a>
        <a href="schedule.html" class="menu-card">
          <div class="menu-icon-wrap">📅</div>
          <div class="menu-text">
            <div class="label">일정</div>
            <div class="desc">월간 계획표</div>
          </div>
        </a>
        <a href="record.html" class="menu-card">
          <div class="menu-icon-wrap">🏆</div>
          <div class="menu-text">
            <div class="label">경기 기록</div>
            <div class="desc">전적·승률</div>
          </div>
        </a>
        <a href="players.html" class="menu-card">
          <div class="menu-icon-wrap">👦</div>
          <div class="menu-text">
            <div class="label">선수 명단</div>
            <div class="desc">학년별 선수</div>
          </div>
        </a>
        <a href="cheer.html" class="menu-card">
          <div class="menu-icon-wrap">🎵</div>
          <div class="menu-text">
            <div class="label">응원가</div>
            <div class="desc">YS FC 응원가</div>
          </div>
        </a>
      </div>
    </div>

  </div>

  <!-- 바텀 네비 -->
  <nav class="bottom-nav">
    <a href="index.html" class="nav-item active">
      <span class="nav-icon">🏠</span>홈
    </a>
    <a href="notice.html" class="nav-item">
      <span class="nav-icon">📢</span>공지
      <span class="nav-dot" id="nav-dot"></span>
    </a>
    <a href="schedule.html" class="nav-item">
      <span class="nav-icon">📅</span>일정
    </a>
    <a href="gallery.html" class="nav-item">
      <span class="nav-icon">📸</span>사진
    </a>
    <a href="players.html" class="nav-item">
      <span class="nav-icon">👦</span>선수
    </a>
  </nav>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.14.0/firebase-app.js";
    import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/12.14.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyABY7cdBTXJVbnNVVJmhuo9nXNLerbtVEo",
      authDomain: "ysfc-app-ff413.firebaseapp.com",
      projectId: "ysfc-app-ff413",
      storageBucket: "ysfc-app-ff413.firebasestorage.app",
      messagingSenderId: "791661747168",
      appId: "1:791661747168:web:3540aacb15306331afe985"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const readNotices = JSON.parse(localStorage.getItem('readNotices') || '[]');

    async function loadLatestNotice() {
      try {
        const snapshot = await getDocs(collection(db, 'notices'));
        const notices = [];
        snapshot.forEach(doc => notices.push({ id: doc.id, ...doc.data() }));
        notices.sort((a, b) => {
          const ta = a.createdAt?.toDate ? a.createdAt.toDate().getTime() : 0;
          const tb = b.createdAt?.toDate ? b.createdAt.toDate().getTime() : 0;
          return tb - ta;
        });
        if (notices.length > 0) {
          document.getElementById('banner-title').textContent = notices[0].title;
          const unread = notices.filter(n => !readNotices.includes(n.id)).length;
          if (unread > 0) {
            const badge = document.getElementById('notice-badge');
            badge.textContent = unread;
            badge.style.display = 'inline-block';
            document.getElementById('unread-dot').style.display = 'block';
            document.getElementById('nav-dot').style.display = 'block';
          }
        } else {
          document.getElementById('banner-title').textContent = '등록된 공지사항이 없습니다';
        }
      } catch(e) {
        document.getElementById('banner-title').textContent = '공지사항 확인하기';
      }
    }

    async function loadLatestMatch() {
      try {
        const snapshot = await getDocs(collection(db, 'matches'));
        const matches = [];
        snapshot.forEach(doc => matches.push({ id: doc.id, ...doc.data() }));
        if (matches.length === 0) {
          document.getElementById('match-card').innerHTML = '<div class="loading-text">아직 경기 기록이 없습니다</div>';
          return;
        }
        matches.sort((a, b) => {
          const da = a.matchDate || '', db_ = b.matchDate || '';
          if (da !== db_) return da < db_ ? 1 : -1;
          const ta = a.createdAt?.toDate ? a.createdAt.toDate().getTime() : 0;
          const tb = b.createdAt?.toDate ? b.createdAt.toDate().getTime() : 0;
          return tb - ta;
        });
        const m = matches[0];
        let us = 0, them = 0;
        if (Array.isArray(m.scores)) {
          m.scores.forEach(s => { us += s.us || 0; them += s.them || 0; });
        }
        const result = us > them ? 'win' : us === them ? 'draw' : 'lose';
        const resultLabel = result === 'win' ? '승리 🏆' : result === 'draw' ? '무승부 🤝' : '패배 💪';
        const typeLabel = m.type === 'tour' ? '🏆 대회' : '⚽ 연습경기';
        const dateStr = m.matchDate ? m.matchDate.replace(/-/g, '.') : '';
        const grades = Array.isArray(m.grades) ? m.grades.filter(g=>g!=='전체').map(g=>g+'학년').join('·') : '';
        document.getElementById('match-card').innerHTML =
          '<div class="match-inner">' +
            '<div class="team-block">' +
              '<div class="team-name">YSFC</div>' +
              '<div class="team-score">' + us + '</div>' +
            '</div>' +
            '<div class="match-vs">' +
              '<span class="vs-text">VS</span>' +
              '<span class="result-pill result-' + result + '">' + resultLabel + '</span>' +
            '</div>' +
            '<div class="team-block">' +
              '<div class="team-name opp">' + (m.opponent || '상대팀') + '</div>' +
              '<div class="team-score opp">' + them + '</div>' +
            '</div>' +
          '</div>' +
          '<div class="match-meta">' +
            '<span>' + typeLabel + (m.tourName ? ' · ' + m.tourName : '') + '</span>' +
            '<span>' + (grades ? grades + ' · ' : '') + dateStr + '</span>' +
          '</div>';
      } catch(e) {
        document.getElementById('match-card').innerHTML = '<div class="loading-text">경기 기록을 불러올 수 없습니다</div>';
      }
    }

    loadLatestNotice();
    loadLatestMatch();
  </script>

</body>
</html>
