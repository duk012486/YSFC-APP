<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#1a7c3e">
  <link rel="manifest" href="manifest.json">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="YSFC">
  <link rel="apple-touch-icon" href="logo.png">
  <title>YSFC</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; overflow: hidden; }
    body { font-family: 'Apple SD Gothic Neo', '맑은 고딕', sans-serif; background: #f5f6f8; display: flex; flex-direction: column; }

    /* 헤더 */
    .header { background: white; padding: 12px 16px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid #f0f0f0; flex-shrink: 0; }
    .header-left { display: flex; align-items: center; gap: 10px; }
    .header-logo { width: 40px; height: 40px; border-radius: 10px; object-fit: contain; }
    .header-text .name { font-size: 17px; font-weight: 700; color: #111; letter-spacing: -0.5px; }
    .header-text .sub { font-size: 10px; color: #aaa; margin-top: 1px; }
    .mypage-btn { background: #f5f6f8; border: none; border-radius: 20px; padding: 7px 12px; font-size: 12px; font-weight: 600; color: #555; cursor: pointer; text-decoration: none; display: flex; align-items: center; gap: 4px; }

    /* 학년 탭 */
    .grade-bar { background: white; display: flex; gap: 6px; padding: 8px 14px; overflow-x: auto; border-bottom: 1px solid #f0f0f0; flex-shrink: 0; }
    .grade-bar::-webkit-scrollbar { display: none; }
    .grade-tab { padding: 5px 14px; font-size: 12px; font-weight: 700; color: #888; background: #f4f4f4; border: none; border-radius: 20px; cursor: pointer; white-space: nowrap; flex-shrink: 0; }
    .grade-tab.active { background: #1a7c3e; color: white; }

    /* 스크롤 콘텐츠 */
    .content { flex: 1; overflow-y: auto; padding: 10px 14px; display: flex; flex-direction: column; gap: 10px; }
    .content::-webkit-scrollbar { display: none; }

    /* 카드 공통 */
    .card { background: white; border-radius: 14px; padding: 14px; border: 1px solid #f0f0f0; }
    .card-label { font-size: 10px; font-weight: 700; color: #aaa; letter-spacing: 0.8px; margin-bottom: 10px; }

    /* 선수 현황 */
    .player-stats { display: flex; align-items: center; gap: 12px; }
    .player-total { text-align: center; min-width: 52px; }
    .player-total .num { font-size: 30px; font-weight: 700; color: #1a7c3e; line-height: 1; }
    .player-total .lbl { font-size: 9px; color: #aaa; margin-top: 4px; }
    .divider-v { width: 1px; background: #f0f0f0; align-self: stretch; flex-shrink: 0; }
    .grade-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; flex: 1; }
    .grade-item { background: #f8fffe; border-radius: 8px; padding: 7px 10px; display: flex; justify-content: space-between; align-items: center; }
    .grade-item .g-name { font-size: 11px; font-weight: 700; }
    .grade-item .g-count { font-size: 13px; font-weight: 700; color: #111; }
    .g2 { color: #2563eb; }
    .g3 { color: #16a34a; }
    .g4 { color: #ca8a04; }
    .g5 { color: #ea580c; }
    .g6 { color: #4b5563; }
    .no-player { text-align: center; padding: 12px; color: #bbb; font-size: 12px; }

    /* 다음 일정 */
    .sched-item { display: flex; align-items: center; gap: 10px; padding: 10px; border-radius: 10px; margin-bottom: 8px; }
    .sched-item:last-child { margin-bottom: 0; }
    .sched-practice { background: #f0f7ff; border-left: 3px solid #0284c7; }
    .sched-tour { background: #fff8f0; border-left: 3px solid #e67e22; }
    .sched-normal { background: #f0fff4; border-left: 3px solid #1a7c3e; }
    .sched-off { background: #fce4ec; border-left: 3px solid #e91e63; }
    .sched-date { text-align: center; min-width: 30px; }
    .sched-date .d { font-size: 17px; font-weight: 700; }
    .sched-date .w { font-size: 9px; margin-top: 1px; }
    .practice-d { color: #0284c7; }
    .practice-w { color: #7ab8d9; }
    .tour-d { color: #e67e22; }
    .tour-w { color: #e6a87e; }
    .normal-d { color: #1a7c3e; }
    .normal-w { color: #7ab89e; }
    .sched-div { width: 1px; height: 28px; background: rgba(0,0,0,0.08); flex-shrink: 0; }
    .sched-info { flex: 1; }
    .sched-name { font-size: 12px; font-weight: 700; color: #111; }
    .sched-sub { font-size: 10px; color: #999; margin-top: 2px; }
    .sched-badge { font-size: 9px; font-weight: 700; padding: 3px 7px; border-radius: 8px; flex-shrink: 0; }
    .badge-practice { background: #0284c7; color: white; }
    .badge-tour { background: #e67e22; color: white; }
    .badge-grade { background: #e8f5ee; color: #1a7c3e; }
    .dday { font-size: 10px; font-weight: 700; color: #e67e22; }
    .no-sched { text-align: center; padding: 14px; color: #bbb; font-size: 12px; }

    /* 공지 배너 */
    .notice-banner { background: white; border-radius: 14px; padding: 12px 14px; border: 1px solid #f0f0f0; display: flex; align-items: center; gap: 10px; text-decoration: none; flex-shrink: 0; }
    .notice-line { width: 4px; height: 32px; background: #1a7c3e; border-radius: 3px; flex-shrink: 0; }
    .notice-content { flex: 1; min-width: 0; }
    .notice-lbl { font-size: 9px; font-weight: 700; color: #1a7c3e; letter-spacing: 0.5px; }
    .notice-title { font-size: 12px; font-weight: 600; color: #111; margin-top: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .notice-arrow { color: #ddd; font-size: 16px; }
    .unread-dot { width: 7px; height: 7px; background: #ef4444; border-radius: 50%; flex-shrink: 0; display: none; }

    /* 메뉴 그리드 */
    .menu-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 7px; }
    .menu-card { background: white; border: 1px solid #eef5ef; border-radius: 12px; padding: 11px 10px; display: flex; align-items: center; gap: 8px; text-decoration: none; }
    .menu-card:active { opacity: 0.8; }
    .menu-icon { width: 32px; height: 32px; border-radius: 9px; background: #1a7c3e; display: flex; align-items: center; justify-content: center; font-size: 16px; flex-shrink: 0; }
    .menu-label { font-size: 12px; font-weight: 700; color: #111; }
    .menu-desc { font-size: 9px; color: #bbb; margin-top: 1px; }
    .menu-badge { background: #ef4444; color: white; font-size: 9px; font-weight: 700; padding: 1px 5px; border-radius: 8px; margin-left: 3px; display: none; }

    /* 바텀 네비 */
    .bottom-nav { background: white; border-top: 1px solid #f0f0f0; display: flex; justify-content: space-around; padding: 8px 0 max(14px, env(safe-area-inset-bottom)); flex-shrink: 0; }
    .nav-item { text-align: center; text-decoration: none; color: #ccc; font-size: 10px; display: flex; flex-direction: column; align-items: center; gap: 2px; min-width: 44px; }
    .nav-item.active { color: #1a7c3e; }
    .nav-icon { font-size: 20px; }
  </style>
</head>
<body>

  <!-- 헤더 -->
  <div class="header">
    <div class="header-left">
      <img src="logo.png" alt="YSFC" class="header-logo">
      <div class="header-text">
        <div class="name">YSFC</div>
        <div class="sub">용인 유소년 축구클럽</div>
      </div>
    </div>
    <a href="mypage.html" class="mypage-btn">👤 내 정보</a>
  </div>

  <!-- 학년 탭 -->
  <div class="grade-bar" id="grade-bar">
    <button class="grade-tab active" onclick="setGrade('전체', this)">전체</button>
    <button class="grade-tab" onclick="setGrade('2', this)">2학년</button>
    <button class="grade-tab" onclick="setGrade('3', this)">3학년</button>
    <button class="grade-tab" onclick="setGrade('4', this)">4학년</button>
    <button class="grade-tab" onclick="setGrade('5', this)">5학년</button>
    <button class="grade-tab" onclick="setGrade('6', this)">6학년</button>
  </div>

  <!-- 콘텐츠 -->
  <div class="content" id="content">

    <!-- 선수 현황 -->
    <div class="card">
      <div class="card-label">선수 현황</div>
      <div id="player-stats"><div class="no-player">불러오는 중...</div></div>
    </div>

    <!-- 다음 일정 -->
    <div class="card">
      <div class="card-label">다음 일정</div>
      <div id="next-sched"><div class="no-sched">불러오는 중...</div></div>
    </div>

    <!-- 공지 배너 -->
    <a href="notice.html" class="notice-banner" id="notice-banner">
      <div class="notice-line"></div>
      <div class="notice-content">
        <div class="notice-lbl">최신 공지</div>
        <div class="notice-title" id="banner-title">불러오는 중...</div>
      </div>
      <div class="unread-dot" id="unread-dot"></div>
      <div class="notice-arrow">›</div>
    </a>

    <!-- 메뉴 -->
    <div class="menu-grid">
      <a href="notice.html" class="menu-card">
        <div class="menu-icon">📢</div>
        <div><div class="menu-label">공지사항<span class="menu-badge" id="notice-badge"></span></div><div class="menu-desc">알림·유니폼·차량</div></div>
      </a>
      <a href="gallery.html" class="menu-card">
        <div class="menu-icon">📸</div>
        <div><div class="menu-label">사진첩</div><div class="menu-desc">경기·훈련 사진</div></div>
      </a>
      <a href="schedule.html" class="menu-card">
        <div class="menu-icon">📅</div>
        <div><div class="menu-label">일정</div><div class="menu-desc">월간 계획표</div></div>
      </a>
      <a href="record.html" class="menu-card">
        <div class="menu-icon">🏆</div>
        <div><div class="menu-label">경기 기록</div><div class="menu-desc">전적·승률</div></div>
      </a>
      <a href="players.html" class="menu-card">
        <div class="menu-icon">👦</div>
        <div><div class="menu-label">선수 명단</div><div class="menu-desc">학년별 선수</div></div>
      </a>
      <a href="cheer.html" class="menu-card">
        <div class="menu-icon">🎵</div>
        <div><div class="menu-label">응원가</div><div class="menu-desc">YS FC 응원가</div></div>
      </a>
    </div>

  </div>

  <!-- 바텀 네비 -->
  <nav class="bottom-nav">
    <a href="index.html" class="nav-item active"><span class="nav-icon">🏠</span>홈</a>
    <a href="notice.html" class="nav-item"><span class="nav-icon">📢</span>공지</a>
    <a href="schedule.html" class="nav-item"><span class="nav-icon">📅</span>일정</a>
    <a href="gallery.html" class="nav-item"><span class="nav-icon">📸</span>사진</a>
    <a href="players.html" class="nav-item"><span class="nav-icon">👦</span>선수</a>
  </nav>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.14.0/firebase-app.js";
    import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/12.14.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyABY7cdBTXJVbnNVVJmhuo9nXNLerbtVEo",
      authDomain: "ysfc-app-ff413.firebaseapp.com",
      projectId: "ysfc-app-ff413",
      storageBucket: "ysfc-app-ff413.firebasestorage.app",
      messagingSenderId: "791661747168",
      appId: "1:791661747168:web:3540aacb15306331afe985"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const readNotices = JSON.parse(localStorage.getItem('readNotices') || '[]');
    const weekdays = ['일','월','화','수','목','금','토'];
    const gradeColors = { '2':'g2','3':'g3','4':'g4','5':'g5','6':'g6' };

    let allPlayers = [];
    let allSchedules = [];
    let currentGrade = '전체';

    async function loadAll() {
      try {
        // 선수
        const psnap = await getDocs(collection(db, 'players'));
        allPlayers = [];
        psnap.forEach(d => allPlayers.push({ id: d.id, ...d.data() }));

        // 일정
        const ssnap = await getDocs(collection(db, 'schedules'));
        allSchedules = [];
        ssnap.forEach(d => allSchedules.push({ id: d.id, ...d.data() }));

        // 공지
        const nsnap = await getDocs(collection(db, 'notices'));
        const notices = [];
        nsnap.forEach(d => notices.push({ id: d.id, ...d.data() }));
        notices.sort((a, b) => {
          const ta = a.createdAt?.toDate ? a.createdAt.toDate().getTime() : 0;
          const tb = b.createdAt?.toDate ? b.createdAt.toDate().getTime() : 0;
          return tb - ta;
        });
        if (notices.length > 0) {
          document.getElementById('banner-title').textContent = notices[0].title;
          const unread = notices.filter(n => !readNotices.includes(n.id)).length;
          if (unread > 0) {
            const badge = document.getElementById('notice-badge');
            badge.textContent = unread; badge.style.display = 'inline-block';
            document.getElementById('unread-dot').style.display = 'block';
          }
        } else {
          document.getElementById('banner-title').textContent = '등록된 공지사항이 없습니다';
        }

        renderAll();
      } catch(e) {
        console.error(e);
        document.getElementById('player-stats').innerHTML = '<div class="no-player">불러올 수 없습니다 😢</div>';
        document.getElementById('next-sched').innerHTML = '<div class="no-sched">불러올 수 없습니다 😢</div>';
      }
    }

    function getGrades(item) {
      if (Array.isArray(item.grades)) return item.grades;
      if (item.grade) return [String(item.grade)];
      return ['전체'];
    }

    function matchGrade(item) {
      if (currentGrade === '전체') return true;
      const g = getGrades(item);
      return g.includes('전체') || g.includes(currentGrade);
    }

    function renderPlayerStats() {
      const filtered = allPlayers.filter(matchGrade);
      if (currentGrade === '전체') {
        // 학년별 집계
        const counts = {};
        ['2','3','4','5','6'].forEach(g => counts[g] = 0);
        allPlayers.forEach(p => {
          const g = String(p.grade);
          if (counts[g] !== undefined) counts[g]++;
        });
        const total = allPlayers.length;
        if (total === 0) {
          document.getElementById('player-stats').innerHTML = '<div class="no-player">등록된 선수가 없습니다</div>';
          return;
        }
        let gridHtml = ['2','3','4','5','6'].map(g =>
          counts[g] > 0
            ? `<div class="grade-item"><span class="g-name ${gradeColors[g]}">${g}학년</span><span class="g-count">${counts[g]}명</span></div>`
            : ''
        ).filter(Boolean).join('');
        document.getElementById('player-stats').innerHTML =
          `<div class="player-stats">
            <div class="player-total"><div class="num">${total}</div><div class="lbl">전체 선수</div></div>
            <div class="divider-v"></div>
            <div class="grade-grid">${gridHtml}</div>
          </div>`;
      } else {
        const total = filtered.length;
        if (total === 0) {
          document.getElementById('player-stats').innerHTML = `<div class="no-player">${currentGrade}학년 등록 선수가 없습니다</div>`;
          return;
        }
        // 포지션 집계
        const posCounts = {};
        filtered.forEach(p => {
          const pos = Array.isArray(p.positions) ? p.positions : (p.pos ? [p.pos] : []);
          pos.forEach(po => { posCounts[po] = (posCounts[po] || 0) + 1; });
        });
        let posHtml = Object.entries(posCounts).map(([pos, cnt]) =>
          `<div class="grade-item"><span class="g-name" style="color:#1a7c3e;">${pos}</span><span class="g-count">${cnt}명</span></div>`
        ).join('');
        document.getElementById('player-stats').innerHTML =
          `<div class="player-stats">
            <div class="player-total"><div class="num">${total}</div><div class="lbl">${currentGrade}학년</div></div>
            <div class="divider-v"></div>
            <div class="grade-grid">${posHtml || '<div style="color:#bbb;font-size:11px;">포지션 미등록</div>'}</div>
          </div>`;
      }
    }

    function renderNextSchedule() {
      const today = new Date();
      today.setHours(0,0,0,0);
      const filtered = allSchedules
        .filter(matchGrade)
        .filter(s => {
          const d = new Date((s.date || s.startDate || '') + 'T00:00:00');
          return d >= today && (s.type === 'practice' || s.type === 'tour' || s.type === 'tour-start');
        })
        .sort((a,b) => (a.date||a.startDate) > (b.date||b.startDate) ? 1 : -1)
        .slice(0, 3);

      if (filtered.length === 0) {
        document.getElementById('next-sched').innerHTML = '<div class="no-sched">예정된 경기·대회 일정이 없습니다</div>';
        return;
      }

      const html = filtered.map(s => {
        const dateStr = s.date || s.startDate;
        const d = new Date(dateStr + 'T00:00:00');
        const dayNum = d.getDate();
        const dayW = weekdays[d.getDay()];
        const diff = Math.ceil((d - today) / 86400000);
        const dday = diff === 0 ? 'D-Day' : 'D-' + diff;
        const grades = getGrades(s).filter(g => g !== '전체');
        const gradeStr = grades.length > 0 ? grades.map(g => g + '학년').join('·') : '';

        if (s.type === 'practice') {
          return `<div class="sched-item sched-practice">
            <div class="sched-date"><div class="d practice-d">${dayNum}</div><div class="w practice-w">${dayW}</div></div>
            <div class="sched-div"></div>
            <div class="sched-info">
              <div class="sched-name">⚽ 연습경기${s.opponent ? ' vs ' + s.opponent : ''}</div>
              <div class="sched-sub">${s.place ? '📍 ' + s.place + ' · ' : ''}${dday}</div>
            </div>
            ${gradeStr ? `<span class="sched-badge badge-grade">${gradeStr}</span>` : ''}
          </div>`;
        } else {
          return `<div class="sched-item sched-tour">
            <div class="sched-date"><div class="d tour-d">${dayNum}</div><div class="w tour-w">${dayW}</div></div>
            <div class="sched-div"></div>
            <div class="sched-info">
              <div class="sched-name">🏆 ${s.name || '대회'}</div>
              <div class="sched-sub">${s.place ? '📍 ' + s.place + ' · ' : ''}${dday}</div>
            </div>
            ${gradeStr ? `<span class="sched-badge badge-grade">${gradeStr}</span>` : ''}
          </div>`;
        }
      }).join('');

      document.getElementById('next-sched').innerHTML = html;
    }

    function renderAll() {
      renderPlayerStats();
      renderNextSchedule();
    }

    window.setGrade = function(grade, el) {
      currentGrade = grade;
      document.querySelectorAll('.grade-tab').forEach(t => t.classList.remove('active'));
      el.classList.add('active');
      renderAll();
    };

    loadAll();
  </script>

</body>
</html>
