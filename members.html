<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>회원현황 · YSFC</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Apple SD Gothic Neo', '맑은 고딕', sans-serif; background: #f7f4f0; }
    .app { max-width: 480px; margin: 0 auto; min-height: 100vh; background: #f7f4f0; }
    .header { background: white; padding: 12px 16px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid #f0ebe5; position: sticky; top: 0; z-index: 10; }
    .header-left { display: flex; align-items: center; gap: 10px; }
    .back-btn { font-size: 20px; text-decoration: none; color: #333; background: #f5f0ea; width: 34px; height: 34px; border-radius: 50%; display: flex; align-items: center; justify-content: center; }
    .header h1 { font-size: 16px; font-weight: 700; color: #111; }
    .admin-btn { background: #f5f0ea; color: #555; border: none; padding: 7px 12px; border-radius: 20px; font-size: 12px; font-weight: 600; cursor: pointer; }
    .admin-btn.on { background: #fbbf24; color: #333; font-weight: 700; }

    .summary { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; padding: 14px; }
    .sum-card { background: white; border-radius: 14px; padding: 16px; text-align: center; border: 1px solid #f0ebe5; }
    .sum-card .n { font-size: 26px; font-weight: 800; color: #f97316; }
    .sum-card .l { font-size: 11px; color: #b09480; margin-top: 4px; }
    .sum-card.today .n { color: #3b82f6; }
    .sum-card.week .n { color: #22c55e; }

    .admin-tip { margin: 0 14px 10px; background: #fffbeb; border: 1px solid #fde68a; border-radius: 12px; padding: 10px 14px; font-size: 12px; color: #92400e; text-align: center; display: none; }
    .admin-tip.show { display: block; }

    .tab-bar { background: white; display: flex; margin: 0 14px; border-radius: 12px 12px 0 0; overflow: hidden; border-bottom: 1px solid #f0ebe5; }
    .tab { flex: 1; padding: 13px 0; font-size: 12px; font-weight: 600; color: #a08b7a; border: none; background: white; cursor: pointer; text-align: center; }
    .tab.active { color: #f97316; background: #fff7ed; }

    .list-box { background: white; margin: 0 14px 90px; border-radius: 0 0 14px 14px; border: 1px solid #f0ebe5; border-top: none; padding: 8px 0; }
    .member-row { display: flex; align-items: center; gap: 12px; padding: 12px 16px; border-bottom: 1px solid #faf7f3; }
    .member-row:last-child { border-bottom: none; }
    .rank { width: 28px; height: 28px; border-radius: 50%; background: #f5f0ea; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700; color: #a08b7a; flex-shrink: 0; }
    .rank.top1 { background: #fef3c7; color: #d97706; }
    .rank.top2 { background: #e5e7eb; color: #6b7280; }
    .rank.top3 { background: #fde8d4; color: #c2683a; }
    .m-avatar { width: 36px; height: 36px; border-radius: 50%; background: #fff7ed; border: 1.5px solid #f97316; display: flex; align-items: center; justify-content: center; font-size: 16px; flex-shrink: 0; }
    .m-info { flex: 1; min-width: 0; }
    .m-nick { font-size: 14px; font-weight: 600; color: #111; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .m-sub { font-size: 11px; color: #b09480; margin-top: 2px; }
    .m-badge { font-size: 12px; font-weight: 700; color: #f97316; flex-shrink: 0; }
    .m-badge .unit { font-size: 10px; color: #b09480; font-weight: 400; }
    .online-dot { width: 8px; height: 8px; background: #22c55e; border-radius: 50%; flex-shrink: 0; }
    .admin-actions { display: flex; gap: 5px; flex-shrink: 0; }
    .aa-btn { border: none; border-radius: 8px; padding: 5px 9px; font-size: 11px; cursor: pointer; font-weight: 600; }
    .aa-edit { background: #fff7ed; color: #ea580c; }
    .aa-del { background: #fef2f2; color: #ef4444; }
    .loading { text-align: center; padding: 40px; color: #c4b3a3; font-size: 13px; }

    .modal-center { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.4); z-index: 110; align-items: center; justify-content: center; padding: 20px; }
    .modal-center.show { display: flex; }
    .modal-center .box { background: white; border-radius: 20px; padding: 24px; width: 100%; max-width: 340px; }
    .modal-title { font-size: 16px; font-weight: 700; color: #111; margin-bottom: 8px; text-align: center; }
    .modal-sub { font-size: 12px; color: #aaa; text-align: center; margin-bottom: 16px; line-height: 1.6; }
    .form-input { width: 100%; padding: 11px 13px; border: 1px solid #eee; border-radius: 10px; font-size: 14px; font-family: inherit; background: #fafafa; }
    .form-input:focus { outline: none; border-color: #f97316; background: white; }
    .mc-btn { width: 100%; padding: 14px; background: #f97316; color: white; border: none; border-radius: 12px; font-size: 15px; font-weight: 700; cursor: pointer; margin-top: 10px; }
    .mc-cancel { width: 100%; padding: 12px; background: #f5f0ea; color: #666; border: none; border-radius: 12px; font-size: 14px; cursor: pointer; margin-top: 8px; }

    .bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; max-width: 480px; margin: 0 auto; background: white; border-top: 1px solid #f0ebe5; display: flex; justify-content: space-around; padding: 10px 0 max(12px, env(safe-area-inset-bottom)); }
    .nav-item { text-align: center; text-decoration: none; color: #c4b3a3; font-size: 10px; display: flex; flex-direction: column; align-items: center; gap: 2px; }
    .nav-item .nav-icon { font-size: 22px; }
  </style>
</head>
<body>
<div class="app">

  <div class="header">
    <div class="header-left">
      <a href="mypage.html" class="back-btn">←</a>
      <h1>👥 회원 현황</h1>
    </div>
    <button class="admin-btn" id="admin-btn" onclick="toggleAdmin()">🔑</button>
  </div>

  <div class="summary">
    <div class="sum-card">
      <div class="n" id="total-members">-</div>
      <div class="l">전체 회원</div>
    </div>
    <div class="sum-card today">
      <div class="n" id="active-today">-</div>
      <div class="l">오늘 접속</div>
    </div>
    <div class="sum-card week">
      <div class="n" id="active-week">-</div>
      <div class="l">이번주</div>
    </div>
  </div>

  <div class="admin-tip" id="admin-tip">🔑 관리자 모드 — 이름 ✏️수정 / 🗑️삭제 가능</div>

  <div class="tab-bar">
    <button class="tab active" onclick="switchTab('recent', this)">🕒 최근 접속</button>
    <button class="tab" onclick="switchTab('rank', this)">✍️ 글 순위</button>
    <button class="tab" onclick="switchTab('joined', this)">📅 가입순</button>
  </div>

  <div class="list-box" id="list-box">
    <div class="loading">회원 정보를 불러오는 중...</div>
  </div>

  <!-- 관리자 모달 -->
  <div class="modal-center" id="admin-modal">
    <div class="box">
      <div class="modal-title">🔑 관리자 모드</div>
      <div class="modal-sub">비밀번호를 입력하면<br>회원 이름을 수정·삭제할 수 있습니다.</div>
      <input class="form-input" id="admin-input" type="password" placeholder="비밀번호" />
      <button class="mc-btn" onclick="checkAdmin()">확인</button>
      <button class="mc-cancel" onclick="closeAdminModal()">취소</button>
    </div>
  </div>

  <!-- 이름 수정 모달 -->
  <div class="modal-center" id="edit-modal">
    <div class="box">
      <div class="modal-title">✏️ 이름 수정</div>
      <div class="modal-sub">회원 이름을 수정합니다.<br>(이 회원의 접속 기록만 바뀌며,<br>작성한 글의 이름은 그대로입니다)</div>
      <input class="form-input" id="edit-input" placeholder="새 이름" />
      <button class="mc-btn" onclick="saveEdit()">저장</button>
      <button class="mc-cancel" onclick="closeEdit()">취소</button>
    </div>
  </div>

  <nav class="bottom-nav">
    <a href="index.html" class="nav-item"><span class="nav-icon">🏠</span>홈</a>
    <a href="notice.html" class="nav-item"><span class="nav-icon">📢</span>공지</a>
    <a href="schedule.html" class="nav-item"><span class="nav-icon">📅</span>일정</a>
    <a href="gallery.html" class="nav-item"><span class="nav-icon">📸</span>사진</a>
    <a href="players.html" class="nav-item"><span class="nav-icon">👦</span>선수</a>
  </nav>

</div>

  <script type="module">
    import { initializeApp, getApps, getApp } from "https://www.gstatic.com/firebasejs/12.14.0/firebase-app.js";
    import { getFirestore, collection, getDocs, doc, deleteDoc, setDoc } from "https://www.gstatic.com/firebasejs/12.14.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyABY7cdBTXJVbnNVVJmhuo9nXNLerbtVEo",
      authDomain: "ysfc-app-ff413.firebaseapp.com",
      projectId: "ysfc-app-ff413",
      storageBucket: "ysfc-app-ff413.firebasestorage.app",
      messagingSenderId: "791661747168",
      appId: "1:791661747168:web:3540aacb15306331afe985"
    };
    const app = getApps().length > 0 ? getApp() : initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const ADMIN_PW = "ysfc486";

    let members = [];
    let postCounts = {};
    let currentTab = 'recent';
    let isAdmin = sessionStorage.getItem('ysfc_admin') === '1';
    let editingId = null;

    function toDate(ts) {
      if (!ts) return null;
      if (typeof ts.toDate === 'function') return ts.toDate();
      if (ts.seconds) return new Date(ts.seconds * 1000);
      return new Date(ts);
    }
    function fmtDate(d) {
      if (!d) return '-';
      return `${d.getFullYear()}.${String(d.getMonth()+1).padStart(2,'0')}.${String(d.getDate()).padStart(2,'0')}`;
    }
    function fmtAgo(d) {
      if (!d) return '-';
      const diff = Math.floor((Date.now() - d.getTime()) / 1000);
      if (diff < 60) return '방금 전';
      if (diff < 3600) return Math.floor(diff/60) + '분 전';
      if (diff < 86400) return Math.floor(diff/3600) + '시간 전';
      if (diff < 86400*7) return Math.floor(diff/86400) + '일 전';
      return fmtDate(d);
    }
    function isToday(d) {
      if (!d) return false;
      const t = new Date();
      return d.getDate()===t.getDate() && d.getMonth()===t.getMonth() && d.getFullYear()===t.getFullYear();
    }
    function isThisWeek(d) {
      if (!d) return false;
      return (Date.now() - d.getTime()) < 7*86400*1000;
    }

    window.toggleAdmin = function() {
      if (isAdmin) {
        if (confirm('관리자 모드를 끌까요?')) {
          isAdmin = false; sessionStorage.removeItem('ysfc_admin');
          updateAdminBtn(); render();
        }
      } else { document.getElementById('admin-modal').classList.add('show'); }
    };
    window.checkAdmin = function() {
      const v = document.getElementById('admin-input').value;
      if (v === ADMIN_PW) {
        isAdmin = true; sessionStorage.setItem('ysfc_admin', '1');
        document.getElementById('admin-modal').classList.remove('show');
        document.getElementById('admin-input').value = '';
        updateAdminBtn(); render();
        alert('관리자 모드 ON ✅');
      } else { alert('비밀번호가 틀렸습니다 😢'); }
    };
    window.closeAdminModal = function() {
      document.getElementById('admin-modal').classList.remove('show');
      document.getElementById('admin-input').value = '';
    };
    function updateAdminBtn() {
      const btn = document.getElementById('admin-btn');
      const tip = document.getElementById('admin-tip');
      if (isAdmin) { btn.classList.add('on'); btn.textContent = '🔑 ON'; tip.classList.add('show'); }
      else { btn.classList.remove('on'); btn.textContent = '🔑'; tip.classList.remove('show'); }
    }

    async function loadAll() {
      try {
        const msnap = await getDocs(collection(db, 'members'));
        members = [];
        msnap.forEach(d => members.push({ id: d.id, ...d.data() }));

        postCounts = {};
        const cols = ['notices', 'albums', 'players', 'matches', 'schedules', 'news'];
        for (const col of cols) {
          try {
            const snap = await getDocs(collection(db, col));
            snap.forEach(d => {
              const a = d.data().author;
              if (a) postCounts[a] = (postCounts[a] || 0) + 1;
            });
          } catch(e) {}
        }
        renderSummary();
        render();
      } catch(e) {
        console.error(e);
        document.getElementById('list-box').innerHTML = '<div class="loading">데이터를 불러올 수 없습니다 😢</div>';
      }
    }

    function renderSummary() {
      document.getElementById('total-members').textContent = members.length;
      document.getElementById('active-today').textContent = members.filter(m => isToday(toDate(m.lastSeen))).length;
      document.getElementById('active-week').textContent = members.filter(m => isThisWeek(toDate(m.lastSeen))).length;
    }

    window.switchTab = function(tab, el) {
      currentTab = tab;
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
      el.classList.add('active');
      render();
    };

    function render() {
      if (members.length === 0) {
        document.getElementById('list-box').innerHTML = '<div class="loading">아직 등록된 회원이 없습니다</div>';
        return;
      }
      let sorted = [...members];
      if (currentTab === 'recent') {
        sorted.sort((a,b) => (toDate(b.lastSeen)?.getTime()||0) - (toDate(a.lastSeen)?.getTime()||0));
      } else if (currentTab === 'joined') {
        sorted.sort((a,b) => (toDate(a.joinedAt)?.getTime()||0) - (toDate(b.joinedAt)?.getTime()||0));
      } else if (currentTab === 'rank') {
        sorted.sort((a,b) => (postCounts[b.nick]||0) - (postCounts[a.nick]||0));
      }

      document.getElementById('list-box').innerHTML = sorted.map((m, i) => {
        const rank = i + 1;
        let rankCls = '';
        if (currentTab === 'rank') {
          if (rank === 1) rankCls = 'top1'; else if (rank === 2) rankCls = 'top2'; else if (rank === 3) rankCls = 'top3';
        }
        const lastSeen = toDate(m.lastSeen);
        const joinedAt = toDate(m.joinedAt);
        const count = postCounts[m.nick] || 0;
        const online = isToday(lastSeen);
        let sub = '';
        if (currentTab === 'joined') sub = '가입 · ' + fmtDate(joinedAt);
        else sub = '마지막 접속 · ' + fmtAgo(lastSeen);

        const right = isAdmin
          ? `<div class="admin-actions">
              <button class="aa-btn aa-edit" onclick="editMember('${m.id}')">✏️</button>
              <button class="aa-btn aa-del" onclick="delMember('${m.id}','${(m.nick||'').replace(/'/g,"\\'")}')">🗑️</button>
             </div>`
          : `${online ? '<div class="online-dot"></div>' : ''}<div class="m-badge">${count}<span class="unit"> 글</span></div>`;

        return `<div class="member-row">
          <div class="rank ${rankCls}">${rank}</div>
          <div class="m-avatar">👤</div>
          <div class="m-info">
            <div class="m-nick">${m.nick}</div>
            <div class="m-sub">${sub}</div>
          </div>
          ${right}
        </div>`;
      }).join('');
    }

    // 회원 삭제
    window.delMember = async function(id, nick) {
      if (!confirm(`'${nick}' 회원을 삭제할까요?`)) return;
      try {
        await deleteDoc(doc(db, 'members', id));
        await loadAll();
      } catch(e) { alert('삭제 중 오류가 발생했습니다 😢'); }
    };

    // 이름 수정
    window.editMember = function(id) {
      const m = members.find(x => x.id === id);
      if (!m) return;
      editingId = id;
      document.getElementById('edit-input').value = m.nick || '';
      document.getElementById('edit-modal').classList.add('show');
    };
    window.closeEdit = function() {
      document.getElementById('edit-modal').classList.remove('show');
      editingId = null;
    };
    window.saveEdit = async function() {
      const newNick = document.getElementById('edit-input').value.trim();
      if (!newNick) { alert('이름을 입력해주세요!'); return; }
      const m = members.find(x => x.id === editingId);
      if (!m) return;
      try {
        // 새 이름으로 문서 생성 (공백 제거 ID)
        const newId = newNick.replace(/\s+/g, '').replace(/[\/\\#?.[\]]/g, '_');
        await setDoc(doc(db, 'members', newId), {
          nick: newNick,
          joinedAt: m.joinedAt || new Date(),
          lastSeen: m.lastSeen || new Date()
        });
        // 기존 문서 삭제 (ID가 다를 때만)
        if (newId !== m.id) {
          await deleteDoc(doc(db, 'members', m.id));
        }
        closeEdit();
        await loadAll();
        alert('수정되었습니다! ✅');
      } catch(e) { alert('수정 중 오류가 발생했습니다 😢'); }
    };

    updateAdminBtn();
    loadAll();
  </script>
 <script type="module" src="member.js"></script>
</body>
</html>
