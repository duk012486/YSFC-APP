<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>내 정보 · YSFC</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Apple SD Gothic Neo', '맑은 고딕', sans-serif; background: #f4f4f4; }
    .header { background: linear-gradient(135deg, #1a7c3e, #25a85a); color: white; padding: 16px 20px; display: flex; align-items: center; gap: 12px; }
    .back-btn { font-size: 22px; text-decoration: none; color: white; }
    .header h1 { font-size: 18px; font-weight: 700; }
    .profile-card { background: white; margin: 16px 14px; border-radius: 16px; padding: 24px; text-align: center; box-shadow: 0 2px 8px rgba(0,0,0,0.06); }
    .profile-avatar { width: 72px; height: 72px; border-radius: 50%; background: #e8f5ee; display: flex; align-items: center; justify-content: center; font-size: 36px; margin: 0 auto 12px; border: 3px solid #1a7c3e; }
    .profile-nick { font-size: 20px; font-weight: 700; color: #333; }
    .profile-role { font-size: 12px; color: #888; margin-top: 4px; }
    .admin-tag { display: inline-block; background: #fbbf24; color: #333; font-size: 11px; font-weight: 700; padding: 3px 10px; border-radius: 20px; margin-top: 8px; }
    .edit-nick-btn { margin-top: 14px; background: #e8f5ee; color: #1a7c3e; border: none; padding: 8px 18px; border-radius: 20px; font-size: 13px; font-weight: 600; cursor: pointer; }
    .stats-card { background: white; margin: 0 14px 16px; border-radius: 16px; padding: 18px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); }
    .stats-card-title { font-size: 14px; font-weight: 700; color: #333; margin-bottom: 14px; }
    .stat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .stat-item { background: #fafafa; border-radius: 12px; padding: 14px; display: flex; align-items: center; gap: 10px; }
    .stat-item .ic { font-size: 24px; }
    .stat-item .info .n { font-size: 20px; font-weight: 700; color: #1a7c3e; }
    .stat-item .info .l { font-size: 11px; color: #888; }
    .total-card { background: #1a7c3e; color: white; margin: 0 14px 16px; border-radius: 16px; padding: 18px; text-align: center; }
    .total-card .n { font-size: 32px; font-weight: 700; }
    .total-card .l { font-size: 12px; opacity: 0.9; margin-top: 2px; }
    .menu-card { background: white; margin: 0 14px 16px; border-radius: 16px; overflow: hidden; box-shadow: 0 2px 8px rgba(0,0,0,0.06); }
    .menu-row { display: flex; align-items: center; gap: 12px; padding: 16px 18px; border-bottom: 1px solid #f4f4f4; cursor: pointer; }
    .menu-row:last-child { border-bottom: none; }
    .menu-row .ic { font-size: 20px; }
    .menu-row .txt { flex: 1; font-size: 14px; color: #333; }
    .menu-row .arrow { color: #ccc; }
    .menu-row.admin-on .txt { color: #d97706; font-weight: 600; }
    .loading { text-align: center; padding: 20px; color: #aaa; font-size: 13px; }
    .modal-center { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.5); z-index: 110; align-items: center; justify-content: center; padding: 20px; }
    .modal-center.show { display: flex; }
    .modal-center .box { background: white; border-radius: 16px; padding: 24px; width: 100%; max-width: 320px; }
    .modal-title { font-size: 16px; font-weight: 700; margin-bottom: 16px; text-align: center; }
    .modal-sub { font-size: 12px; color: #888; text-align: center; margin-bottom: 16px; line-height: 1.5; }
    .form-input { width: 100%; padding: 10px 12px; border: 1px solid #eee; border-radius: 8px; font-size: 14px; font-family: inherit; }
    .mc-btn { width: 100%; padding: 14px; background: #1a7c3e; color: white; border: none; border-radius: 12px; font-size: 15px; font-weight: 700; cursor: pointer; margin-top: 8px; }
    .mc-cancel { width: 100%; padding: 12px; background: #f4f4f4; color: #666; border: none; border-radius: 12px; font-size: 14px; cursor: pointer; margin-top: 8px; }
    .bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; background: white; border-top: 1px solid #eee; display: flex; justify-content: space-around; padding: 10px 0 16px; }
    .nav-item { text-align: center; text-decoration: none; color: #aaa; font-size: 10px; }
    .nav-item.active { color: #1a7c3e; }
    .nav-item .nav-icon { font-size: 22px; display: block; margin-bottom: 2px; }
    .content { padding-bottom: 90px; }
  </style>
</head>
<body>
  <div class="header">
    <a href="index.html" class="back-btn">←</a>
    <h1>👤 내 정보</h1>
  </div>

  <div class="content">
    <div class="profile-card">
      <div class="profile-avatar">👤</div>
      <div class="profile-nick" id="profile-nick">-</div>
      <div class="profile-role">YSFC</div>
      <div id="admin-tag-wrap"></div>
      <br>
      <button class="edit-nick-btn" onclick="openNickEdit()">✏️ 이름 변경</button>
    </div>

    <div class="total-card">
      <div class="n" id="total-count">-</div>
      <div class="l">내가 올린 전체 글</div>
    </div>

    <div class="stats-card">
      <div class="stats-card-title">📊 내가 올린 글</div>
      <div class="stat-grid">
        <div class="stat-item"><span class="ic">📢</span><div class="info"><div class="n" id="c-notice">-</div><div class="l">공지사항</div></div></div>
        <div class="stat-item"><span class="ic">📸</span><div class="info"><div class="n" id="c-album">-</div><div class="l">사진 앨범</div></div></div>
        <div class="stat-item"><span class="ic">👦</span><div class="info"><div class="n" id="c-player">-</div><div class="l">선수 등록</div></div></div>
        <div class="stat-item"><span class="ic">🏆</span><div class="info"><div class="n" id="c-match">-</div><div class="l">경기 기록</div></div></div>
        <div class="stat-item"><span class="ic">📅</span><div class="info"><div class="n" id="c-sched">-</div><div class="l">일정 등록</div></div></div>
      </div>
    </div>

    <div class="menu-card">
      <div class="menu-row" id="admin-row" onclick="toggleAdmin()">
        <span class="ic">🔑</span>
        <span class="txt" id="admin-txt">관리자 모드</span>
        <span class="arrow">›</span>
      </div>
    </div>
  </div>

  <div class="modal-center" id="nick-modal">
    <div class="box">
      <div class="modal-title" id="nick-modal-title">👋 환영합니다!</div>
      <div class="modal-sub">앱에서 사용할 이름을 입력해주세요.<br><br>예) (3학년) 이유찬 엄마<br>김영신 감독 / 이유찬 선수</div>
      <input class="form-input" id="nick-input" placeholder="이름을 입력하세요" />
      <button class="mc-btn" onclick="saveNick()">✅ 저장</button>
      <button class="mc-cancel" id="nick-cancel" onclick="closeNickModal()" style="display:none;">취소</button>
    </div>
  </div>

  <div class="modal-center" id="admin-modal">
    <div class="box">
      <div class="modal-title">🔑 관리자 모드</div>
      <div class="modal-sub">관리자 비밀번호를 입력하면<br>모든 글을 수정·삭제할 수 있습니다.</div>
      <input class="form-input" id="admin-input" type="password" placeholder="비밀번호" />
      <button class="mc-btn" onclick="checkAdmin()">확인</button>
      <button class="mc-cancel" onclick="closeAdminModal()">취소</button>
    </div>
  </div>

  <nav class="bottom-nav">
    <a href="index.html" class="nav-item"><span class="nav-icon">🏠</span>홈</a>
    <a href="notice.html" class="nav-item"><span class="nav-icon">📢</span>공지</a>
    <a href="schedule.html" class="nav-item"><span class="nav-icon">📅</span>일정</a>
    <a href="gallery.html" class="nav-item"><span class="nav-icon">📸</span>사진</a>
    <a href="players.html" class="nav-item"><span class="nav-icon">👦</span>선수</a>
  </nav>

  <script>
    const ADMIN_PW = "ysfc486";
    let myNick = localStorage.getItem('ysfc_nick') || '';
    let isAdmin = sessionStorage.getItem('ysfc_admin') === '1';
    let db = null;

    async function initFirebase() {
      try {
        const { initializeApp } = await import("https://www.gstatic.com/firebasejs/12.14.0/firebase-app.js");
        const { getFirestore, collection, getDocs } = await import("https://www.gstatic.com/firebasejs/12.14.0/firebase-firestore.js");
        const firebaseConfig = {
          apiKey: "AIzaSyABY7cdBTXJVbnNVVJmhuo9nXNLerbtVEo",
          authDomain: "ysfc-app-ff413.firebaseapp.com",
          projectId: "ysfc-app-ff413",
          storageBucket: "ysfc-app-ff413.firebasestorage.app",
          messagingSenderId: "791661747168",
          appId: "1:791661747168:web:3540aacb15306331afe985"
        };
        const app = initializeApp(firebaseConfig);
        db = getFirestore(app);
        window._collection = collection; window._getDocs = getDocs;
        loadStats();
      } catch(e) { console.error('Firebase 오류:', e); }
    }

    function renderProfile() {
      document.getElementById('profile-nick').textContent = myNick || '이름 미설정';
      document.getElementById('admin-tag-wrap').innerHTML = isAdmin ? '<span class="admin-tag">🔑 관리자</span>' : '';
      const row = document.getElementById('admin-row');
      const txt = document.getElementById('admin-txt');
      if (isAdmin) { row.classList.add('admin-on'); txt.textContent = '관리자 모드 ON (탭하면 끄기)'; }
      else { row.classList.remove('admin-on'); txt.textContent = '관리자 모드'; }
    }

    async function countMine(col) {
      try {
        const snapshot = await window._getDocs(window._collection(db, col));
        let cnt = 0;
        snapshot.forEach(d => { if (d.data().author === myNick) cnt++; });
        return cnt;
      } catch(e) { return 0; }
    }

    async function loadStats() {
      if (!myNick) {
        ['c-notice','c-album','c-player','c-match','c-sched','total-count'].forEach(id => document.getElementById(id).textContent = '0');
        return;
      }
      const [n, a, p, m, s] = await Promise.all([
        countMine('notices'), countMine('albums'), countMine('players'), countMine('matches'), countMine('schedules')
      ]);
      document.getElementById('c-notice').textContent = n;
      document.getElementById('c-album').textContent = a;
      document.getElementById('c-player').textContent = p;
      document.getElementById('c-match').textContent = m;
      document.getElementById('c-sched').textContent = s;
      document.getElementById('total-count').textContent = (n + a + p + m + s);
    }

    window.openNickEdit = function() {
      document.getElementById('nick-modal-title').textContent = '✏️ 이름 변경';
      document.getElementById('nick-input').value = myNick;
      document.getElementById('nick-cancel').style.display = 'block';
      document.getElementById('nick-modal').classList.add('show');
    };
    window.closeNickModal = function() { document.getElementById('nick-modal').classList.remove('show'); };
    window.saveNick = function() {
      const v = document.getElementById('nick-input').value.trim();
      if (!v) { alert('이름을 입력해주세요!'); return; }
      const old = myNick;
      myNick = v; localStorage.setItem('ysfc_nick', v);
      document.getElementById('nick-modal').classList.remove('show');
      renderProfile();
      loadStats();
      if (old && old !== v) {
        alert('이름이 변경되었습니다! ✅\n(이전에 올린 글은 예전 이름으로 남아있어요)');
      }
    };

    window.toggleAdmin = function() {
      if (isAdmin) {
        if (confirm('관리자 모드를 끌까요?')) {
          isAdmin = false; sessionStorage.removeItem('ysfc_admin');
          renderProfile();
        }
      } else { document.getElementById('admin-modal').classList.add('show'); }
    };
    window.checkAdmin = function() {
      const v = document.getElementById('admin-input').value;
      if (v === ADMIN_PW) {
        isAdmin = true; sessionStorage.setItem('ysfc_admin', '1');
        document.getElementById('admin-modal').classList.remove('show');
        document.getElementById('admin-input').value = '';
        renderProfile();
        alert('관리자 모드 ON ✅');
      } else { alert('비밀번호가 틀렸습니다 😢'); }
    };
    window.closeAdminModal = function() {
      document.getElementById('admin-modal').classList.remove('show');
      document.getElementById('admin-input').value = '';
    };

    if (!myNick) {
      document.getElementById('nick-cancel').style.display = 'none';
      document.getElementById('nick-modal').classList.add('show');
    }
    renderProfile();
    initFirebase();
  </script>
</body>
</html>
