<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>클럽 소식 · YSFC</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Apple SD Gothic Neo', '맑은 고딕', sans-serif; background: #f5f6f8; }
    .header { background: white; padding: 12px 16px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid #f0f0f0; position: sticky; top: 0; z-index: 10; }
    .header-left { display: flex; align-items: center; gap: 10px; }
    .back-btn { font-size: 20px; color: #333; background: none; border: none; width: 34px; height: 34px; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; }
    .header h1 { font-size: 16px; font-weight: 700; color: #111; }
    .header-btns { display: flex; gap: 8px; }
    .write-btn { background: #1a7c3e; color: white; border: none; padding: 7px 14px; border-radius: 20px; font-size: 12px; font-weight: 700; cursor: pointer; }
    .admin-btn { background: #f5f6f8; color: #555; border: none; padding: 7px 12px; border-radius: 20px; font-size: 12px; font-weight: 600; cursor: pointer; }
    .admin-btn.on { background: #fbbf24; color: #333; font-weight: 700; }
    .cat-bar { background: white; display: flex; border-bottom: 1px solid #f0f0f0; padding: 0 8px; overflow-x: auto; }
    .cat-bar::-webkit-scrollbar { display: none; }
    .cat-tab { padding: 11px 12px; font-size: 12px; font-weight: 600; color: #bbb; border: none; border-bottom: 2px solid transparent; background: none; cursor: pointer; white-space: nowrap; flex-shrink: 0; }
    .cat-tab.active { color: #1a7c3e; border-bottom: 2px solid #1a7c3e; }
    .news-list { padding: 14px 14px 90px; display: flex; flex-direction: column; gap: 12px; }
    .news-card { background: white; border-radius: 16px; overflow: hidden; border: 1px solid #f0f0f0; cursor: pointer; }
    .news-card:active { opacity: 0.85; }
    .news-thumb { width: 100%; height: 180px; object-fit: cover; background: #f0fdf4; display: flex; align-items: center; justify-content: center; font-size: 48px; }
    .news-body { padding: 14px; }
    .news-cat { display: inline-block; font-size: 10px; font-weight: 700; padding: 3px 9px; border-radius: 20px; margin-bottom: 8px; }
    .cat-대회결과 { background: #fff3e0; color: #e67e22; }
    .cat-클럽뉴스 { background: #eff6ff; color: #2563eb; }
        .cat-기타 { background: #f3f4f6; color: #4b5563; }
    .news-title { font-size: 15px; font-weight: 700; color: #111; margin-bottom: 6px; line-height: 1.4; }
    .news-preview { font-size: 13px; color: #888; line-height: 1.5; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; margin-bottom: 10px; }
    .news-meta { display: flex; justify-content: space-between; font-size: 11px; color: #bbb; }
    .detail-view { display: none; padding-bottom: 90px; }
    .detail-thumb { width: 100%; max-height: 280px; object-fit: cover; }
    .detail-body { padding: 20px 16px; }
    .detail-cat { display: inline-block; font-size: 11px; font-weight: 700; padding: 4px 10px; border-radius: 20px; margin-bottom: 12px; }
    .detail-title { font-size: 20px; font-weight: 700; color: #111; line-height: 1.4; margin-bottom: 8px; }
    .detail-meta { font-size: 12px; color: #aaa; margin-bottom: 16px; padding-bottom: 16px; border-bottom: 1px solid #f0f0f0; display: flex; justify-content: space-between; }
    .detail-content { font-size: 14px; color: #333; line-height: 1.8; white-space: pre-wrap; margin-bottom: 20px; }
    .detail-imgs { display: flex; flex-direction: column; gap: 10px; margin-bottom: 20px; }
    .detail-img { width: 100%; border-radius: 12px; cursor: pointer; }
    .detail-actions { display: flex; gap: 8px; padding: 0 16px 20px; }
    .da-btn { flex: 1; padding: 12px; border-radius: 10px; border: none; font-size: 14px; font-weight: 700; cursor: pointer; }
    .da-edit { background: #f0fdf4; color: #1a7c3e; }
    .da-del { background: #fef2f2; color: #ef4444; }
    .viewer { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.95); z-index: 200; align-items: center; justify-content: center; }
    .viewer.show { display: flex; }
    .viewer img { max-width: 100%; max-height: 90%; object-fit: contain; }
    .viewer-close { position: fixed; top: 16px; right: 20px; color: white; font-size: 24px; cursor: pointer; background: rgba(255,255,255,0.1); border: none; width: 40px; height: 40px; border-radius: 50%; }
    .modal-bg { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.4); z-index: 100; }
    .modal-bg.show { display: flex; align-items: flex-end; }
    .modal { background: white; width: 100%; border-radius: 20px 20px 0 0; padding: 20px; max-height: 90vh; overflow-y: auto; }
    .modal-center { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.4); z-index: 110; align-items: center; justify-content: center; padding: 20px; }
    .modal-center.show { display: flex; }
    .modal-center .box { background: white; border-radius: 20px; padding: 24px; width: 100%; max-width: 340px; }
    .modal-title { font-size: 16px; font-weight: 700; color: #111; margin-bottom: 16px; text-align: center; }
    .modal-sub { font-size: 12px; color: #aaa; text-align: center; margin-bottom: 16px; line-height: 1.6; }
    .form-group { margin-bottom: 14px; }
    .form-label { font-size: 11px; font-weight: 700; color: #888; margin-bottom: 6px; display: block; }
    .form-select, .form-input, .form-textarea { width: 100%; padding: 11px 13px; border: 1px solid #eee; border-radius: 10px; font-size: 14px; font-family: inherit; background: #fafafa; color: #111; }
    .form-select:focus, .form-input:focus, .form-textarea:focus { outline: none; border-color: #1a7c3e; background: white; }
    .form-textarea { height: 160px; resize: none; line-height: 1.7; }
    .img-upload-area { border: 1.5px dashed #ddd; border-radius: 10px; padding: 20px; text-align: center; cursor: pointer; color: #bbb; font-size: 13px; background: #fafafa; }
    .preview-count { font-size: 12px; color: #1a7c3e; font-weight: 700; margin-top: 8px; }
    .preview-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin-top: 8px; }
    .preview-item { position: relative; }
    .preview-item img { width: 100%; aspect-ratio: 1; object-fit: cover; border-radius: 8px; }
    .preview-del { position: absolute; top: 2px; right: 2px; background: rgba(0,0,0,0.6); color: white; border: none; border-radius: 50%; width: 20px; height: 20px; font-size: 11px; cursor: pointer; }
    .form-btn { width: 100%; padding: 14px; background: #1a7c3e; color: white; border: none; border-radius: 12px; font-size: 15px; font-weight: 700; cursor: pointer; margin-top: 8px; }
    .form-btn:disabled { background: #ccc; }
    .cancel-btn { width: 100%; padding: 12px; background: #f5f6f8; color: #666; border: none; border-radius: 12px; font-size: 14px; cursor: pointer; margin-top: 8px; }
    .mc-btn { width: 100%; padding: 14px; background: #1a7c3e; color: white; border: none; border-radius: 12px; font-size: 15px; font-weight: 700; cursor: pointer; margin-top: 8px; }
    .mc-cancel { width: 100%; padding: 12px; background: #f5f6f8; color: #666; border: none; border-radius: 12px; font-size: 14px; cursor: pointer; margin-top: 8px; }
    .loading { text-align: center; padding: 40px; color: #bbb; font-size: 14px; }
    .bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; background: white; border-top: 1px solid #f0f0f0; display: flex; justify-content: space-around; padding: 10px 0 max(14px, env(safe-area-inset-bottom)); z-index: 10; }
    .nav-item { text-align: center; text-decoration: none; color: #ccc; font-size: 10px; display: flex; flex-direction: column; align-items: center; gap: 2px; }
    .nav-item.active { color: #1a7c3e; }
    .nav-icon { font-size: 22px; }
  </style>
</head>
<body>

  <div class="header">
    <div class="header-left">
      <button class="back-btn" onclick="goBack()">←</button>
      <h1 id="header-title">📰 클럽 소식</h1>
    </div>
    <div class="header-btns">
      <button class="admin-btn" id="admin-btn" onclick="toggleAdmin()">🔑</button>
      <button class="write-btn" id="write-btn" onclick="openModal()">✏️ 작성</button>
    </div>
  </div>

  <div class="cat-bar" id="cat-bar">
    <button class="cat-tab active" onclick="filterCat('전체', this)">전체</button>
    <button class="cat-tab" onclick="filterCat('대회결과', this)">🏆 대회결과</button>
    <button class="cat-tab" onclick="filterCat('클럽뉴스', this)">📰 클럽뉴스</button>
    <button class="cat-tab" onclick="filterCat('기타', this)">기타</button>
  </div>

  <div id="list-view">
    <div class="news-list" id="news-list">
      <div class="loading">소식을 불러오는 중...</div>
    </div>
  </div>

  <div id="detail-view" class="detail-view">
    <img id="detail-thumb" src="" alt="" style="display:none;">
    <div class="detail-body">
      <span class="detail-cat" id="detail-cat"></span>
      <div class="detail-title" id="detail-title"></div>
      <div class="detail-meta">
        <span id="detail-author"></span>
        <span id="detail-date"></span>
      </div>
      <div class="detail-content" id="detail-content"></div>
      <div class="detail-imgs" id="detail-imgs"></div>
    </div>
    <div class="detail-actions" id="detail-actions"></div>
  </div>

  <div class="viewer" id="viewer">
    <button class="viewer-close" onclick="closeViewer()">✕</button>
    <img id="viewer-img" src="" alt="">
  </div>

  <div class="modal-bg" id="modal-bg">
    <div class="modal">
      <div class="modal-title" id="modal-title">✏️ 소식 작성</div>
      <div class="form-group">
        <label class="form-label">카테고리</label>
        <select class="form-select" id="form-cat">
          <option value="대회결과">🏆 대회결과</option>
          <option value="클럽뉴스">📰 클럽뉴스</option>
          <option value="기타">기타</option>
        </select>
      </div>
      <div class="form-group">
        <label class="form-label">제목</label>
        <input class="form-input" id="form-title" placeholder="예: 서천대회 준우승 🏆" />
      </div>
      <div class="form-group">
        <label class="form-label">내용</label>
        <textarea class="form-textarea" id="form-content" placeholder="소식 내용을 입력하세요..."></textarea>
      </div>
      <div class="form-group">
        <label class="form-label">📷 사진 첨부 (여러 장 가능)</label>
        <div class="img-upload-area" onclick="document.getElementById('img-input').click()">📷 사진 선택 / 더 추가하기</div>
        <input type="file" id="img-input" accept="image/*" multiple style="display:none" onchange="addImgs(this)">
        <div class="preview-count" id="preview-count"></div>
        <div class="preview-grid" id="preview-grid"></div>
      </div>
      <button class="form-btn" id="submit-btn" onclick="submitNews()">📰 소식 등록</button>
      <button class="cancel-btn" onclick="closeModal()">취소</button>
    </div>
  </div>

  <div class="modal-center" id="nick-modal">
    <div class="box">
      <div class="modal-title">👋 환영합니다!</div>
      <div class="modal-sub">앱에서 사용할 이름을 입력해주세요.<br><br>예) 김영신 감독 / 이유찬 선수</div>
      <input class="form-input" id="nick-input" placeholder="이름을 입력하세요" />
      <button class="mc-btn" onclick="saveNick()">✅ 시작하기</button>
    </div>
  </div>

  <div class="modal-center" id="admin-modal">
    <div class="box">
      <div class="modal-title">🔑 관리자 모드</div>
      <div class="modal-sub">비밀번호를 입력하면<br>모든 소식을 수정·삭제할 수 있습니다.</div>
      <input class="form-input" id="admin-input" type="password" placeholder="비밀번호" />
      <button class="mc-btn" onclick="checkAdmin()">확인</button>
      <button class="mc-cancel" onclick="closeAdminModal()">취소</button>
    </div>
  </div>

  <nav class="bottom-nav">
    <a href="index.html" class="nav-item"><span class="nav-icon">🏠</span>홈</a>
    <a href="notice.html" class="nav-item"><span class="nav-icon">📢</span>공지</a>
    <a href="schedule.html" class="nav-item"><span class="nav-icon">📅</span>일정</a>
    <a href="gallery.html" class="nav-item"><span class="nav-icon">📸</span>사진</a>
    <a href="players.html" class="nav-item"><span class="nav-icon">👦</span>선수</a>
  </nav>

  <script>
    const CLOUD_NAME = "dq4qx2qfg";
    const UPLOAD_PRESET = "YSFC-APP";
    const ADMIN_PW = "ysfc486";
    let allNews = [];
    let filterCatVal = '전체';
    let currentNews = null;
    let selectedFiles = [];
    let editingId = null;
    let editingImages = [];
    let myNick = localStorage.getItem('ysfc_nick') || '';
    let isAdmin = sessionStorage.getItem('ysfc_admin') === '1';
    let db = null;

    async function initFirebase() {
      try {
        const { initializeApp, getApps } = await import("https://www.gstatic.com/firebasejs/12.14.0/firebase-app.js");
        const { getFirestore, collection, addDoc, getDocs, doc, updateDoc, deleteDoc } = await import("https://www.gstatic.com/firebasejs/12.14.0/firebase-firestore.js");
        const firebaseConfig = {
          apiKey: "AIzaSyABY7cdBTXJVbnNVVJmhuo9nXNLerbtVEo",
          authDomain: "ysfc-app-ff413.firebaseapp.com",
          projectId: "ysfc-app-ff413",
          storageBucket: "ysfc-app-ff413.firebasestorage.app",
          messagingSenderId: "791661747168",
          appId: "1:791661747168:web:3540aacb15306331afe985"
        };
        const existingApps = getApps();
        const app = existingApps.length > 0 ? existingApps[0] : initializeApp(firebaseConfig);
        db = getFirestore(app);
        window._addDoc = addDoc; window._collection = collection; window._getDocs = getDocs;
        window._doc = doc; window._updateDoc = updateDoc; window._deleteDoc = deleteDoc;
        await loadNews();
      } catch(e) {
        document.getElementById('news-list').innerHTML = '<div class="loading">연결 오류가 발생했습니다 😢</div>';
      }
    }

    function checkNick() { if (!myNick) document.getElementById('nick-modal').classList.add('show'); }
    window.saveNick = function() {
      const v = document.getElementById('nick-input').value.trim();
      if (!v) { alert('이름을 입력해주세요!'); return; }
      myNick = v; localStorage.setItem('ysfc_nick', v);
      document.getElementById('nick-modal').classList.remove('show');
    };

    window.toggleAdmin = function() {
      if (isAdmin) {
        if (confirm('관리자 모드를 끌까요?')) {
          isAdmin = false; sessionStorage.removeItem('ysfc_admin');
          updateAdminBtn();
        }
      } else { document.getElementById('admin-modal').classList.add('show'); }
    };
    window.checkAdmin = function() {
      const v = document.getElementById('admin-input').value;
      if (v === ADMIN_PW) {
        isAdmin = true; sessionStorage.setItem('ysfc_admin', '1');
        document.getElementById('admin-modal').classList.remove('show');
        document.getElementById('admin-input').value = '';
        updateAdminBtn();
        alert('관리자 모드 ON ✅');
      } else { alert('비밀번호가 틀렸습니다 😢'); }
    };
    window.closeAdminModal = function() {
      document.getElementById('admin-modal').classList.remove('show');
      document.getElementById('admin-input').value = '';
    };
    function updateAdminBtn() {
      const btn = document.getElementById('admin-btn');
      if (isAdmin) { btn.classList.add('on'); btn.textContent = '🔑 ON'; }
      else { btn.classList.remove('on'); btn.textContent = '🔑'; }
    }

    // 누구나 수정·삭제 가능
    function canEdit(n) { return true; }

    function getTime(ts) {
      if (!ts) return 0;
      if (ts.toDate) return ts.toDate().getTime();
      return new Date(ts).getTime();
    }

    function fmtDate(ts) {
      const d = ts?.toDate ? ts.toDate() : (ts ? new Date(ts) : new Date());
      return `${d.getFullYear()}.${String(d.getMonth()+1).padStart(2,'0')}.${String(d.getDate()).padStart(2,'0')}`;
    }

    function getImages(n) {
      if (Array.isArray(n.images)) return n.images;
      if (n.imageUrl) return [n.imageUrl];
      return [];
    }

    async function loadNews() {
      try {
        const snapshot = await window._getDocs(window._collection(db, 'news'));
        allNews = [];
        snapshot.forEach(d => allNews.push({ id: d.id, ...d.data() }));
        allNews.sort((a, b) => getTime(b.createdAt) - getTime(a.createdAt));
        renderList();
      } catch(e) {
        document.getElementById('news-list').innerHTML = '<div class="loading">데이터를 불러올 수 없습니다 😢</div>';
      }
    }

    function renderList() {
      const list = filterCatVal === '전체' ? allNews : allNews.filter(n => n.cat === filterCatVal);
      if (list.length === 0) {
        document.getElementById('news-list').innerHTML = '<div class="loading">등록된 소식이 없습니다 😊</div>';
        return;
      }
      document.getElementById('news-list').innerHTML = list.map(n => {
        const imgs = getImages(n);
        const thumb = imgs.length > 0
          ? `<img class="news-thumb" src="${imgs[0]}" alt="${n.title}">`
          : `<div class="news-thumb">📰</div>`;
        return `<div class="news-card" onclick="openDetail('${n.id}')">
          ${thumb}
          <div class="news-body">
            <span class="news-cat cat-${n.cat}">${n.cat}</span>
            <div class="news-title">${n.title}</div>
            <div class="news-preview">${n.content}</div>
            <div class="news-meta">
              <span>${n.author||''}</span>
              <span>${fmtDate(n.createdAt)}</span>
            </div>
          </div>
        </div>`;
      }).join('');
    }

    window.openDetail = function(id) {
      currentNews = allNews.find(n => n.id === id);
      if (!currentNews) return;
      const imgs = getImages(currentNews);
      const thumb = document.getElementById('detail-thumb');
      if (imgs.length > 0) { thumb.src = imgs[0]; thumb.style.display = 'block'; }
      else { thumb.style.display = 'none'; }
      const catEl = document.getElementById('detail-cat');
      catEl.textContent = currentNews.cat;
      catEl.className = `detail-cat cat-${currentNews.cat}`;
      document.getElementById('detail-title').textContent = currentNews.title;
      document.getElementById('detail-author').textContent = currentNews.author || '';
      document.getElementById('detail-date').textContent = fmtDate(currentNews.createdAt);
      document.getElementById('detail-content').textContent = currentNews.content;
      const restImgs = imgs.slice(1);
      document.getElementById('detail-imgs').innerHTML = restImgs.map(u =>
        `<img class="detail-img" src="${u}" onclick="openViewer('${u}')">`
      ).join('');

      // 항상 수정·삭제 버튼 표시
      document.getElementById('detail-actions').innerHTML =
        `<button class="da-btn da-edit" onclick="editNews('${currentNews.id}')">✏️ 수정</button>
         <button class="da-btn da-del" onclick="deleteNews('${currentNews.id}')">🗑️ 삭제</button>`;

      document.getElementById('list-view').style.display = 'none';
      document.getElementById('detail-view').style.display = 'block';
      document.getElementById('cat-bar').style.display = 'none';
      document.getElementById('write-btn').style.display = 'none';
      document.getElementById('header-title').textContent = currentNews.cat;
      window.scrollTo(0, 0);
    };

    window.goBack = function() {
      if (document.getElementById('detail-view').style.display === 'block') {
        document.getElementById('detail-view').style.display = 'none';
        document.getElementById('list-view').style.display = 'block';
        document.getElementById('cat-bar').style.display = 'flex';
        document.getElementById('write-btn').style.display = 'block';
        document.getElementById('header-title').textContent = '📰 클럽 소식';
        currentNews = null;
      } else {
        location.href = 'index.html';
      }
    };

    window.openViewer = function(url) {
      document.getElementById('viewer-img').src = url;
      document.getElementById('viewer').classList.add('show');
    };
    window.closeViewer = function() { document.getElementById('viewer').classList.remove('show'); };

    window.filterCat = function(cat, el) {
      filterCatVal = cat;
      document.querySelectorAll('.cat-tab').forEach(t => t.classList.remove('active'));
      el.classList.add('active');
      renderList();
    };

    window.addImgs = function(input) {
      selectedFiles = selectedFiles.concat(Array.from(input.files));
      input.value = ''; renderPreviews();
    };
    function renderPreviews() {
      const grid = document.getElementById('preview-grid');
      const count = document.getElementById('preview-count');
      let html = '';
      editingImages.forEach((url, idx) => {
        html += `<div class="preview-item"><img src="${url}"><button class="preview-del" onclick="removeExisting(${idx})">✕</button></div>`;
      });
      const total = editingImages.length + selectedFiles.length;
      count.textContent = total > 0 ? `이미지 ${total}장` : '';
      grid.innerHTML = html;
      selectedFiles.forEach((file, idx) => {
        const reader = new FileReader();
        reader.onload = e => {
          const div = document.createElement('div');
          div.className = 'preview-item';
          div.innerHTML = `<img src="${e.target.result}"><button class="preview-del" onclick="removePreview(${idx})">✕</button>`;
          grid.appendChild(div);
        };
        reader.readAsDataURL(file);
      });
    }
    window.removePreview = function(idx) { selectedFiles.splice(idx, 1); renderPreviews(); };
    window.removeExisting = function(idx) { editingImages.splice(idx, 1); renderPreviews(); };

    function compressImage(file) {
      return new Promise(resolve => {
        if (!file.type.startsWith('image/')) { resolve(file); return; }
        const reader = new FileReader();
        reader.onload = e => {
          const img = new Image();
          img.onload = () => {
            const maxW = 1280;
            let w = img.width, h = img.height;
            if (w > maxW) { h = Math.round(h * maxW / w); w = maxW; }
            const canvas = document.createElement('canvas');
            canvas.width = w; canvas.height = h;
            canvas.getContext('2d').drawImage(img, 0, 0, w, h);
            canvas.toBlob(blob => resolve(blob && blob.size < file.size ? blob : file), 'image/jpeg', 0.8);
          };
          img.src = e.target.result;
        };
        reader.readAsDataURL(file);
      });
    }

    async function uploadToCloudinary(file) {
      const compressed = await compressImage(file);
      const fd = new FormData();
      fd.append('file', compressed); fd.append('upload_preset', UPLOAD_PRESET);
      const res = await fetch(`https://api.cloudinary.com/v1_1/${CLOUD_NAME}/image/upload`, { method: 'POST', body: fd });
      const data = await res.json();
      if (!data.secure_url) throw new Error('업로드 실패');
      return data.secure_url;
    }

    window.openModal = function() {
      if (!myNick) { checkNick(); return; }
      editingId = null; editingImages = []; selectedFiles = [];
      document.getElementById('modal-title').textContent = '✏️ 소식 작성';
      document.getElementById('submit-btn').textContent = '📰 소식 등록';
      document.getElementById('form-cat').value = '대회결과';
      document.getElementById('form-title').value = '';
      document.getElementById('form-content').value = '';
      renderPreviews();
      document.getElementById('modal-bg').classList.add('show');
    };

    window.editNews = function(id) {
      const n = allNews.find(x => x.id === id);
      if (!n) return;
      editingId = id; editingImages = getImages(n).slice(); selectedFiles = [];
      document.getElementById('modal-title').textContent = '✏️ 소식 수정';
      document.getElementById('submit-btn').textContent = '✅ 수정 완료';
      document.getElementById('form-cat').value = n.cat;
      document.getElementById('form-title').value = n.title;
      document.getElementById('form-content').value = n.content;
      renderPreviews();
      document.getElementById('modal-bg').classList.add('show');
    };

    window.deleteNews = async function(id) {
      if (!confirm('이 소식을 삭제할까요?')) return;
      try {
        await window._deleteDoc(window._doc(db, 'news', id));
        alert('삭제되었습니다 ✅');
        goBack();
        await loadNews();
      } catch(e) { alert('삭제 중 오류가 발생했습니다 😢'); }
    };

    window.closeModal = function() {
      document.getElementById('modal-bg').classList.remove('show');
      selectedFiles = []; editingImages = []; editingId = null;
    };

    window.submitNews = async function() {
      const title = document.getElementById('form-title').value.trim();
      const content = document.getElementById('form-content').value.trim();
      const cat = document.getElementById('form-cat').value;
      const btn = document.getElementById('submit-btn');
      if (!db || !myNick) { checkNick(); return; }
      if (!title || !content) { alert('제목과 내용을 입력해주세요!'); return; }
      btn.disabled = true;
      try {
        const images = editingImages.slice();
        if (selectedFiles.length > 0) {
          btn.textContent = `사진 ${selectedFiles.length}장 업로드 중...`;
          const results = await Promise.allSettled(selectedFiles.map(f => uploadToCloudinary(f)));
          let fail = 0;
          results.forEach(r => { if (r.status === 'fulfilled') images.push(r.value); else fail++; });
          if (fail > 0 && !confirm(`사진 ${fail}장 실패.\n나머지만 등록할까요?`)) {
            btn.disabled = false; btn.textContent = editingId ? '✅ 수정 완료' : '📰 소식 등록'; return;
          }
        }
        btn.textContent = '저장 중...';
        if (editingId) {
          const n = allNews.find(x => x.id === editingId);
          await window._updateDoc(window._doc(db, 'news', editingId), {
            title, content, cat, images, imageUrl: images[0]||'', author: n.author || myNick
          });
          alert('수정되었습니다! ✅');
        } else {
          await window._addDoc(window._collection(db, 'news'), {
            title, content, cat, images, imageUrl: images[0]||'', author: myNick, createdAt: new Date()
          });
          alert('소식이 등록되었습니다! ✅');
        }
        closeModal();
        await loadNews();
      } catch(e) {
        alert('오류가 발생했습니다 😢');
      } finally {
        btn.disabled = false;
        btn.textContent = editingId ? '✅ 수정 완료' : '📰 소식 등록';
      }
    };

    updateAdminBtn();
    checkNick();
    initFirebase();
  </script>
  <script type="module" src="member.js"></script>
