<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>공지사항 · YSFC</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Apple SD Gothic Neo', '맑은 고딕', sans-serif; background: #f4f4f4; }
    .header { background: linear-gradient(135deg, #1a7c3e, #25a85a); color: white; padding: 16px 20px; display: flex; align-items: center; justify-content: space-between; }
    .header-left { display: flex; align-items: center; gap: 12px; }
    .back-btn { font-size: 22px; text-decoration: none; color: white; }
    .header h1 { font-size: 18px; font-weight: 700; }
    .write-btn { background: rgba(255,255,255,0.2); color: white; border: none; padding: 6px 12px; border-radius: 20px; font-size: 13px; cursor: pointer; }
    .tab-bar { background: white; display: flex; border-bottom: 1px solid #eee; padding: 0 14px; }
    .tab { padding: 12px 16px; font-size: 13px; font-weight: 600; color: #aaa; border-bottom: 2px solid transparent; cursor: pointer; white-space: nowrap; background: none; border-top: none; border-left: none; border-right: none; }
    .tab.active { color: #1a7c3e; border-bottom: 2px solid #1a7c3e; }
    .notice-list { padding: 12px 14px 80px; }
    .notice-item { background: white; border-radius: 12px; padding: 16px; margin-bottom: 10px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); position: relative; }
    .notice-top { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
    .notice-tag { font-size: 11px; font-weight: 600; padding: 3px 8px; border-radius: 20px; }
    .tag-알림 { background: #e8f5ee; color: #1a7c3e; }
    .tag-유니폼 { background: #f3e8ff; color: #9333ea; }
    .tag-차량 { background: #fff7ed; color: #ea580c; }
    .notice-title { font-size: 14px; font-weight: 600; margin-bottom: 4px; }
    .notice-desc { font-size: 12px; color: #888; margin-bottom: 8px; white-space: pre-wrap; }
    .notice-img { width: 100%; border-radius: 8px; margin-bottom: 8px; max-height: 200px; object-fit: cover; }
    .notice-bottom { display: flex; justify-content: space-between; font-size: 11px; color: #bbb; }
    .new-badge { background: #ef4444; color: white; font-size: 9px; padding: 1px 5px; border-radius: 10px; }
    .item-actions { display: flex; gap: 6px; margin-left: auto; }
    .icon-btn { background: #f4f4f4; border: none; border-radius: 8px; padding: 4px 8px; font-size: 12px; cursor: pointer; color: #666; }
    .icon-btn.del { background: #fde8e8; color: #e53e3e; }
    .modal-bg { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.5); z-index: 100; }
    .modal-bg.show { display: flex; align-items: flex-end; }
    .modal { background: white; width: 100%; border-radius: 20px 20px 0 0; padding: 20px; max-height: 85vh; overflow-y: auto; }
    .modal-title { font-size: 16px; font-weight: 700; margin-bottom: 16px; text-align: center; }
    .form-group { margin-bottom: 14px; }
    .form-label { font-size: 12px; color: #888; margin-bottom: 6px; display: block; }
    .form-select, .form-input, .form-textarea { width: 100%; padding: 10px 12px; border: 1px solid #eee; border-radius: 8px; font-size: 14px; font-family: inherit; }
    .form-textarea { height: 100px; resize: none; }
    .img-upload-area { border: 2px dashed #ddd; border-radius: 8px; padding: 20px; text-align: center; cursor: pointer; color: #aaa; font-size: 13px; }
    .img-preview { width: 100%; border-radius: 8px; margin-top: 8px; display: none; max-height: 150px; object-fit: cover; }
    .form-btn { width: 100%; padding: 14px; background: #1a7c3e; color: white; border: none; border-radius: 12px; font-size: 15px; font-weight: 700; cursor: pointer; margin-top: 8px; }
    .form-btn:disabled { background: #aaa; }
    .cancel-btn { width: 100%; padding: 12px; background: #f4f4f4; color: #666; border: none; border-radius: 12px; font-size: 14px; cursor: pointer; margin-top: 8px; }
    .loading { text-align: center; padding: 40px; color: #aaa; font-size: 14px; }
    .bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; background: white; border-top: 1px solid #eee; display: flex; justify-content: space-around; padding: 10px 0 16px; }
    .nav-item { text-align: center; text-decoration: none; color: #aaa; font-size: 10px; }
    .nav-item.active { color: #1a7c3e; }
    .nav-item .nav-icon { font-size: 22px; display: block; margin-bottom: 2px; }
  </style>
</head>
<body>
  <div class="header">
    <div class="header-left">
      <a href="index.html" class="back-btn">←</a>
      <h1>📢 공지사항</h1>
    </div>
    <button class="write-btn" onclick="openModal()">✏️ 글쓰기</button>
  </div>

  <div class="tab-bar">
    <button class="tab active" onclick="filterNotice('전체', this)">전체</button>
    <button class="tab" onclick="filterNotice('알림', this)">알림</button>
    <button class="tab" onclick="filterNotice('유니폼', this)">유니폼</button>
    <button class="tab" onclick="filterNotice('차량', this)">차량</button>
  </div>

  <div class="notice-list" id="notice-list"><div class="loading">📋 공지사항을 불러오는 중...</div></div>

  <div class="modal-bg" id="modal-bg">
    <div class="modal">
      <div class="modal-title" id="modal-title">✏️ 공지 작성</div>
      <div class="form-group">
        <label class="form-label">카테고리</label>
        <select class="form-select" id="form-tag">
          <option value="알림">알림</option>
          <option value="유니폼">유니폼</option>
          <option value="차량">차량</option>
        </select>
      </div>
      <div class="form-group">
        <label class="form-label">제목</label>
        <input class="form-input" id="form-title" placeholder="제목을 입력하세요" />
      </div>
      <div class="form-group">
        <label class="form-label">내용</label>
        <textarea class="form-textarea" id="form-content" placeholder="내용을 입력하세요"></textarea>
      </div>
      <div class="form-group">
        <label class="form-label">📷 이미지 첨부 (선택)</label>
        <div class="img-upload-area" onclick="document.getElementById('img-input').click()">📷 사진을 선택하세요</div>
        <input type="file" id="img-input" accept="image/*" style="display:none" onchange="previewImg(this)">
        <img id="img-preview" class="img-preview" />
      </div>
      <div class="form-group">
        <label class="form-label">작성자</label>
        <input class="form-input" id="form-author" placeholder="예: 코치 김철수" />
      </div>
      <button class="form-btn" id="submit-btn" onclick="submitNotice()">📢 공지 등록</button>
      <button class="cancel-btn" onclick="closeModal()">취소</button>
    </div>
  </div>

  <nav class="bottom-nav">
    <a href="index.html" class="nav-item"><span class="nav-icon">🏠</span>홈</a>
    <a href="notice.html" class="nav-item active"><span class="nav-icon">📢</span>공지</a>
    <a href="schedule.html" class="nav-item"><span class="nav-icon">📅</span>일정</a>
    <a href="gallery.html" class="nav-item"><span class="nav-icon">📸</span>사진</a>
    <a href="players.html" class="nav-item"><span class="nav-icon">👦</span>선수</a>
  </nav>

  <script>
    const CLOUD_NAME = "dq4qx2qfg";
    const UPLOAD_PRESET = "YSFC-APP";
    let allNotices = [];
    let currentFilter = '전체';
    let selectedFile = null;
    let editingId = null;
    let editingImageUrl = '';
    const readNotices = JSON.parse(localStorage.getItem('readNotices') || '[]');
    let db = null;

    async function initFirebase() {
      try {
        const { initializeApp } = await import("https://www.gstatic.com/firebasejs/12.14.0/firebase-app.js");
        const { getFirestore, collection, addDoc, getDocs, doc, updateDoc, deleteDoc } = await import("https://www.gstatic.com/firebasejs/12.14.0/firebase-firestore.js");
        const firebaseConfig = {
          apiKey: "AIzaSyABY7cdBTXJVbnNVVJmhuo9nXNLerbtVEo",
          authDomain: "ysfc-app-ff413.firebaseapp.com",
          projectId: "ysfc-app-ff413",
          storageBucket: "ysfc-app-ff413.firebasestorage.app",
          messagingSenderId: "791661747168",
          appId: "1:791661747168:web:3540aacb15306331afe985"
        };
        const app = initializeApp(firebaseConfig);
        db = getFirestore(app);
        window._addDoc = addDoc; window._collection = collection; window._getDocs = getDocs;
        window._doc = doc; window._updateDoc = updateDoc; window._deleteDoc = deleteDoc;
        await loadNotices();
      } catch(e) {
        console.error('Firebase 오류:', e);
        document.getElementById('notice-list').innerHTML = '<div class="loading">연결 오류가 발생했습니다 😢</div>';
      }
    }

    window.previewImg = function(input) {
      selectedFile = input.files[0];
      if (selectedFile) {
        const reader = new FileReader();
        reader.onload = e => { const p = document.getElementById('img-preview'); p.src = e.target.result; p.style.display = 'block'; };
        reader.readAsDataURL(selectedFile);
      }
    };

    async function uploadToCloudinary(file) {
      const formData = new FormData();
      formData.append('file', file);
      formData.append('upload_preset', UPLOAD_PRESET);
      const res = await fetch(`https://api.cloudinary.com/v1_1/${CLOUD_NAME}/image/upload`, { method: 'POST', body: formData });
      if (!res.ok) throw new Error('Cloudinary 업로드 실패');
      const data = await res.json();
      if (!data.secure_url) throw new Error('URL 없음');
      return data.secure_url;
    }

    async function loadNotices() {
      try {
        const snapshot = await window._getDocs(window._collection(db, 'notices'));
        allNotices = [];
        snapshot.forEach(d => allNotices.push({ id: d.id, ...d.data() }));
        allNotices.sort((a, b) => getTime(b.createdAt) - getTime(a.createdAt));
        renderNotices();
      } catch(e) {
        console.error(e);
        document.getElementById('notice-list').innerHTML = '<div class="loading">데이터를 불러올 수 없습니다 😢</div>';
      }
    }

    function getTime(ts) {
      if (!ts) return 0;
      if (ts.toDate) return ts.toDate().getTime();
      return new Date(ts).getTime();
    }

    function renderNotices() {
      const list = currentFilter === '전체' ? allNotices : allNotices.filter(n => n.tag === currentFilter);
      if (list.length === 0) {
        document.getElementById('notice-list').innerHTML = '<div class="loading">등록된 공지사항이 없습니다</div>';
        return;
      }
      document.getElementById('notice-list').innerHTML = list.map(n => {
        const date = n.createdAt?.toDate ? n.createdAt.toDate() : (n.createdAt ? new Date(n.createdAt) : new Date());
        const isNew = !readNotices.includes(n.id);
        const dateStr = `${date.getFullYear()}.${String(date.getMonth()+1).padStart(2,'0')}.${String(date.getDate()).padStart(2,'0')}`;
        return `
          <div class="notice-item">
            <div class="notice-top">
              <span class="notice-tag tag-${n.tag}">${n.tag}</span>
              ${isNew ? '<span class="new-badge">NEW</span>' : ''}
              <div class="item-actions">
                <button class="icon-btn" onclick="editNotice('${n.id}')">✏️ 수정</button>
                <button class="icon-btn del" onclick="deleteNotice('${n.id}')">🗑️ 삭제</button>
              </div>
            </div>
            <div class="notice-title">${n.title}</div>
            <div class="notice-desc">${n.content}</div>
            ${n.imageUrl ? `<img class="notice-img" src="${n.imageUrl}" alt="공지 이미지">` : ''}
            <div class="notice-bottom"><span>${n.author}</span><span>${dateStr}</span></div>
          </div>`;
      }).join('');
    }

    window.filterNotice = function(filter, el) {
      currentFilter = filter;
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
      el.classList.add('active');
      renderNotices();
    };

    window.openModal = function() {
      editingId = null;
      editingImageUrl = '';
      document.getElementById('modal-title').textContent = '✏️ 공지 작성';
      document.getElementById('submit-btn').textContent = '📢 공지 등록';
      document.getElementById('form-tag').value = '알림';
      document.getElementById('form-title').value = '';
      document.getElementById('form-content').value = '';
      document.getElementById('form-author').value = '';
      document.getElementById('img-preview').style.display = 'none';
      document.getElementById('img-input').value = '';
      selectedFile = null;
      document.getElementById('modal-bg').classList.add('show');
    };

    window.editNotice = function(id) {
      const n = allNotices.find(x => x.id === id);
      if (!n) return;
      editingId = id;
      editingImageUrl = n.imageUrl || '';
      document.getElementById('modal-title').textContent = '✏️ 공지 수정';
      document.getElementById('submit-btn').textContent = '✅ 수정 완료';
      document.getElementById('form-tag').value = n.tag;
      document.getElementById('form-title').value = n.title;
      document.getElementById('form-content').value = n.content;
      document.getElementById('form-author').value = n.author;
      selectedFile = null;
      const p = document.getElementById('img-preview');
      if (n.imageUrl) { p.src = n.imageUrl; p.style.display = 'block'; }
      else { p.style.display = 'none'; }
      document.getElementById('img-input').value = '';
      document.getElementById('modal-bg').classList.add('show');
    };

    window.deleteNotice = async function(id) {
      if (!confirm('이 공지를 삭제할까요?')) return;
      try {
        await window._deleteDoc(window._doc(db, 'notices', id));
        alert('삭제되었습니다 ✅');
        await loadNotices();
      } catch(e) { console.error(e); alert('삭제 중 오류가 발생했습니다 😢'); }
    };

    window.closeModal = function() {
      document.getElementById('modal-bg').classList.remove('show');
      selectedFile = null;
      editingId = null;
      document.getElementById('img-preview').style.display = 'none';
      document.getElementById('img-input').value = '';
    };

    window.submitNotice = async function() {
      const title = document.getElementById('form-title').value.trim();
      const content = document.getElementById('form-content').value.trim();
      const tag = document.getElementById('form-tag').value;
      const author = document.getElementById('form-author').value.trim() || '관리자';
      const btn = document.getElementById('submit-btn');
      if (!db) { alert('잠시 후 다시 시도해주세요'); return; }
      if (!title || !content) { alert('제목과 내용을 입력해주세요!'); return; }
      btn.disabled = true; btn.textContent = '처리 중...';
      try {
        let imageUrl = editingImageUrl;
        if (selectedFile) {
          try { imageUrl = await uploadToCloudinary(selectedFile); }
          catch(err) {
            console.error('이미지 업로드 실패', err);
            if (!confirm('이미지 업로드에 실패했어요.\n이미지 없이 저장할까요?')) {
              btn.disabled = false; btn.textContent = editingId ? '✅ 수정 완료' : '📢 공지 등록'; return;
            }
          }
        }
        if (editingId) {
          await window._updateDoc(window._doc(db, 'notices', editingId), { title, content, tag, author, imageUrl });
          alert('수정되었습니다! ✅');
        } else {
          await window._addDoc(window._collection(db, 'notices'), { title, content, tag, author, imageUrl, createdAt: new Date() });
          alert('공지가 등록되었습니다! ✅');
        }
        closeModal();
        await loadNotices();
      } catch(e) {
        console.error(e);
        alert('오류가 발생했습니다 😢\n' + e.message);
      } finally {
        btn.disabled = false;
        btn.textContent = editingId ? '✅ 수정 완료' : '📢 공지 등록';
      }
    };

    initFirebase();
  </script>
</body>
</html>
