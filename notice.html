<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>공지사항 · YSFC</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Apple SD Gothic Neo', '맑은 고딕', sans-serif; background: #f4f4f4; }

    .header {
      background: linear-gradient(135deg, #1a7c3e, #25a85a);
      color: white;
      padding: 16px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .header-left { display: flex; align-items: center; gap: 12px; }
    .back-btn { font-size: 22px; text-decoration: none; color: white; }
    .header h1 { font-size: 18px; font-weight: 700; }
    .write-btn {
      background: rgba(255,255,255,0.2);
      color: white;
      border: none;
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 13px;
      cursor: pointer;
    }

    .tab-bar {
      background: white;
      display: flex;
      border-bottom: 1px solid #eee;
      padding: 0 14px;
      overflow-x: auto;
    }
    .tab {
      padding: 12px 14px;
      font-size: 13px;
      font-weight: 600;
      color: #aaa;
      border-bottom: 2px solid transparent;
      cursor: pointer;
      white-space: nowrap;
      text-decoration: none;
      background: none;
      border-top: none;
      border-left: none;
      border-right: none;
    }
    .tab.active { color: #1a7c3e; border-bottom: 2px solid #1a7c3e; }

    .notice-list { padding: 12px 14px 80px; }

    .notice-item {
      background: white;
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 10px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
    }
    .notice-top {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 8px;
    }
    .notice-tag {
      font-size: 11px;
      font-weight: 600;
      padding: 3px 8px;
      border-radius: 20px;
    }
    .tag-경기결과 { background: #e8f5ee; color: #1a7c3e; }
    .tag-일정 { background: #e8f0fb; color: #3b5bdb; }
    .tag-대회 { background: #fff3e0; color: #e67e22; }
    .tag-유니폼 { background: #f3e8ff; color: #9333ea; }
    .tag-차량 { background: #fff7ed; color: #ea580c; }
    .tag-일반 { background: #fce4ec; color: #e91e63; }

    .notice-title { font-size: 14px; font-weight: 600; margin-bottom: 4px; }
    .notice-desc { font-size: 12px; color: #888; margin-bottom: 8px; white-space: pre-wrap; }
    .notice-img {
      width: 100%;
      border-radius: 8px;
      margin-bottom: 8px;
      max-height: 200px;
      object-fit: cover;
    }
    .notice-bottom {
      display: flex;
      justify-content: space-between;
      font-size: 11px;
      color: #bbb;
    }
    .new-badge {
      background: #ef4444;
      color: white;
      font-size: 9px;
      padding: 1px 5px;
      border-radius: 10px;
    }

    /* 글쓰기 모달 */
    .modal-bg {
      display: none;
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.5);
      z-index: 100;
    }
    .modal-bg.show { display: flex; align-items: flex-end; }
    .modal {
      background: white;
      width: 100%;
      border-radius: 20px 20px 0 0;
      padding: 20px;
      max-height: 85vh;
      overflow-y: auto;
    }
    .modal-title { font-size: 16px; font-weight: 700; margin-bottom: 16px; text-align: center; }
    .form-group { margin-bottom: 14px; }
    .form-label { font-size: 12px; color: #888; margin-bottom: 6px; display: block; }
    .form-select, .form-input, .form-textarea {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid #eee;
      border-radius: 8px;
      font-size: 14px;
      font-family: inherit;
    }
    .form-textarea { height: 100px; resize: none; }

    .img-upload-area {
      border: 2px dashed #ddd;
      border-radius: 8px;
      padding: 20px;
      text-align: center;
      cursor: pointer;
      color: #aaa;
      font-size: 13px;
    }
    .img-upload-area:hover { border-color: #1a7c3e; color: #1a7c3e; }
    .img-preview {
      width: 100%;
      border-radius: 8px;
      margin-top: 8px;
      display: none;
      max-height: 150px;
      object-fit: cover;
    }

    .form-btn {
      width: 100%;
      padding: 14px;
      background: #1a7c3e;
      color: white;
      border: none;
      border-radius: 12px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      margin-top: 8px;
    }
    .form-btn:disabled { background: #aaa; }
    .cancel-btn {
      width: 100%;
      padding: 12px;
      background: #f4f4f4;
      color: #666;
      border: none;
      border-radius: 12px;
      font-size: 14px;
      cursor: pointer;
      margin-top: 8px;
    }

    .loading { text-align: center; padding: 40px; color: #aaa; font-size: 14px; }

    .bottom-nav {
      position: fixed;
      bottom: 0; left: 0; right: 0;
      background: white;
      border-top: 1px solid #eee;
      display: flex;
      justify-content: space-around;
      padding: 10px 0 16px;
    }
    .nav-item { text-align: center; text-decoration: none; color: #aaa; font-size: 10px; }
    .nav-item.active { color: #1a7c3e; }
    .nav-item .nav-icon { font-size: 22px; display: block; margin-bottom: 2px; }
  </style>
</head>
<body>

  <div class="header">
    <div class="header-left">
      <a href="index.html" class="back-btn">←</a>
      <h1>📢 공지사항</h1>
    </div>
    <button class="write-btn" onclick="openModal()">✏️ 글쓰기</button>
  </div>

  <div class="tab-bar">
    <button class="tab active" onclick="filterNotice('전체', this)">전체</button>
    <button class="tab" onclick="filterNotice('경기결과', this)">경기결과</button>
    <button class="tab" onclick="filterNotice('일정', this)">일정</button>
    <button class="tab" onclick="filterNotice('대회', this)">대회</button>
    <button class="tab" onclick="filterNotice('유니폼', this)">유니폼</button>
    <button class="tab" onclick="filterNotice('차량', this)">차량</button>
    <button class="tab" onclick="filterNotice('일반', this)">일반</button>
  </div>

  <div class="notice-list" id="notice-list">
    <div class="loading">📋 공지사항을 불러오는 중...</div>
  </div>

  <!-- 글쓰기 모달 -->
  <div class="modal-bg" id="modal-bg">
    <div class="modal">
      <div class="modal-title">✏️ 공지 작성</div>
      <div class="form-group">
        <label class="form-label">카테고리</label>
        <select class="form-select" id="form-tag">
          <option value="일반">일반</option>
          <option value="경기결과">경기결과</option>
          <option value="일정">일정</option>
          <option value="대회">대회</option>
          <option value="유니폼">유니폼</option>
          <option value="차량">차량</option>
        </select>
      </div>
      <div class="form-group">
        <label class="form-label">제목</label>
        <input class="form-input" id="form-title" placeholder="제목을 입력하세요" />
      </div>
      <div class="form-group">
        <label class="form-label">내용</label>
        <textarea class="form-textarea" id="form-content" placeholder="내용을 입력하세요"></textarea>
      </div>
      <div class="form-group">
        <label class="form-label">📷 이미지 첨부 (선택)</label>
        <div class="img-upload-area" onclick="document.getElementById('img-input').click()">
          📷 사진을 선택하세요
        </div>
        <input type="file" id="img-input" accept="image/*" style="display:none" onchange="previewImg(this)">
        <img id="img-preview" class="img-preview" />
      </div>
      <div class="form-group">
        <label class="form-label">작성자</label>
        <input class="form-input" id="form-author" placeholder="예: 코치 김철수" />
      </div>
      <button class="form-btn" id="submit-btn" onclick="submitNotice()">📢 공지 등록</button>
      <button class="cancel-btn" onclick="closeModal()">취소</button>
    </div>
  </div>

  <nav class="bottom-nav">
    <a href="index.html" class="nav-item">
      <span class="nav-icon">🏠</span>홈
    </a>
    <a href="notice.html" class="nav-item active">
      <span class="nav-icon">📢</span>공지
    </a>
    <a href="schedule.html" class="nav-item">
      <span class="nav-icon">📅</span>일정
    </a>
    <a href="gallery.html" class="nav-item">
      <span class="nav-icon">📸</span>사진
    </a>
    <a href="players.html" class="nav-item">
      <span class="nav-icon">👦</span>선수
    </a>
  </nav>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.14.0/firebase-app.js";
    import { getFirestore, collection, addDoc, getDocs, orderBy, query } from "https://www.gstatic.com/firebasejs/12.14.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyABY7cdBTXJVbnNVVJmhuo9nXNLerbtVEo",
      authDomain: "ysfc-app-ff413.firebaseapp.com",
      projectId: "ysfc-app-ff413",
      storageBucket: "ysfc-app-ff413.firebasestorage.app",
      messagingSenderId: "791661747168",
      appId: "1:791661747168:web:3540aacb15306331afe985"
    };

    const CLOUD_NAME = "dq4qx2qfg";
    const UPLOAD_PRESET = "YSFC-APP";

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    let allNotices = [];
    let currentFilter = '전체';
    let selectedFile = null;

    window.previewImg = function(input) {
      selectedFile = input.files[0];
      if (selectedFile) {
        const reader = new FileReader();
        reader.onload = e => {
          const preview = document.getElementById('img-preview');
          preview.src = e.target.result;
          preview.style.display = 'block';
        };
        reader.readAsDataURL(selectedFile);
      }
    };

    async function uploadToCloudinary(file) {
      const formData = new FormData();
      formData.append('file', file);
      formData.append('upload_preset', UPLOAD_PRESET);
      const res = await fetch(`https://api.cloudinary.com/v1_1/${CLOUD_NAME}/image/upload`, {
        method: 'POST',
        body: formData
      });
      const data = await res.json();
      return data.secure_url;
    }

    async function loadNotices() {
      try {
        const q = query(collection(db, 'notices'), orderBy('createdAt', 'desc'));
        const snapshot = await getDocs(q);
        allNotices = [];
        snapshot.forEach(doc => {
          allNotices.push({ id: doc.id, ...doc.data() });
        });
        renderNotices();
      } catch(e) {
        document.getElementById('notice-list').innerHTML =
          '<div class="loading">데이터를 불러올 수 없습니다 😢</div>';
      }
    }

    function renderNotices() {
      const list = currentFilter === '전체'
        ? allNotices
        : allNotices.filter(n => n.tag === currentFilter);

      if (list.length === 0) {
        document.getElementById('notice-list').innerHTML =
          '<div class="loading">등록된 공지사항이 없습니다</div>';
        return;
      }

      const now = new Date();
      document.getElementById('notice-list').innerHTML = list.map(n => {
        const date = n.createdAt?.toDate ? n.createdAt.toDate() : new Date();
        const diff = (now - date) / 1000 / 60 / 60;
        const isNew = diff < 24;
        const dateStr = `${date.getFullYear()}.${String(date.getMonth()+1).padStart(2,'0')}.${String(date.getDate()).padStart(2,'0')}`;
        return `
          <div class="notice-item">
            <div class="notice-top">
              <span class="notice-tag tag-${n.tag}">${n.tag}</span>
              ${isNew ? '<span class="new-badge">NEW</span>' : ''}
            </div>
            <div class="notice-title">${n.title}</div>
            <div class="notice-desc">${n.content}</div>
            ${n.imageUrl ? `<img class="notice-img" src="${n.imageUrl}" alt="공지 이미지">` : ''}
            <div class="notice-bottom">
              <span>${n.author}</span>
              <span>${dateStr}</span>
            </div>
          </div>
        `;
      }).join('');
    }

    window.filterNotice = function(filter, el) {
      currentFilter = filter;
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
      el.classList.add('active');
      renderNotices();
    };

    window.openModal = function() {
      document.getElementById('modal-bg').classList.add('show');
    };

    window.closeModal = function() {
      document.getElementById('modal-bg').classList.remove('show');
      selectedFile = null;
      document.getElementById('img-preview').style.display = 'none';
      document.getElementById('img-input').value = '';
    };

    window.submitNotice = async function() {
      const title = document.getElementById('form-title').value.trim();
      const content = document.getElementById('form-content').value.trim();
      const tag = document.getElementById('form-tag').value;
      const author = document.getElementById('form-author').value.trim() || '관리자';
      const btn = document.getElementById('submit-btn');

      if (!title || !content) {
        alert('제목과 내용을 입력해주세요!');
        return;
      }

      btn.disabled = true;
      btn.textContent = '등록 중...';

      try {
        let imageUrl = '';
        if (selectedFile) {
          imageUrl = await uploadToCloudinary(selectedFile);
        }

        await addDoc(collection(db, 'notices'), {
          title, content, tag, author, imageUrl,
          createdAt: new Date()
        });

        alert('공지가 등록되었습니다! ✅');
        document.getElementById('form-title').value = '';
        document.getElementById('form-content').value = '';
        document.getElementById('form-author').value = '';
        closeModal();
        loadNotices();
      } catch(e) {
        alert('등록 중 오류가 발생했습니다 😢');
        console.error(e);
      } finally {
        btn.disabled = false;
        btn.textContent = '📢 공지 등록';
      }
    };

    loadNotices();
  </script>

</body>
</html>
