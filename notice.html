<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>공지사항 · YSFC</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Apple SD Gothic Neo', '맑은 고딕', sans-serif; background: #f4f4f4; }
    .header { background: linear-gradient(135deg, #1a7c3e, #25a85a); color: white; padding: 16px 20px; display: flex; align-items: center; justify-content: space-between; }
    .header-left { display: flex; align-items: center; gap: 12px; }
    .back-btn { font-size: 22px; text-decoration: none; color: white; }
    .header h1 { font-size: 18px; font-weight: 700; }
    .header-btns { display: flex; gap: 8px; }
    .write-btn, .admin-btn { background: rgba(255,255,255,0.2); color: white; border: none; padding: 6px 12px; border-radius: 20px; font-size: 13px; cursor: pointer; }
    .admin-btn.on { background: #fbbf24; color: #333; font-weight: 700; }
    .tab-bar { background: white; display: flex; border-bottom: 1px solid #eee; padding: 0 14px; }
    .tab { padding: 12px 16px; font-size: 13px; font-weight: 600; color: #aaa; border-bottom: 2px solid transparent; cursor: pointer; white-space: nowrap; background: none; border-top: none; border-left: none; border-right: none; }
    .tab.active { color: #1a7c3e; border-bottom: 2px solid #1a7c3e; }
    .notice-list { padding: 12px 14px 80px; }
    .notice-item { background: white; border-radius: 12px; padding: 16px; margin-bottom: 10px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); position: relative; }
    .notice-top { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
    .notice-tag { font-size: 11px; font-weight: 600; padding: 3px 8px; border-radius: 20px; }
    .tag-알림 { background: #e8f5ee; color: #1a7c3e; }
    .tag-유니폼 { background: #f3e8ff; color: #9333ea; }
    .tag-차량 { background: #fff7ed; color: #ea580c; }
    .notice-title { font-size: 14px; font-weight: 600; margin-bottom: 4px; }
    .notice-desc { font-size: 12px; color: #888; margin-bottom: 8px; white-space: pre-wrap; }
    .notice-imgs { display: flex; flex-direction: column; gap: 6px; margin-bottom: 8px; }
    .notice-img { width: 100%; border-radius: 8px; cursor: pointer; }
    .notice-bottom { display: flex; justify-content: space-between; font-size: 11px; color: #bbb; }
    .new-badge { background: #ef4444; color: white; font-size: 9px; padding: 1px 5px; border-radius: 10px; }
    .item-actions { display: flex; gap: 6px; margin-left: auto; }
    .icon-btn { background: #f4f4f4; border: none; border-radius: 8px; padding: 4px 8px; font-size: 12px; cursor: pointer; color: #666; }
    .icon-btn.del { background: #fde8e8; color: #e53e3e; }
    .modal-bg { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.5); z-index: 100; }
    .modal-bg.show { display: flex; align-items: flex-end; }
    .modal { background: white; width: 100%; border-radius: 20px 20px 0 0; padding: 20px; max-height: 85vh; overflow-y: auto; }
    .modal-center { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.5); z-index: 110; align-items: center; justify-content: center; padding: 20px; }
    .modal-center.show { display: flex; }
    .modal-center .box { background: white; border-radius: 16px; padding: 24px; width: 100%; max-width: 320px; }
    .modal-title { font-size: 16px; font-weight: 700; margin-bottom: 16px; text-align: center; }
    .modal-sub { font-size: 12px; color: #888; text-align: center; margin-bottom: 16px; line-height: 1.5; }
    .form-group { margin-bottom: 14px; }
    .form-label { font-size: 12px; color: #888; margin-bottom: 6px; display: block; }
    .form-select, .form-input, .form-textarea { width: 100%; padding: 10px 12px; border: 1px solid #eee; border-radius: 8px; font-size: 14px; font-family: inherit; }
    .form-textarea { height: 100px; resize: none; }
    .img-upload-area { border: 2px dashed #ddd; border-radius: 8px; padding: 20px; text-align: center; cursor: pointer; color: #aaa; font-size: 13px; }
    .preview-count { font-size: 12px; color: #1a7c3e; font-weight: 600; margin-top: 8px; }
    .preview-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin-top: 8px; }
    .preview-item { position: relative; }
    .preview-item img { width: 100%; aspect-ratio: 1; object-fit: cover; border-radius: 6px; }
    .preview-del { position: absolute; top: 2px; right: 2px; background: rgba(0,0,0,0.7); color: white; border: none; border-radius: 50%; width: 20px; height: 20px; font-size: 12px; cursor: pointer; line-height: 1; }
    .form-btn { width: 100%; padding: 14px; background: #1a7c3e; color: white; border: none; border-radius: 12px; font-size: 15px; font-weight: 700; cursor: pointer; margin-top: 8px; }
    .form-btn:disabled { background: #aaa; }
    .cancel-btn { width: 100%; padding: 12px; background: #f4f4f4; color: #666; border: none; border-radius: 12px; font-size: 14px; cursor: pointer; margin-top: 8px; }
    .loading { text-align: center; padding: 40px; color: #aaa; font-size: 14px; }
    .viewer { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.95); z-index: 200; align-items: center; justify-content: center; }
    .viewer.show { display: flex; }
    .viewer img { max-width: 100%; max-height: 90%; object-fit: contain; }
    .viewer-close { position: fixed; top: 16px; right: 20px; color: white; font-size: 32px; cursor: pointer; background: none; border: none; }
    .bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; background: white; border-top: 1px solid #eee; display: flex; justify-content: space-around; padding: 10px 0 16px; }
    .nav-item { text-align: center; text-decoration: none; color: #aaa; font-size: 10px; }
    .nav-item.active { color: #1a7c3e; }
    .nav-item .nav-icon { font-size: 22px; display: block; margin-bottom: 2px; }
  </style>
</head>
<body>
  <div class="header">
    <div class="header-left">
      <a href="index.html" class="back-btn">←</a>
      <h1>📢 공지사항</h1>
    </div>
    <div class="header-btns">
      <button class="admin-btn" id="admin-btn" onclick="toggleAdmin()">🔑</button>
      <button class="write-btn" onclick="openModal()">✏️ 글쓰기</button>
    </div>
  </div>

  <div class="tab-bar">
    <button class="tab active" onclick="filterNotice('전체', this)">전체</button>
    <button class="tab" onclick="filterNotice('알림', this)">알림</button>
    <button class="tab" onclick="filterNotice('유니폼', this)">유니폼</button>
    <button class="tab" onclick="filterNotice('차량', this)">차량</button>
  </div>

  <div class="notice-list" id="notice-list"><div class="loading">📋 공지사항을 불러오는 중...</div></div>

  <div class="modal-bg" id="modal-bg">
    <div class="modal">
      <div class="modal-title" id="modal-title">✏️ 공지 작성</div>
      <div class="form-group">
        <label class="form-label">카테고리</label>
        <select class="form-select" id="form-tag">
          <option value="알림">알림</option>
          <option value="유니폼">유니폼</option>
          <option value="차량">차량</option>
        </select>
      </div>
      <div class="form-group">
        <label class="form-label">제목</label>
        <input class="form-input" id="form-title" placeholder="제목을 입력하세요" />
      </div>
      <div class="form-group">
        <label class="form-label">내용</label>
        <textarea class="form-textarea" id="form-content" placeholder="내용을 입력하세요"></textarea>
      </div>
      <div class="form-group">
        <label class="form-label">📷 이미지 첨부 (여러 장 가능)</label>
        <div class="img-upload-area" onclick="document.getElementById('img-input').click()">📷 사진 선택 / 더 추가하기</div>
        <input type="file" id="img-input" accept="image/*" multiple style="display:none" onchange="addImgs(this)">
        <div class="preview-count" id="preview-count"></div>
        <div class="preview-grid" id="preview-grid"></div>
      </div>
      <button class="form-btn" id="submit-btn" onclick="submitNotice()">📢 공지 등록</button>
      <button class="cancel-btn" onclick="closeModal()">취소</button>
    </div>
  </div>

  <!-- 닉네임 입력 모달 -->
  <div class="modal-center" id="nick-modal">
    <div class="box">
      <div class="modal-title">👋 환영합니다!</div>
      <div class="modal-sub">앱에서 사용할 이름을 입력해주세요.<br>(글 작성 시 표시됩니다)<br><br>예) (3학년) 이유찬 엄마<br>김영신 감독 / 이유찬 선수</div>
      <input class="form-input" id="nick-input" placeholder="이름을 입력하세요" />
      <button class="form-btn" onclick="saveNick()">✅ 시작하기</button>
    </div>
  </div>

  <!-- 관리자 비번 모달 -->
  <div class="modal-center" id="admin-modal">
    <div class="box">
      <div class="modal-title">🔑 관리자 모드</div>
      <div class="modal-sub">관리자 비밀번호를 입력하면<br>모든 글을 수정·삭제할 수 있습니다.</div>
      <input class="form-input" id="admin-input" type="password" placeholder="비밀번호" />
      <button class="form-btn" onclick="checkAdmin()">확인</button>
      <button class="cancel-btn" onclick="closeAdminModal()">취소</button>
    </div>
  </div>

  <div class="viewer" id="viewer">
    <button class="viewer-close" onclick="closeViewer()">✕</button>
    <img id="viewer-img" src="" alt="">
  </div>

  <nav class="bottom-nav">
    <a href="index.html" class="nav-item"><span class="nav-icon">🏠</span>홈</a>
    <a href="notice.html" class="nav-item active"><span class="nav-icon">📢</span>공지</a>
    <a href="schedule.html" class="nav-item"><span class="nav-icon">📅</span>일정</a>
    <a href="gallery.html" class="nav-item"><span class="nav-icon">📸</span>사진</a>
    <a href="players.html" class="nav-item"><span class="nav-icon">👦</span>선수</a>
  </nav>

  <script>
    const CLOUD_NAME = "dq4qx2qfg";
    const UPLOAD_PRESET = "YSFC-APP";
    const ADMIN_PW = "ysfc486";
    let allNotices = [];
    let currentFilter = '전체';
    let selectedFiles = [];
    let editingId = null;
    let editingImages = [];
    const readNotices = JSON.parse(localStorage.getItem('readNotices') || '[]');
    let myNick = localStorage.getItem('ysfc_nick') || '';
    let isAdmin = sessionStorage.getItem('ysfc_admin') === '1';
    let db = null;

    async function initFirebase() {
      try {
        const { initializeApp } = await import("https://www.gstatic.com/firebasejs/12.14.0/firebase-app.js");
        const { getFirestore, collection, addDoc, getDocs, doc, updateDoc, deleteDoc } = await import("https://www.gstatic.com/firebasejs/12.14.0/firebase-firestore.js");
        const firebaseConfig = {
          apiKey: "AIzaSyABY7cdBTXJVbnNVVJmhuo9nXNLerbtVEo",
          authDomain: "ysfc-app-ff413.firebaseapp.com",
          projectId: "ysfc-app-ff413",
          storageBucket: "ysfc-app-ff413.firebasestorage.app",
          messagingSenderId: "791661747168",
          appId: "1:791661747168:web:3540aacb15306331afe985"
        };
        const app = initializeApp(firebaseConfig);
        db = getFirestore(app);
        window._addDoc = addDoc; window._collection = collection; window._getDocs = getDocs;
        window._doc = doc; window._updateDoc = updateDoc; window._deleteDoc = deleteDoc;
        await loadNotices();
      } catch(e) {
        console.error('Firebase 오류:', e);
        document.getElementById('notice-list').innerHTML = '<div class="loading">연결 오류가 발생했습니다 😢</div>';
      }
    }

    function checkNick() {
      if (!myNick) document.getElementById('nick-modal').classList.add('show');
    }
    window.saveNick = function() {
      const v = document.getElementById('nick-input').value.trim();
      if (!v) { alert('이름을 입력해주세요!'); return; }
      myNick = v;
      localStorage.setItem('ysfc_nick', v);
      document.getElementById('nick-modal').classList.remove('show');
    };

    window.toggleAdmin = function() {
      if (isAdmin) {
        if (confirm('관리자 모드를 끌까요?')) {
          isAdmin = false;
          sessionStorage.removeItem('ysfc_admin');
          updateAdminBtn();
          renderNotices();
        }
      } else {
        document.getElementById('admin-modal').classList.add('show');
      }
    };
    window.checkAdmin = function() {
      const v = document.getElementById('admin-input').value;
      if (v === ADMIN_PW) {
        isAdmin = true;
        sessionStorage.setItem('ysfc_admin', '1');
        document.getElementById('admin-modal').classList.remove('show');
        document.getElementById('admin-input').value = '';
        updateAdminBtn();
        renderNotices();
        alert('관리자 모드 ON ✅');
      } else { alert('비밀번호가 틀렸습니다 😢'); }
    };
    window.closeAdminModal = function() {
      document.getElementById('admin-modal').classList.remove('show');
      document.getElementById('admin-input').value = '';
    };
    function updateAdminBtn() {
      const btn = document.getElementById('admin-btn');
      if (isAdmin) { btn.classList.add('on'); btn.textContent = '🔑 ON'; }
      else { btn.classList.remove('on'); btn.textContent = '🔑'; }
    }

    window.addImgs = function(input) {
      const files = Array.from(input.files);
      selectedFiles = selectedFiles.concat(files);
      input.value = '';
      renderPreviews();
    };

    function renderPreviews() {
      const grid = document.getElementById('preview-grid');
      const count = document.getElementById('preview-count');
      let html = '';
      editingImages.forEach((url, idx) => {
        html += '<div class="preview-item"><img src="' + url + '"><button class="preview-del" onclick="removeExisting(' + idx + ')">✕</button></div>';
      });
      const totalCount = editingImages.length + selectedFiles.length;
      count.textContent = totalCount > 0 ? '이미지 ' + totalCount + '장' : '';
      grid.innerHTML = html;
      selectedFiles.forEach((file, idx) => {
        const reader = new FileReader();
        reader.onload = e => {
          const div = document.createElement('div');
          div.className = 'preview-item';
          div.innerHTML = '<img src="' + e.target.result + '"><button class="preview-del" onclick="removePreview(' + idx + ')">✕</button>';
          grid.appendChild(div);
        };
        reader.readAsDataURL(file);
      });
    }
    window.removePreview = function(idx) { selectedFiles.splice(idx, 1); renderPreviews(); };
    window.removeExisting = function(idx) { editingImages.splice(idx, 1); renderPreviews(); };

    function compressImage(file) {
      return new Promise((resolve) => {
        if (!file.type.startsWith('image/')) { resolve(file); return; }
        const reader = new FileReader();
        reader.onload = e => {
          const img = new Image();
          img.onload = () => {
            const maxW = 1280;
            let w = img.width, h = img.height;
            if (w > maxW) { h = Math.round(h * maxW / w); w = maxW; }
            const canvas = document.createElement('canvas');
            canvas.width = w; canvas.height = h;
            canvas.getContext('2d').drawImage(img, 0, 0, w, h);
            canvas.toBlob(blob => { resolve(blob && blob.size < file.size ? blob : file); }, 'image/jpeg', 0.8);
          };
          img.onerror = () => resolve(file);
          img.src = e.target.result;
        };
        reader.onerror = () => resolve(file);
        reader.readAsDataURL(file);
      });
    }

    async function uploadToCloudinary(file) {
      const compressed = await compressImage(file);
      const formData = new FormData();
      formData.append('file', compressed);
      formData.append('upload_preset', UPLOAD_PRESET);
      const res = await fetch('https://api.cloudinary.com/v1_1/' + CLOUD_NAME + '/image/upload', { method: 'POST', body: formData });
      if (!res.ok) throw new Error('업로드 실패');
      const data = await res.json();
      if (!data.secure_url) throw new Error('URL 없음');
      return data.secure_url;
    }

    async function loadNotices() {
      try {
        const snapshot = await window._getDocs(window._collection(db, 'notices'));
        allNotices = [];
        snapshot.forEach(d => allNotices.push({ id: d.id, ...d.data() }));
        allNotices.sort((a, b) => getTime(b.createdAt) - getTime(a.createdAt));
        renderNotices();
      } catch(e) {
        console.error(e);
        document.getElementById('notice-list').innerHTML = '<div class="loading">데이터를 불러올 수 없습니다 😢</div>';
      }
    }

    function getTime(ts) {
      if (!ts) return 0;
      if (ts.toDate) return ts.toDate().getTime();
      return new Date(ts).getTime();
    }

    function getImages(n) {
      if (Array.isArray(n.images)) return n.images;
      if (n.imageUrl) return [n.imageUrl];
      return [];
    }

    function canEdit(n) {
      return isAdmin || (n.author && n.author === myNick);
    }

    function renderNotices() {
      const list = currentFilter === '전체' ? allNotices : allNotices.filter(n => n.tag === currentFilter);
      if (list.length === 0) {
        document.getElementById('notice-list').innerHTML = '<div class="loading">등록된 공지사항이 없습니다</div>';
        return;
      }
      document.getElementById('notice-list').innerHTML = list.map(n => {
        const date = n.createdAt?.toDate ? n.createdAt.toDate() : (n.createdAt ? new Date(n.createdAt) : new Date());
        const isNew = !readNotices.includes(n.id);
        const dateStr = date.getFullYear() + '.' + String(date.getMonth()+1).padStart(2,'0') + '.' + String(date.getDate()).padStart(2,'0');
        const imgs = getImages(n);
        const imgHtml = imgs.length > 0
          ? '<div class="notice-imgs">' + imgs.map(u => '<img class="notice-img" src="' + u + '" onclick="openViewer(\'' + u + '\')">').join('') + '</div>'
          : '';
        const actions = canEdit(n)
          ? '<div class="item-actions">' +
              '<button class="icon-btn" onclick="editNotice(\'' + n.id + '\')">✏️ 수정</button>' +
              '<button class="icon-btn del" onclick="deleteNotice(\'' + n.id + '\')">🗑️ 삭제</button>' +
            '</div>'
          : '';
        return '<div class="notice-item">' +
            '<div class="notice-top">' +
              '<span class="notice-tag tag-' + n.tag + '">' + n.tag + '</span>' +
              (isNew ? '<span class="new-badge">NEW</span>' : '') +
              actions +
            '</div>' +
            '<div class="notice-title">' + n.title + '</div>' +
            '<div class="notice-desc">' + n.content + '</div>' +
            imgHtml +
            '<div class="notice-bottom"><span>' + (n.author || '관리자') + '</span><span>' + dateStr + '</span></div>' +
          '</div>';
      }).join('');
      markReadOnView(list);
    }

    function markReadOnView(list) {
      let changed = false;
      list.forEach(n => { if (!readNotices.includes(n.id)) { readNotices.push(n.id); changed = true; } });
      if (changed) localStorage.setItem('readNotices', JSON.stringify(readNotices));
    }

    window.openViewer = function(url) {
      document.getElementById('viewer-img').src = url;
      document.getElementById('viewer').classList.add('show');
    };
    window.closeViewer = function() { document.getElementById('viewer').classList.remove('show'); };

    window.filterNotice = function(filter, el) {
      currentFilter = filter;
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
      el.classList.add('active');
      renderNotices();
    };

    window.openModal = function() {
      if (!myNick) { checkNick(); return; }
      editingId = null;
      editingImages = [];
      selectedFiles = [];
      document.getElementById('modal-title').textContent = '✏️ 공지 작성';
      document.getElementById('submit-btn').textContent = '📢 공지 등록';
      document.getElementById('form-tag').value = '알림';
      document.getElementById('form-title').value = '';
      document.getElementById('form-content').value = '';
      renderPreviews();
      document.getElementById('modal-bg').classList.add('show');
    };

    window.editNotice = function(id) {
      const n = allNotices.find(x => x.id === id);
      if (!n) return;
      if (!canEdit(n)) { alert('본인이 작성한 글만 수정할 수 있습니다.'); return; }
      editingId = id;
      editingImages = getImages(n).slice();
      selectedFiles = [];
      document.getElementById('modal-title').textContent = '✏️ 공지 수정';
      document.getElementById('submit-btn').textContent = '✅ 수정 완료';
      document.getElementById('form-tag').value = n.tag;
      document.getElementById('form-title').value = n.title;
      document.getElementById('form-content').value = n.content;
      renderPreviews();
      document.getElementById('modal-bg').classList.add('show');
    };

    window.deleteNotice = async function(id) {
      const n = allNotices.find(x => x.id === id);
      if (!canEdit(n)) { alert('본인이 작성한 글만 삭제할 수 있습니다.'); return; }
      if (!confirm('이 공지를 삭제할까요?')) return;
      try {
        await window._deleteDoc(window._doc(db, 'notices', id));
        alert('삭제되었습니다 ✅');
        await loadNotices();
      } catch(e) { console.error(e); alert('삭제 중 오류가 발생했습니다 😢'); }
    };

    window.closeModal = function() {
      document.getElementById('modal-bg').classList.remove('show');
      selectedFiles = [];
      editingImages = [];
      editingId = null;
    };

    window.submitNotice = async function() {
      const title = document.getElementById('form-title').value.trim();
      const content = document.getElementById('form-content').value.trim();
      const tag = document.getElementById('form-tag').value;
      const btn = document.getElementById('submit-btn');
      if (!db) { alert('잠시 후 다시 시도해주세요'); return; }
      if (!title || !content) { alert('제목과 내용을 입력해주세요!'); return; }
      btn.disabled = true;
      try {
        const images = editingImages.slice();
        if (selectedFiles.length > 0) {
          btn.textContent = '사진 ' + selectedFiles.length + '장 업로드 중...';
          const results = await Promise.allSettled(selectedFiles.map(f => uploadToCloudinary(f)));
          let failCount = 0;
          results.forEach(r => { if (r.status === 'fulfilled') images.push(r.value); else failCount++; });
          if (failCount > 0 && !confirm('사진 ' + failCount + '장이 실패했어요.\n나머지만 등록할까요?')) {
            btn.disabled = false; btn.textContent = editingId ? '✅ 수정 완료' : '📢 공지 등록'; return;
          }
        }
        btn.textContent = '저장 중...';
        if (editingId) {
          const n = allNotices.find(x => x.id === editingId);
          await window._updateDoc(window._doc(db, 'notices', editingId), { title, content, tag, author: n.author || myNick, images, imageUrl: images[0] || '' });
          alert('수정되었습니다! ✅');
        } else {
          await window._addDoc(window._collection(db, 'notices'), { title, content, tag, author: myNick, images, imageUrl: images[0] || '', createdAt: new Date() });
          alert('공지가 등록되었습니다! ✅');
        }
        closeModal();
        await loadNotices();
      } catch(e) {
        console.error(e);
        alert('오류가 발생했습니다 😢\n' + e.message);
      } finally {
        btn.disabled = false;
        btn.textContent = editingId ? '✅ 수정 완료' : '📢 공지 등록';
      }
    };

    updateAdminBtn();
    checkNick();
    initFirebase();
  </script>
</body>
</html>
