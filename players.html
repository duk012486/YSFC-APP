<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>선수명단 · YSFC</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Apple SD Gothic Neo', '맑은 고딕', sans-serif; background: #f4f4f4; }
    .header { background: linear-gradient(135deg, #1a7c3e, #25a85a); color: white; padding: 16px 20px; display: flex; align-items: center; justify-content: space-between; }
    .header-left { display: flex; align-items: center; gap: 12px; }
    .back-btn { font-size: 22px; text-decoration: none; color: white; }
    .header h1 { font-size: 18px; font-weight: 700; }
    .header-btns { display: flex; gap: 8px; }
    .add-btn, .admin-btn { background: rgba(255,255,255,0.2); color: white; border: none; padding: 6px 12px; border-radius: 20px; font-size: 13px; cursor: pointer; }
    .admin-btn.on { background: #fbbf24; color: #333; font-weight: 700; }
    .grade-section { margin: 14px 14px 0; }
    .grade-header { display: flex; align-items: center; gap: 8px; padding: 10px 14px; border-radius: 12px 12px 0 0; color: white; font-size: 15px; font-weight: 700; }
    .grade-count { font-size: 12px; font-weight: 500; background: rgba(255,255,255,0.25); padding: 2px 10px; border-radius: 20px; margin-left: auto; }
    .grade-body { background: white; border-radius: 0 0 12px 12px; padding: 14px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); }
    .gr-1 { background: #16a34a; } .gr-2 { background: #2563eb; } .gr-3 { background: #ca8a04; }
    .gr-4 { background: #ea580c; } .gr-5 { background: #dc2626; } .gr-6 { background: #4b5563; }
    .player-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .player-card { background: #fafafa; border-radius: 14px; padding: 16px 12px; text-align: center; position: relative; border: 1px solid #f0f0f0; }
    .player-photo { width: 96px; height: 96px; border-radius: 50%; object-fit: cover; margin: 0 auto 10px; background: #e8f5ee; display: flex; align-items: center; justify-content: center; font-size: 42px; border: 3px solid #1a7c3e; }
    .player-no { position: absolute; top: 10px; left: 10px; background: #1a7c3e; color: white; font-size: 11px; font-weight: 700; padding: 3px 8px; border-radius: 20px; }
    .player-name { font-size: 15px; font-weight: 700; color: #333; margin-bottom: 6px; }
    .player-name .hash { color: #1a7c3e; font-size: 13px; margin-left: 3px; }
    .pos-list { display: flex; flex-wrap: wrap; gap: 4px; justify-content: center; }
    .pos-badge { font-size: 10px; font-weight: 600; padding: 2px 8px; border-radius: 20px; }
    .pos-FW { background: #fde8e8; color: #e53e3e; }
    .pos-WG { background: #fef3c7; color: #d97706; }
    .pos-MF { background: #e8f5ee; color: #1a7c3e; }
    .pos-DF { background: #e8f0fb; color: #3b5bdb; }
    .pos-GK { background: #f3e8ff; color: #9333ea; }
    .card-actions { display: flex; gap: 4px; justify-content: center; margin-top: 10px; }
    .icon-btn { background: #fff; border: 1px solid #eee; border-radius: 8px; padding: 4px 10px; font-size: 11px; cursor: pointer; color: #666; }
    .icon-btn.del { background: #fde8e8; color: #e53e3e; border-color: #fcc; }
    .modal-bg { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.5); z-index: 100; }
    .modal-bg.show { display: flex; align-items: flex-end; }
    .modal { background: white; width: 100%; border-radius: 20px 20px 0 0; padding: 20px; max-height: 88vh; overflow-y: auto; }
    .modal-center { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.5); z-index: 110; align-items: center; justify-content: center; padding: 20px; }
    .modal-center.show { display: flex; }
    .modal-center .box { background: white; border-radius: 16px; padding: 24px; width: 100%; max-width: 320px; }
    .modal-title { font-size: 16px; font-weight: 700; margin-bottom: 16px; text-align: center; }
    .modal-sub { font-size: 12px; color: #888; text-align: center; margin-bottom: 16px; line-height: 1.5; }
    .form-group { margin-bottom: 14px; }
    .form-label { font-size: 12px; color: #888; margin-bottom: 6px; display: block; }
    .form-select, .form-input { width: 100%; padding: 10px 12px; border: 1px solid #eee; border-radius: 8px; font-size: 14px; font-family: inherit; }
    .form-row { display: flex; gap: 10px; }
    .form-row > div { flex: 1; }
    .pos-select { display: flex; flex-wrap: wrap; gap: 8px; }
    .pos-option { padding: 8px 14px; border-radius: 20px; border: 2px solid #eee; cursor: pointer; font-size: 13px; font-weight: 600; color: #aaa; background: white; }
    .pos-option.selected { border-color: #1a7c3e; color: #1a7c3e; background: #f0fff4; }
    .img-upload-area { border: 2px dashed #ddd; border-radius: 8px; padding: 20px; text-align: center; cursor: pointer; color: #aaa; font-size: 13px; }
    .img-preview { width: 100px; height: 100px; border-radius: 50%; object-fit: cover; margin: 8px auto 0; display: none; border: 3px solid #1a7c3e; }
    .form-btn { width: 100%; padding: 14px; background: #1a7c3e; color: white; border: none; border-radius: 12px; font-size: 15px; font-weight: 700; cursor: pointer; margin-top: 8px; }
    .form-btn:disabled { background: #aaa; }
    .cancel-btn { width: 100%; padding: 12px; background: #f4f4f4; color: #666; border: none; border-radius: 12px; font-size: 14px; cursor: pointer; margin-top: 8px; }
    .loading { text-align: center; padding: 40px; color: #aaa; font-size: 14px; }
    .bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; background: white; border-top: 1px solid #eee; display: flex; justify-content: space-around; padding: 10px 0 16px; }
    .nav-item { text-align: center; text-decoration: none; color: #aaa; font-size: 10px; }
    .nav-item.active { color: #1a7c3e; }
    .nav-item .nav-icon { font-size: 22px; display: block; margin-bottom: 2px; }
    .content { padding-bottom: 90px; }
  </style>
</head>
<body>
  <div class="header">
    <div class="header-left">
      <a href="index.html" class="back-btn">←</a>
      <h1>👦 선수 명단</h1>
    </div>
    <div class="header-btns">
      <button class="admin-btn" id="admin-btn" onclick="toggleAdmin()">🔑</button>
      <button class="add-btn" onclick="openModal()">➕ 선수</button>
    </div>
  </div>

  <div class="content" id="content"><div class="loading">선수 명단을 불러오는 중...</div></div>

  <div class="modal-bg" id="modal-bg">
    <div class="modal">
      <div class="modal-title" id="modal-title">➕ 선수 추가</div>
      <div class="form-group">
        <label class="form-label">이름</label>
        <input class="form-input" id="form-name" placeholder="예: 이유찬" />
      </div>
      <div class="form-row">
        <div class="form-group">
          <label class="form-label">등번호</label>
          <input class="form-input" id="form-number" type="number" placeholder="23" />
        </div>
        <div class="form-group">
          <label class="form-label">학년</label>
          <select class="form-select" id="form-grade">
            <option value="1">1학년</option>
            <option value="2">2학년</option>
            <option value="3">3학년</option>
            <option value="4">4학년</option>
            <option value="5">5학년</option>
            <option value="6">6학년</option>
          </select>
        </div>
      </div>
      <div class="form-group">
        <label class="form-label">포지션 (여러 개 선택 가능)</label>
        <div class="pos-select">
          <div class="pos-option" data-pos="FW" onclick="togglePos(this)">FW 공격수</div>
          <div class="pos-option" data-pos="WG" onclick="togglePos(this)">WG 윙</div>
          <div class="pos-option" data-pos="MF" onclick="togglePos(this)">MF 미드필더</div>
          <div class="pos-option" data-pos="DF" onclick="togglePos(this)">DF 수비수</div>
          <div class="pos-option" data-pos="GK" onclick="togglePos(this)">GK 골키퍼</div>
        </div>
      </div>
      <div class="form-group">
        <label class="form-label">📷 선수 사진 (선택)</label>
        <div class="img-upload-area" onclick="document.getElementById('img-input').click()">📷 사진을 선택하세요</div>
        <input type="file" id="img-input" accept="image/*" style="display:none" onchange="previewImg(this)">
        <img id="img-preview" class="img-preview" />
      </div>
      <button class="form-btn" id="submit-btn" onclick="submitPlayer()">➕ 선수 등록</button>
      <button class="cancel-btn" onclick="closeModal()">취소</button>
    </div>
  </div>

  <div class="modal-center" id="nick-modal">
    <div class="box">
      <div class="modal-title">👋 환영합니다!</div>
      <div class="modal-sub">앱에서 사용할 이름을 입력해주세요.<br>(글 작성 시 표시됩니다)<br><br>예) (3학년) 이유찬 엄마<br>김영신 감독 / 이유찬 선수</div>
      <input class="form-input" id="nick-input" placeholder="이름을 입력하세요" />
      <button class="form-btn" onclick="saveNick()">✅ 시작하기</button>
    </div>
  </div>

  <div class="modal-center" id="admin-modal">
    <div class="box">
      <div class="modal-title">🔑 관리자 모드</div>
      <div class="modal-sub">관리자 비밀번호를 입력하면<br>모든 선수를 수정·삭제할 수 있습니다.</div>
      <input class="form-input" id="admin-input" type="password" placeholder="비밀번호" />
      <button class="form-btn" onclick="checkAdmin()">확인</button>
      <button class="cancel-btn" onclick="closeAdminModal()">취소</button>
    </div>
  </div>

  <nav class="bottom-nav">
    <a href="index.html" class="nav-item"><span class="nav-icon">🏠</span>홈</a>
    <a href="notice.html" class="nav-item"><span class="nav-icon">📢</span>공지</a>
    <a href="schedule.html" class="nav-item"><span class="nav-icon">📅</span>일정</a>
    <a href="gallery.html" class="nav-item"><span class="nav-icon">📸</span>사진</a>
    <a href="players.html" class="nav-item active"><span class="nav-icon">👦</span>선수</a>
  </nav>

  <script>
    const CLOUD_NAME = "dq4qx2qfg";
    const UPLOAD_PRESET = "YSFC-APP";
    const ADMIN_PW = "ysfc486";
    let allPlayers = [];
    let selectedFile = null;
    let editingId = null;
    let editingPhotoUrl = '';
    let selectedPos = [];
    let myNick = localStorage.getItem('ysfc_nick') || '';
    let isAdmin = sessionStorage.getItem('ysfc_admin') === '1';
    let db = null;

    async function initFirebase() {
      try {
        const { initializeApp } = await import("https://www.gstatic.com/firebasejs/12.14.0/firebase-app.js");
        const { getFirestore, collection, addDoc, getDocs, doc, updateDoc, deleteDoc } = await import("https://www.gstatic.com/firebasejs/12.14.0/firebase-firestore.js");
        const firebaseConfig = {
          apiKey: "AIzaSyABY7cdBTXJVbnNVVJmhuo9nXNLerbtVEo",
          authDomain: "ysfc-app-ff413.firebaseapp.com",
          projectId: "ysfc-app-ff413",
          storageBucket: "ysfc-app-ff413.firebasestorage.app",
          messagingSenderId: "791661747168",
          appId: "1:791661747168:web:3540aacb15306331afe985"
        };
        const app = initializeApp(firebaseConfig);
        db = getFirestore(app);
        window._addDoc = addDoc; window._collection = collection; window._getDocs = getDocs;
        window._doc = doc; window._updateDoc = updateDoc; window._deleteDoc = deleteDoc;
        await loadPlayers();
      } catch(e) {
        console.error('Firebase 오류:', e);
        document.getElementById('content').innerHTML = '<div class="loading">연결 오류가 발생했습니다 😢</div>';
      }
    }

    function checkNick() { if (!myNick) document.getElementById('nick-modal').classList.add('show'); }
    window.saveNick = function() {
      const v = document.getElementById('nick-input').value.trim();
      if (!v) { alert('이름을 입력해주세요!'); return; }
      myNick = v; localStorage.setItem('ysfc_nick', v);
      document.getElementById('nick-modal').classList.remove('show');
    };

    window.toggleAdmin = function() {
      if (isAdmin) {
        if (confirm('관리자 모드를 끌까요?')) {
          isAdmin = false; sessionStorage.removeItem('ysfc_admin');
          updateAdminBtn(); renderPlayers();
        }
      } else { document.getElementById('admin-modal').classList.add('show'); }
    };
    window.checkAdmin = function() {
      const v = document.getElementById('admin-input').value;
      if (v === ADMIN_PW) {
        isAdmin = true; sessionStorage.setItem('ysfc_admin', '1');
        document.getElementById('admin-modal').classList.remove('show');
        document.getElementById('admin-input').value = '';
        updateAdminBtn(); renderPlayers();
        alert('관리자 모드 ON ✅');
      } else { alert('비밀번호가 틀렸습니다 😢'); }
    };
    window.closeAdminModal = function() {
      document.getElementById('admin-modal').classList.remove('show');
      document.getElementById('admin-input').value = '';
    };
    function updateAdminBtn() {
      const btn = document.getElementById('admin-btn');
      if (isAdmin) { btn.classList.add('on'); btn.textContent = '🔑 ON'; }
      else { btn.classList.remove('on'); btn.textContent = '🔑'; }
    }

    function canEdit(p) { return isAdmin || (p.author && p.author === myNick); }

    window.togglePos = function(el) {
      const pos = el.dataset.pos;
      const idx = selectedPos.indexOf(pos);
      if (idx === -1) { selectedPos.push(pos); el.classList.add('selected'); }
      else { selectedPos.splice(idx, 1); el.classList.remove('selected'); }
    };

    window.previewImg = function(input) {
      selectedFile = input.files[0];
      if (selectedFile) {
        const reader = new FileReader();
        reader.onload = e => { const p = document.getElementById('img-preview'); p.src = e.target.result; p.style.display = 'block'; };
        reader.readAsDataURL(selectedFile);
      }
    };

    function compressImage(file) {
      return new Promise((resolve) => {
        if (!file.type.startsWith('image/')) { resolve(file); return; }
        const reader = new FileReader();
        reader.onload = e => {
          const img = new Image();
          img.onload = () => {
            const maxW = 800;
            let w = img.width, h = img.height;
            if (w > maxW) { h = Math.round(h * maxW / w); w = maxW; }
            const canvas = document.createElement('canvas');
            canvas.width = w; canvas.height = h;
            canvas.getContext('2d').drawImage(img, 0, 0, w, h);
            canvas.toBlob(blob => { resolve(blob && blob.size < file.size ? blob : file); }, 'image/jpeg', 0.8);
          };
          img.onerror = () => resolve(file);
          img.src = e.target.result;
        };
        reader.onerror = () => resolve(file);
        reader.readAsDataURL(file);
      });
    }

    async function uploadToCloudinary(file) {
      const compressed = await compressImage(file);
      const formData = new FormData();
      formData.append('file', compressed);
      formData.append('upload_preset', UPLOAD_PRESET);
      const res = await fetch('https://api.cloudinary.com/v1_1/' + CLOUD_NAME + '/image/upload', { method: 'POST', body: formData });
      if (!res.ok) throw new Error('Cloudinary 업로드 실패');
      const data = await res.json();
      if (!data.secure_url) throw new Error('URL 없음');
      return data.secure_url;
    }

    async function loadPlayers() {
      try {
        const snapshot = await window._getDocs(window._collection(db, 'players'));
        allPlayers = [];
        snapshot.forEach(d => allPlayers.push({ id: d.id, ...d.data() }));
        renderPlayers();
      } catch(e) {
        console.error(e);
        document.getElementById('content').innerHTML = '<div class="loading">데이터를 불러올 수 없습니다 😢</div>';
      }
    }

    function getPosArray(p) {
      if (Array.isArray(p.positions)) return p.positions;
      if (p.pos) return [p.pos];
      return [];
    }

    function renderPlayers() {
      if (allPlayers.length === 0) {
        document.getElementById('content').innerHTML = '<div class="loading">등록된 선수가 없습니다<br>➕ 선수 버튼으로 추가해주세요!</div>';
        return;
      }
      const byGrade = {};
      allPlayers.forEach(p => {
        const g = p.grade || '기타';
        if (!byGrade[g]) byGrade[g] = [];
        byGrade[g].push(p);
      });
      let html = '';
      Object.keys(byGrade).sort((a,b) => a - b).forEach(grade => {
        const players = byGrade[grade].sort((a,b) => (a.number||0) - (b.number||0));
        html += '<div class="grade-section">' +
          '<div class="grade-header gr-' + grade + '">⚽ ' + grade + '학년 <span class="grade-count">' + players.length + '명</span></div>' +
          '<div class="grade-body"><div class="player-grid">';
        players.forEach(p => {
          const photo = p.photoUrl ? '<img class="player-photo" src="' + p.photoUrl + '" alt="' + p.name + '">' : '<div class="player-photo">⚽</div>';
          const posArr = getPosArray(p);
          const posBadges = posArr.map(pos => '<span class="pos-badge pos-' + pos + '">' + pos + '</span>').join('');
          const actions = canEdit(p)
            ? '<div class="card-actions">' +
                '<button class="icon-btn" onclick="editPlayer(\'' + p.id + '\')">✏️ 수정</button>' +
                '<button class="icon-btn del" onclick="deletePlayer(\'' + p.id + '\')">🗑️</button>' +
              '</div>'
            : '';
          html += '<div class="player-card">' +
              '<div class="player-no">NO.' + (p.number || '-') + '</div>' +
              photo +
              '<div class="player-name">' + p.name + '<span class="hash">#' + (p.number || '-') + '</span></div>' +
              '<div class="pos-list">' + posBadges + '</div>' +
              actions +
            '</div>';
        });
        html += '</div></div></div>';
      });
      document.getElementById('content').innerHTML = html;
    }

    function resetPosUI() {
      selectedPos = [];
      document.querySelectorAll('.pos-option').forEach(o => o.classList.remove('selected'));
    }

    window.openModal = function() {
      if (!myNick) { checkNick(); return; }
      editingId = null; editingPhotoUrl = '';
      document.getElementById('modal-title').textContent = '➕ 선수 추가';
      document.getElementById('submit-btn').textContent = '➕ 선수 등록';
      document.getElementById('form-name').value = '';
      document.getElementById('form-number').value = '';
      document.getElementById('form-grade').value = '1';
      resetPosUI();
      document.getElementById('img-preview').style.display = 'none';
      document.getElementById('img-input').value = '';
      selectedFile = null;
      document.getElementById('modal-bg').classList.add('show');
    };

    window.editPlayer = function(id) {
      const p = allPlayers.find(x => x.id === id);
      if (!p) return;
      if (!canEdit(p)) { alert('본인이 등록한 선수만 수정할 수 있습니다.'); return; }
      editingId = id; editingPhotoUrl = p.photoUrl || '';
      document.getElementById('modal-title').textContent = '✏️ 선수 수정';
      document.getElementById('submit-btn').textContent = '✅ 수정 완료';
      document.getElementById('form-name').value = p.name;
      document.getElementById('form-number').value = p.number || '';
      document.getElementById('form-grade').value = p.grade;
      resetPosUI();
      selectedPos = getPosArray(p).slice();
      document.querySelectorAll('.pos-option').forEach(o => { if (selectedPos.includes(o.dataset.pos)) o.classList.add('selected'); });
      selectedFile = null;
      const pv = document.getElementById('img-preview');
      if (p.photoUrl) { pv.src = p.photoUrl; pv.style.display = 'block'; }
      else { pv.style.display = 'none'; }
      document.getElementById('img-input').value = '';
      document.getElementById('modal-bg').classList.add('show');
    };

    window.deletePlayer = async function(id) {
      const p = allPlayers.find(x => x.id === id);
      if (!canEdit(p)) { alert('본인이 등록한 선수만 삭제할 수 있습니다.'); return; }
      if (!confirm('이 선수를 삭제할까요?')) return;
      try {
        await window._deleteDoc(window._doc(db, 'players', id));
        alert('삭제되었습니다 ✅');
        await loadPlayers();
      } catch(e) { console.error(e); alert('삭제 중 오류가 발생했습니다 😢'); }
    };

    window.closeModal = function() {
      document.getElementById('modal-bg').classList.remove('show');
      selectedFile = null; editingId = null;
      document.getElementById('img-preview').style.display = 'none';
      document.getElementById('img-input').value = '';
    };

    window.submitPlayer = async function() {
      const name = document.getElementById('form-name').value.trim();
      const number = parseInt(document.getElementById('form-number').value) || 0;
      const grade = document.getElementById('form-grade').value;
      const btn = document.getElementById('submit-btn');
      if (!db) { alert('잠시 후 다시 시도해주세요'); return; }
      if (!myNick) { checkNick(); return; }
      if (!name) { alert('이름을 입력해주세요!'); return; }
      if (selectedPos.length === 0) { alert('포지션을 한 개 이상 선택해주세요!'); return; }
      btn.disabled = true; btn.textContent = '처리 중...';
      try {
        let photoUrl = editingPhotoUrl;
        if (selectedFile) {
          try { photoUrl = await uploadToCloudinary(selectedFile); }
          catch(err) {
            console.error('사진 업로드 실패', err);
            if (!confirm('사진 업로드에 실패했어요.\n사진 없이 저장할까요?')) {
              btn.disabled = false; btn.textContent = editingId ? '✅ 수정 완료' : '➕ 선수 등록'; return;
            }
          }
        }
        if (editingId) {
          const p = allPlayers.find(x => x.id === editingId);
          await window._updateDoc(window._doc(db, 'players', editingId), { name, number, grade, positions: selectedPos, photoUrl, author: p.author || myNick });
          alert('수정되었습니다! ✅');
        } else {
          await window._addDoc(window._collection(db, 'players'), { name, number, grade, positions: selectedPos, photoUrl, author: myNick, createdAt: new Date() });
          alert('선수가 등록되었습니다! ✅');
        }
        closeModal();
        await loadPlayers();
      } catch(e) {
        console.error(e);
        alert('오류가 발생했습니다 😢\n' + e.message);
      } finally {
        btn.disabled = false;
        btn.textContent = editingId ? '✅ 수정 완료' : '➕ 선수 등록';
      }
    };

    updateAdminBtn();
    checkNick();
    initFirebase();
  </script>
</body>
</html>
