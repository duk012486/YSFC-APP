<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>선수 명단 · YSFC</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Apple SD Gothic Neo', '맑은 고딕', sans-serif; background: #f4f4f4; }

    .header {
      background: linear-gradient(135deg, #1a7c3e, #25a85a);
      color: white;
      padding: 16px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .header-left { display: flex; align-items: center; gap: 12px; }
    .back-btn { font-size: 22px; text-decoration: none; color: white; }
    .header h1 { font-size: 18px; font-weight: 700; }
    .add-btn {
      background: rgba(255,255,255,0.2);
      color: white;
      border: none;
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 13px;
      cursor: pointer;
    }

    .content { padding: 14px 14px 80px; }

    .grade-section { margin-bottom: 20px; }
    .grade-title {
      font-size: 15px;
      font-weight: 700;
      color: white;
      background: #1a7c3e;
      padding: 8px 14px;
      border-radius: 10px;
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .grade-count {
      font-size: 11px;
      background: rgba(255,255,255,0.25);
      padding: 2px 8px;
      border-radius: 20px;
    }

    .player-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
    }
    .player-card {
      background: white;
      border-radius: 14px;
      overflow: hidden;
      box-shadow: 0 2px 8px rgba(0,0,0,0.07);
      text-align: center;
    }
    .player-photo {
      width: 100%;
      aspect-ratio: 1;
      background: #e8f5ee;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 36px;
      position: relative;
      overflow: hidden;
    }
    .player-photo img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .player-number {
      position: absolute;
      top: 6px;
      right: 6px;
      background: #1a7c3e;
      color: white;
      font-size: 11px;
      font-weight: 700;
      min-width: 24px;
      height: 24px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0 4px;
    }
    .player-info { padding: 8px 6px 10px; }
    .player-name { font-size: 13px; font-weight: 700; color: #333; margin-bottom: 3px; }
    .player-position {
      font-size: 10px;
      font-weight: 600;
      padding: 2px 8px;
      border-radius: 20px;
      display: inline-block;
    }
    .pos-FW { background: #fff3e0; color: #e67e22; }
    .pos-MF { background: #e8f0fb; color: #3b5bdb; }
    .pos-DF { background: #e8f5ee; color: #1a7c3e; }
    .pos-GK { background: #fce4ec; color: #e91e63; }

    /* 모달 */
    .modal-bg {
      display: none;
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.5);
      z-index: 100;
    }
    .modal-bg.show { display: flex; align-items: flex-end; }
    .modal {
      background: white;
      width: 100%;
      border-radius: 20px 20px 0 0;
      padding: 20px;
      max-height: 85vh;
      overflow-y: auto;
    }
    .modal-title { font-size: 16px; font-weight: 700; margin-bottom: 16px; text-align: center; }
    .form-group { margin-bottom: 14px; }
    .form-label { font-size: 12px; color: #888; margin-bottom: 6px; display: block; }
    .form-select, .form-input {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid #eee;
      border-radius: 8px;
      font-size: 14px;
      font-family: inherit;
    }
    .img-upload-area {
      border: 2px dashed #ddd;
      border-radius: 8px;
      padding: 16px;
      text-align: center;
      cursor: pointer;
      color: #aaa;
      font-size: 13px;
    }
    .img-upload-area:hover { border-color: #1a7c3e; color: #1a7c3e; }
    .img-preview {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      object-fit: cover;
      margin-top: 8px;
      display: none;
    }
    .form-btn {
      width: 100%;
      padding: 14px;
      background: #1a7c3e;
      color: white;
      border: none;
      border-radius: 12px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      margin-top: 8px;
    }
    .form-btn:disabled { background: #aaa; }
    .cancel-btn {
      width: 100%;
      padding: 12px;
      background: #f4f4f4;
      color: #666;
      border: none;
      border-radius: 12px;
      font-size: 14px;
      cursor: pointer;
      margin-top: 8px;
    }

    .loading { text-align: center; padding: 40px; color: #aaa; font-size: 14px; }

    .bottom-nav {
      position: fixed;
      bottom: 0; left: 0; right: 0;
      background: white;
      border-top: 1px solid #eee;
      display: flex;
      justify-content: space-around;
      padding: 10px 0 16px;
    }
    .nav-item { text-align: center; text-decoration: none; color: #aaa; font-size: 10px; }
    .nav-item.active { color: #1a7c3e; }
    .nav-item .nav-icon { font-size: 22px; display: block; margin-bottom: 2px; }
  </style>
</head>
<body>

  <div class="header">
    <div class="header-left">
      <a href="index.html" class="back-btn">←</a>
      <h1>👦 선수 명단</h1>
    </div>
    <button class="add-btn" onclick="openModal()">➕ 선수 추가</button>
  </div>

  <div class="content" id="content">
    <div class="loading">👦 선수 명단을 불러오는 중...</div>
  </div>

  <!-- 선수 추가 모달 -->
  <div class="modal-bg" id="modal-bg">
    <div class="modal">
      <div class="modal-title">➕ 선수 추가</div>
      <div class="form-group">
        <label class="form-label">이름</label>
        <input class="form-input" id="form-name" placeholder="선수 이름" />
      </div>
      <div class="form-group">
        <label class="form-label">등번호</label>
        <input class="form-input" id="form-number" placeholder="예: 23" type="number" />
      </div>
      <div class="form-group">
        <label class="form-label">학년</label>
        <select class="form-select" id="form-grade">
          <option value="1">1학년</option>
          <option value="2">2학년</option>
          <option value="3">3학년</option>
          <option value="4">4학년</option>
          <option value="5">5학년</option>
          <option value="6">6학년</option>
        </select>
      </div>
      <div class="form-group">
        <label class="form-label">포지션</label>
        <select class="form-select" id="form-position">
          <option value="FW">FW (공격수)</option>
          <option value="MF">MF (미드필더)</option>
          <option value="DF">DF (수비수)</option>
          <option value="GK">GK (골키퍼)</option>
        </select>
      </div>
      <div class="form-group">
        <label class="form-label">📷 선수 사진 (선택)</label>
        <div class="img-upload-area" onclick="document.getElementById('img-input').click()">
          📷 사진을 선택하세요
        </div>
        <input type="file" id="img-input" accept="image/*" style="display:none" onchange="previewImg(this)">
        <div style="text-align:center;">
          <img id="img-preview" class="img-preview" />
        </div>
      </div>
      <button class="form-btn" id="submit-btn" onclick="submitPlayer()">👦 선수 등록</button>
      <button class="cancel-btn" onclick="closeModal()">취소</button>
    </div>
  </div>

  <nav class="bottom-nav">
    <a href="index.html" class="nav-item">
      <span class="nav-icon">🏠</span>홈
    </a>
    <a href="notice.html" class="nav-item">
      <span class="nav-icon">📢</span>공지
    </a>
    <a href="schedule.html" class="nav-item">
      <span class="nav-icon">📅</span>일정
    </a>
    <a href="gallery.html" class="nav-item">
      <span class="nav-icon">📸</span>사진
    </a>
    <a href="players.html" class="nav-item active">
      <span class="nav-icon">👦</span>선수
    </a>
  </nav>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.14.0/firebase-app.js";
    import { getFirestore, collection, addDoc, getDocs, orderBy, query } from "https://www.gstatic.com/firebasejs/12.14.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyABY7cdBTXJVbnNVVJmhuo9nXNLerbtVEo",
      authDomain: "ysfc-app-ff413.firebaseapp.com",
      projectId: "ysfc-app-ff413",
      storageBucket: "ysfc-app-ff413.firebasestorage.app",
      messagingSenderId: "791661747168",
      appId: "1:791661747168:web:3540aacb15306331afe985"
    };

    const CLOUD_NAME = "dq4qx2qfg";
    const UPLOAD_PRESET = "YSFC-APP";

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    let selectedFile = null;

    const gradeColors = {
      '1': '🟢', '2': '🔵', '3': '🟡',
      '4': '🟠', '5': '🔴', '6': '⚫'
    };

    window.previewImg = function(input) {
      selectedFile = input.files[0];
      if (selectedFile) {
        const reader = new FileReader();
        reader.onload = e => {
          const preview = document.getElementById('img-preview');
          preview.src = e.target.result;
          preview.style.display = 'block';
        };
        reader.readAsDataURL(selectedFile);
      }
    };

    async function uploadToCloudinary(file) {
      const formData = new FormData();
      formData.append('file', file);
      formData.append('upload_preset', UPLOAD_PRESET);
      const res = await fetch(`https://api.cloudinary.com/v1_1/${CLOUD_NAME}/image/upload`, {
        method: 'POST',
        body: formData
      });
      const data = await res.json();
      return data.secure_url;
    }

    async function loadPlayers() {
      try {
        const q = query(collection(db, 'players'), orderBy('grade'), orderBy('number'));
        const snapshot = await getDocs(q);
        const players = [];
        snapshot.forEach(doc => players.push({ id: doc.id, ...doc.data() }));

        if (players.length === 0) {
          document.getElementById('content').innerHTML =
            '<div class="loading">등록된 선수가 없습니다<br>➕ 선수 추가 버튼으로 추가해주세요!</div>';
          return;
        }

        const byGrade = {};
        players.forEach(p => {
          if (!byGrade[p.grade]) byGrade[p.grade] = [];
          byGrade[p.grade].push(p);
        });

        let html = '';
        [1,2,3,4,5,6].forEach(g => {
          if (!byGrade[g]) return;
          html += `
            <div class="grade-section">
              <div class="grade-title">
                ${gradeColors[g]} ${g}학년
                <span class="grade-count">${byGrade[g].length}명</span>
              </div>
              <div class="player-grid">
                ${byGrade[g].map(p => `
                  <div class="player-card">
                    <div class="player-photo">
                      ${p.photoUrl
                        ? `<img src="${p.photoUrl}" alt="${p.name}">`
                        : '👦'}
                      <div class="player-number">${p.number}</div>
                    </div>
                    <div class="player-info">
                      <div class="player-name">${p.name}</div>
                      <span class="player-position pos-${p.position}">${p.position}</span>
                    </div>
                  </div>
                `).join('')}
              </div>
            </div>
          `;
        });

        document.getElementById('content').innerHTML = html;
      } catch(e) {
        document.getElementById('content').innerHTML =
          '<div class="loading">데이터를 불러올 수 없습니다 😢</div>';
        console.error(e);
      }
    }

    window.openModal = function() {
      document.getElementById('modal-bg').classList.add('show');
    };

    window.closeModal = function() {
      document.getElementById('modal-bg').classList.remove('show');
      selectedFile = null;
      document.getElementById('img-preview').style.display = 'none';
      document.getElementById('img-input').value = '';
      document.getElementById('form-name').value = '';
      document.getElementById('form-number').value = '';
    };

    window.submitPlayer = async function() {
      const name = document.getElementById('form-name').value.trim();
      const number = parseInt(document.getElementById('form-number').value);
      const grade = parseInt(document.getElementById('form-grade').value);
      const position = document.getElementById('form-position').value;
      const btn = document.getElementById('submit-btn');

      if (!name || !number) {
        alert('이름과 등번호를 입력해주세요!');
        return;
      }

      btn.disabled = true;
      btn.textContent = '등록 중...';

      try {
        let photoUrl = '';
        if (selectedFile) {
          photoUrl = await uploadToCloudinary(selectedFile);
        }

        await addDoc(collection(db, 'players'), {
          name, number, grade, position, photoUrl,
          createdAt: new Date()
        });

        alert(`${name} 선수가 등록되었습니다! ✅`);
        closeModal();
        loadPlayers();
      } catch(e) {
        alert('등록 중 오류가 발생했습니다 😢');
        console.error(e);
      } finally {
        btn.disabled = false;
        btn.textContent = '👦 선수 등록';
      }
    };

    loadPlayers();
  </script>

</body>
</html>
