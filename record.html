<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>경기기록 · YSFC</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Apple SD Gothic Neo', '맑은 고딕', sans-serif; background: #f4f4f4; }
    .header { background: linear-gradient(135deg, #1a7c3e, #25a85a); color: white; padding: 16px 20px; display: flex; align-items: center; justify-content: space-between; }
    .header-left { display: flex; align-items: center; gap: 12px; }
    .back-btn { font-size: 22px; text-decoration: none; color: white; }
    .header h1 { font-size: 18px; font-weight: 700; }
    .header-btns { display: flex; gap: 8px; }
    .add-btn, .admin-btn { background: rgba(255,255,255,0.2); color: white; border: none; padding: 6px 12px; border-radius: 20px; font-size: 13px; cursor: pointer; }
    .admin-btn.on { background: #fbbf24; color: #333; font-weight: 700; }
    .tab-bar { background: white; display: flex; border-bottom: 1px solid #eee; }
    .tab { flex: 1; padding: 14px 0; font-size: 14px; font-weight: 600; color: #aaa; border-bottom: 2px solid transparent; cursor: pointer; text-align: center; background: none; border-top: none; border-left: none; border-right: none; }
    .tab.active { color: #1a7c3e; border-bottom: 2px solid #1a7c3e; }
    .stats-card { background: white; margin: 14px; border-radius: 16px; padding: 18px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); }
    .stats-title { font-size: 14px; font-weight: 700; color: #333; margin-bottom: 14px; text-align: center; }
    .stats-row { display: flex; justify-content: space-around; text-align: center; margin-bottom: 14px; }
    .stat-box .num { font-size: 24px; font-weight: 700; }
    .stat-box .label { font-size: 11px; color: #888; margin-top: 2px; }
    .stat-total .num { color: #333; }
    .stat-win .num { color: #1a7c3e; }
    .stat-draw .num { color: #f59e0b; }
    .stat-lose .num { color: #e53e3e; }
    .winrate-bar { height: 10px; background: #eee; border-radius: 10px; overflow: hidden; display: flex; }
    .winrate-fill-win { background: #1a7c3e; height: 100%; }
    .winrate-fill-draw { background: #f59e0b; height: 100%; }
    .winrate-fill-lose { background: #e53e3e; height: 100%; }
    .winrate-text { font-size: 11px; color: #888; text-align: center; margin-top: 8px; }
    .match-list { padding: 0 14px 90px; }
    .match-card { background: white; border-radius: 14px; padding: 16px; margin-bottom: 10px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); }
    .match-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
    .match-type-badge { font-size: 11px; font-weight: 600; padding: 3px 10px; border-radius: 20px; }
    .badge-practice { background: #e8f0fb; color: #3b5bdb; }
    .badge-tour { background: #fff3e0; color: #e67e22; }
    .match-date { font-size: 11px; color: #aaa; }
    .match-teams { display: flex; align-items: center; justify-content: space-around; margin-bottom: 12px; }
    .team-side { text-align: center; flex: 1; }
    .team-side .tname { font-size: 13px; font-weight: 700; color: #333; }
    .team-side .tgrade { font-size: 10px; color: #aaa; margin-top: 2px; }
    .total-score { display: flex; align-items: center; gap: 10px; }
    .total-score .ts { font-size: 30px; font-weight: 700; color: #1a7c3e; }
    .total-score .colon { font-size: 20px; color: #ccc; }
    .result-tag { text-align: center; font-size: 12px; font-weight: 600; padding: 4px 0; border-radius: 8px; margin-bottom: 10px; }
    .result-win { background: #e8f5ee; color: #1a7c3e; }
    .result-draw { background: #fff8e1; color: #f59e0b; }
    .result-lose { background: #fde8e8; color: #e53e3e; }
    .period-detail { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; margin-bottom: 10px; }
    .period-chip { background: #f4f4f4; border-radius: 8px; padding: 5px 10px; font-size: 11px; color: #555; }
    .period-chip b { color: #1a7c3e; }
    .match-foot { display: flex; justify-content: space-between; align-items: center; }
    .match-author { font-size: 11px; color: #bbb; }
    .match-actions { display: flex; gap: 6px; }
    .icon-btn { background: #f4f4f4; border: none; border-radius: 8px; padding: 5px 10px; font-size: 12px; cursor: pointer; color: #666; }
    .icon-btn.del { background: #fde8e8; color: #e53e3e; }
    .modal-bg { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.5); z-index: 100; }
    .modal-bg.show { display: flex; align-items: flex-end; }
    .modal { background: white; width: 100%; border-radius: 20px 20px 0 0; padding: 20px; max-height: 90vh; overflow-y: auto; }
    .modal-center { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.5); z-index: 110; align-items: center; justify-content: center; padding: 20px; }
    .modal-center.show { display: flex; }
    .modal-center .box { background: white; border-radius: 16px; padding: 24px; width: 100%; max-width: 320px; }
    .modal-title { font-size: 16px; font-weight: 700; margin-bottom: 16px; text-align: center; }
    .modal-sub { font-size: 12px; color: #888; text-align: center; margin-bottom: 16px; line-height: 1.5; }
    .form-group { margin-bottom: 14px; }
    .form-label { font-size: 12px; color: #888; margin-bottom: 6px; display: block; }
    .form-input, .form-select { width: 100%; padding: 10px 12px; border: 1px solid #eee; border-radius: 8px; font-size: 14px; font-family: inherit; }
    .form-row { display: flex; gap: 10px; }
    .form-row > div { flex: 1; }
    .seg { display: flex; gap: 8px; }
    .seg-btn { flex: 1; padding: 10px; border-radius: 10px; border: 2px solid #eee; background: white; color: #aaa; font-size: 13px; font-weight: 600; cursor: pointer; }
    .seg-btn.active { border-color: #1a7c3e; color: #1a7c3e; background: #f0fff4; }
    .score-rows { margin-top: 6px; }
    .score-row { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
    .score-row .pname { width: 56px; font-size: 13px; font-weight: 700; color: #1a7c3e; }
    .score-row .vs-mid { color: #ccc; font-weight: 700; }
    .score-input { flex: 1; padding: 10px; border: 1px solid #eee; border-radius: 8px; font-size: 16px; text-align: center; font-family: inherit; }
    .total-preview { background: #f0fff4; border-radius: 10px; padding: 10px; text-align: center; font-size: 14px; font-weight: 700; color: #1a7c3e; margin-top: 6px; }
    .form-btn { width: 100%; padding: 14px; background: #1a7c3e; color: white; border: none; border-radius: 12px; font-size: 15px; font-weight: 700; cursor: pointer; margin-top: 8px; }
    .form-btn:disabled { background: #aaa; }
    .cancel-btn { width: 100%; padding: 12px; background: #f4f4f4; color: #666; border: none; border-radius: 12px; font-size: 14px; cursor: pointer; margin-top: 8px; }
    .loading { text-align: center; padding: 40px; color: #aaa; font-size: 14px; }
    .bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; background: white; border-top: 1px solid #eee; display: flex; justify-content: space-around; padding: 10px 0 16px; }
    .nav-item { text-align: center; text-decoration: none; color: #aaa; font-size: 10px; }
    .nav-item.active { color: #1a7c3e; }
    .nav-item .nav-icon { font-size: 22px; display: block; margin-bottom: 2px; }
  </style>
</head>
<body>
  <div class="header">
    <div class="header-left">
      <a href="index.html" class="back-btn">←</a>
      <h1>🏆 경기 기록</h1>
    </div>
    <div class="header-btns">
      <button class="admin-btn" id="admin-btn" onclick="toggleAdmin()">🔑</button>
      <button class="add-btn" onclick="openModal()">➕ 경기</button>
    </div>
  </div>

  <div class="tab-bar">
    <button class="tab active" onclick="switchTab('practice', this)">⚽ 연습경기</button>
    <button class="tab" onclick="switchTab('tour', this)">🏆 대회 전적</button>
  </div>

  <div class="stats-card">
    <div class="stats-title" id="stats-title">⚽ 연습경기 전적</div>
    <div class="stats-row">
      <div class="stat-box stat-total"><div class="num" id="s-total">0</div><div class="label">경기</div></div>
      <div class="stat-box stat-win"><div class="num" id="s-win">0</div><div class="label">승</div></div>
      <div class="stat-box stat-draw"><div class="num" id="s-draw">0</div><div class="label">무</div></div>
      <div class="stat-box stat-lose"><div class="num" id="s-lose">0</div><div class="label">패</div></div>
    </div>
    <div class="winrate-bar" id="winrate-bar"></div>
    <div class="winrate-text" id="winrate-text">아직 기록이 없습니다</div>
  </div>

  <div class="match-list" id="match-list"><div class="loading">경기 기록을 불러오는 중...</div></div>

  <div class="modal-bg" id="modal-bg">
    <div class="modal">
      <div class="modal-title" id="modal-title">➕ 경기 추가</div>
      <div class="form-group">
        <label class="form-label">경기 유형</label>
        <div class="seg" id="seg-type">
          <button class="seg-btn active" data-type="practice" onclick="selectMatchType('practice')">⚽ 연습경기</button>
          <button class="seg-btn" data-type="tour" onclick="selectMatchType('tour')">🏆 대회경기</button>
        </div>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label class="form-label">상대팀</label>
          <input class="form-input" id="form-opponent" placeholder="예: 수원FC" />
        </div>
        <div class="form-group">
          <label class="form-label">상대 학년</label>
          <select class="form-select" id="form-opp-grade">
            <option value="1학년">1학년</option>
            <option value="2학년">2학년</option>
            <option value="3학년">3학년</option>
            <option value="4학년">4학년</option>
            <option value="5학년">5학년</option>
            <option value="6학년">6학년</option>
            <option value="혼합">혼합</option>
          </select>
        </div>
      </div>
      <div class="form-group">
        <label class="form-label">경기 날짜</label>
        <input class="form-input" id="form-date" type="date" />
      </div>
      <div class="form-group" id="tour-format-group" style="display:none;">
        <label class="form-label">경기 형식</label>
        <div class="seg" id="seg-format">
          <button class="seg-btn active" data-fmt="half" onclick="selectFormat('half')">전·후반</button>
          <button class="seg-btn" data-fmt="single" onclick="selectFormat('single')">단판</button>
        </div>
      </div>
      <div class="form-group">
        <label class="form-label" id="score-label">쿼터별 점수 (와에스 : 상대)</label>
        <div class="score-rows" id="score-rows"></div>
        <div class="total-preview" id="total-preview">합계 0 : 0</div>
      </div>
      <button class="form-btn" id="submit-btn" onclick="submitMatch()">🏆 경기 등록</button>
      <button class="cancel-btn" onclick="closeModal()">취소</button>
    </div>
  </div>

  <div class="modal-center" id="nick-modal">
    <div class="box">
      <div class="modal-title">👋 환영합니다!</div>
      <div class="modal-sub">앱에서 사용할 이름을 입력해주세요.<br>(글 작성 시 표시됩니다)<br><br>예) (3학년) 이유찬 엄마<br>김영신 감독 / 이유찬 선수</div>
      <input class="form-input" id="nick-input" placeholder="이름을 입력하세요" />
      <button class="form-btn" onclick="saveNick()">✅ 시작하기</button>
    </div>
  </div>

  <div class="modal-center" id="admin-modal">
    <div class="box">
      <div class="modal-title">🔑 관리자 모드</div>
      <div class="modal-sub">관리자 비밀번호를 입력하면<br>모든 경기를 수정·삭제할 수 있습니다.</div>
      <input class="form-input" id="admin-input" type="password" placeholder="비밀번호" />
      <button class="form-btn" onclick="checkAdmin()">확인</button>
      <button class="cancel-btn" onclick="closeAdminModal()">취소</button>
    </div>
  </div>

  <nav class="bottom-nav">
    <a href="index.html" class="nav-item"><span class="nav-icon">🏠</span>홈</a>
    <a href="notice.html" class="nav-item"><span class="nav-icon">📢</span>공지</a>
    <a href="schedule.html" class="nav-item"><span class="nav-icon">📅</span>일정</a>
    <a href="gallery.html" class="nav-item"><span class="nav-icon">📸</span>사진</a>
    <a href="players.html" class="nav-item"><span class="nav-icon">👦</span>선수</a>
  </nav>

  <script>
    const ADMIN_PW = "ysfc486";
    let allMatches = [];
    let currentTab = 'practice';
    let matchType = 'practice';
    let tourFormat = 'half';
    let editingId = null;
    let myNick = localStorage.getItem('ysfc_nick') || '';
    let isAdmin = sessionStorage.getItem('ysfc_admin') === '1';
    let db = null;

    async function initFirebase() {
      try {
        const { initializeApp } = await import("https://www.gstatic.com/firebasejs/12.14.0/firebase-app.js");
        const { getFirestore, collection, addDoc, getDocs, doc, updateDoc, deleteDoc } = await import("https://www.gstatic.com/firebasejs/12.14.0/firebase-firestore.js");
        const firebaseConfig = {
          apiKey: "AIzaSyABY7cdBTXJVbnNVVJmhuo9nXNLerbtVEo",
          authDomain: "ysfc-app-ff413.firebaseapp.com",
          projectId: "ysfc-app-ff413",
          storageBucket: "ysfc-app-ff413.firebasestorage.app",
          messagingSenderId: "791661747168",
          appId: "1:791661747168:web:3540aacb15306331afe985"
        };
        const app = initializeApp(firebaseConfig);
        db = getFirestore(app);
        window._addDoc = addDoc; window._collection = collection; window._getDocs = getDocs;
        window._doc = doc; window._updateDoc = updateDoc; window._deleteDoc = deleteDoc;
        await loadMatches();
      } catch(e) {
        console.error('Firebase 오류:', e);
        document.getElementById('match-list').innerHTML = '<div class="loading">연결 오류가 발생했습니다 😢</div>';
      }
    }

    function checkNick() { if (!myNick) document.getElementById('nick-modal').classList.add('show'); }
    window.saveNick = function() {
      const v = document.getElementById('nick-input').value.trim();
      if (!v) { alert('이름을 입력해주세요!'); return; }
      myNick = v; localStorage.setItem('ysfc_nick', v);
      document.getElementById('nick-modal').classList.remove('show');
    };

    window.toggleAdmin = function() {
      if (isAdmin) {
        if (confirm('관리자 모드를 끌까요?')) {
          isAdmin = false; sessionStorage.removeItem('ysfc_admin');
          updateAdminBtn(); render();
        }
      } else { document.getElementById('admin-modal').classList.add('show'); }
    };
    window.checkAdmin = function() {
      const v = document.getElementById('admin-input').value;
      if (v === ADMIN_PW) {
        isAdmin = true; sessionStorage.setItem('ysfc_admin', '1');
        document.getElementById('admin-modal').classList.remove('show');
        document.getElementById('admin-input').value = '';
        updateAdminBtn(); render();
        alert('관리자 모드 ON ✅');
      } else { alert('비밀번호가 틀렸습니다 😢'); }
    };
    window.closeAdminModal = function() {
      document.getElementById('admin-modal').classList.remove('show');
      document.getElementById('admin-input').value = '';
    };
    function updateAdminBtn() {
      const btn = document.getElementById('admin-btn');
      if (isAdmin) { btn.classList.add('on'); btn.textContent = '🔑 ON'; }
      else { btn.classList.remove('on'); btn.textContent = '🔑'; }
    }

    function canEdit(m) { return isAdmin || (m.author && m.author === myNick); }

    function getTime(ts) {
      if (!ts) return 0;
      if (ts.toDate) return ts.toDate().getTime();
      return new Date(ts).getTime();
    }

    async function loadMatches() {
      try {
        const snapshot = await window._getDocs(window._collection(db, 'matches'));
        allMatches = [];
        snapshot.forEach(d => allMatches.push({ id: d.id, ...d.data() }));
        allMatches.sort((a, b) => {
          const da = a.matchDate || '', db_ = b.matchDate || '';
          if (da !== db_) return da < db_ ? 1 : -1;
          return getTime(b.createdAt) - getTime(a.createdAt);
        });
        render();
      } catch(e) {
        console.error(e);
        document.getElementById('match-list').innerHTML = '<div class="loading">데이터를 불러올 수 없습니다 😢</div>';
      }
    }

    function getPeriods() {
      if (matchType === 'practice') return ['1Q','2Q','3Q','4Q'];
      return tourFormat === 'half' ? ['전반','후반'] : ['단판'];
    }

    function renderScoreRows(existing) {
      const periods = getPeriods();
      const rows = document.getElementById('score-rows');
      rows.innerHTML = periods.map((p, i) => {
        const us = existing && existing.scores && existing.scores[i] ? existing.scores[i].us : '';
        const them = existing && existing.scores && existing.scores[i] ? existing.scores[i].them : '';
        return '<div class="score-row">' +
            '<span class="pname">' + p + '</span>' +
            '<input class="score-input" type="number" min="0" id="us-' + i + '" value="' + us + '" placeholder="0" oninput="updateTotal()">' +
            '<span class="vs-mid">:</span>' +
            '<input class="score-input" type="number" min="0" id="them-' + i + '" value="' + them + '" placeholder="0" oninput="updateTotal()">' +
          '</div>';
      }).join('');
      document.getElementById('score-label').textContent = matchType === 'practice' ? '쿼터별 점수 (와에스 : 상대)' : '점수 (와에스 : 상대)';
      updateTotal();
    }

    window.updateTotal = function() {
      const periods = getPeriods();
      let tu = 0, tt = 0;
      for (let i = 0; i < periods.length; i++) {
        tu += parseInt(document.getElementById('us-'+i).value) || 0;
        tt += parseInt(document.getElementById('them-'+i).value) || 0;
      }
      document.getElementById('total-preview').textContent = '합계 ' + tu + ' : ' + tt;
    };

    function calcResult(m) {
      let us = 0, them = 0;
      (m.scores || []).forEach(s => { us += s.us||0; them += s.them||0; });
      return { us, them, result: us > them ? 'win' : us === them ? 'draw' : 'lose' };
    }

    function render() {
      const list = allMatches.filter(m => (m.type||'practice') === currentTab);
      let win=0, draw=0, lose=0;
      list.forEach(m => { const r = calcResult(m).result; if(r==='win')win++; else if(r==='draw')draw++; else lose++; });
      const total = list.length;
      document.getElementById('stats-title').textContent = currentTab === 'practice' ? '⚽ 연습경기 전적' : '🏆 대회 전적';
      document.getElementById('s-total').textContent = total;
      document.getElementById('s-win').textContent = win;
      document.getElementById('s-draw').textContent = draw;
      document.getElementById('s-lose').textContent = lose;
      if (total > 0) {
        const wp = (win/total*100), dp = (draw/total*100), lp = (lose/total*100);
        document.getElementById('winrate-bar').innerHTML =
          '<div class="winrate-fill-win" style="width:' + wp + '%"></div>' +
          '<div class="winrate-fill-draw" style="width:' + dp + '%"></div>' +
          '<div class="winrate-fill-lose" style="width:' + lp + '%"></div>';
        document.getElementById('winrate-text').textContent = '승률 ' + Math.round(win/total*100) + '%';
      } else {
        document.getElementById('winrate-bar').innerHTML = '';
        document.getElementById('winrate-text').textContent = '아직 기록이 없습니다';
      }

      if (list.length === 0) {
        document.getElementById('match-list').innerHTML = '<div class="loading">등록된 경기가 없습니다<br>➕ 경기 버튼으로 추가해주세요!</div>';
        return;
      }
      const resultText = { win: '승리 🏆', draw: '무승부 🤝', lose: '패배 💪' };
      document.getElementById('match-list').innerHTML = list.map(m => {
        const r = calcResult(m);
        const periods = m.periods || [];
        const periodHtml = (m.scores||[]).map((s, i) => '<div class="period-chip">' + (periods[i]||'') + ' <b>' + s.us + '</b>:' + s.them + '</div>').join('');
        const dateStr = m.matchDate ? m.matchDate.replace(/-/g, '.') : '';
        const actions = canEdit(m)
          ? '<div class="match-actions">' +
              '<button class="icon-btn" onclick="editMatch(\'' + m.id + '\')">✏️ 수정</button>' +
              '<button class="icon-btn del" onclick="deleteMatch(\'' + m.id + '\')">🗑️ 삭제</button>' +
            '</div>'
          : '';
        return '<div class="match-card">' +
            '<div class="match-head">' +
              '<span class="match-type-badge ' + (m.type==='tour'?'badge-tour':'badge-practice') + '">' + (m.type==='tour'?'🏆 대회':'⚽ 연습') + '</span>' +
              '<span class="match-date">' + dateStr + '</span>' +
            '</div>' +
            '<div class="match-teams">' +
              '<div class="team-side"><div class="tname">와에스FC</div><div class="tgrade">U-12</div></div>' +
              '<div class="total-score"><span class="ts">' + r.us + '</span><span class="colon">:</span><span class="ts" style="color:#888">' + r.them + '</span></div>' +
              '<div class="team-side"><div class="tname">' + (m.opponent||'상대팀') + '</div><div class="tgrade">' + (m.oppGrade||'') + '</div></div>' +
            '</div>' +
            '<div class="result-tag result-' + r.result + '">' + resultText[r.result] + '</div>' +
            (periodHtml ? '<div class="period-detail">' + periodHtml + '</div>' : '') +
            '<div class="match-foot"><span class="match-author">' + (m.author || '') + '</span>' + actions + '</div>' +
          '</div>';
      }).join('');
    }

    window.switchTab = function(tab, el) {
      currentTab = tab;
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
      el.classList.add('active');
      render();
    };

    window.selectMatchType = function(type) {
      matchType = type;
      document.querySelectorAll('#seg-type .seg-btn').forEach(b => b.classList.toggle('active', b.dataset.type === type));
      document.getElementById('tour-format-group').style.display = type === 'tour' ? 'block' : 'none';
      renderScoreRows();
    };

    window.selectFormat = function(fmt) {
      tourFormat = fmt;
      document.querySelectorAll('#seg-format .seg-btn').forEach(b => b.classList.toggle('active', b.dataset.fmt === fmt));
      renderScoreRows();
    };

    window.openModal = function() {
      if (!myNick) { checkNick(); return; }
      editingId = null;
      matchType = 'practice'; tourFormat = 'half';
      document.getElementById('modal-title').textContent = '➕ 경기 추가';
      document.getElementById('submit-btn').textContent = '🏆 경기 등록';
      document.querySelectorAll('#seg-type .seg-btn').forEach(b => b.classList.toggle('active', b.dataset.type === 'practice'));
      document.querySelectorAll('#seg-format .seg-btn').forEach(b => b.classList.toggle('active', b.dataset.fmt === 'half'));
      document.getElementById('tour-format-group').style.display = 'none';
      document.getElementById('form-opponent').value = '';
      document.getElementById('form-opp-grade').value = '6학년';
      document.getElementById('form-date').value = new Date().toISOString().split('T')[0];
      renderScoreRows();
      document.getElementById('modal-bg').classList.add('show');
    };

    window.editMatch = function(id) {
      const m = allMatches.find(x => x.id === id);
      if (!m) return;
      if (!canEdit(m)) { alert('본인이 등록한 경기만 수정할 수 있습니다.'); return; }
      editingId = id;
      matchType = m.type || 'practice';
      tourFormat = m.format || 'half';
      document.getElementById('modal-title').textContent = '✏️ 경기 수정';
      document.getElementById('submit-btn').textContent = '✅ 수정 완료';
      document.querySelectorAll('#seg-type .seg-btn').forEach(b => b.classList.toggle('active', b.dataset.type === matchType));
      document.querySelectorAll('#seg-format .seg-btn').forEach(b => b.classList.toggle('active', b.dataset.fmt === tourFormat));
      document.getElementById('tour-format-group').style.display = matchType === 'tour' ? 'block' : 'none';
      document.getElementById('form-opponent').value = m.opponent || '';
      document.getElementById('form-opp-grade').value = m.oppGrade || '6학년';
      document.getElementById('form-date').value = m.matchDate || '';
      renderScoreRows(m);
      document.getElementById('modal-bg').classList.add('show');
    };

    window.deleteMatch = async function(id) {
      const m = allMatches.find(x => x.id === id);
      if (!canEdit(m)) { alert('본인이 등록한 경기만 삭제할 수 있습니다.'); return; }
      if (!confirm('이 경기를 삭제할까요?')) return;
      try {
        await window._deleteDoc(window._doc(db, 'matches', id));
        alert('삭제되었습니다 ✅');
        await loadMatches();
      } catch(e) { console.error(e); alert('삭제 중 오류가 발생했습니다 😢'); }
    };

    window.closeModal = function() {
      document.getElementById('modal-bg').classList.remove('show');
      editingId = null;
    };

    window.submitMatch = async function() {
      const btn = document.getElementById('submit-btn');
      if (!db) { alert('잠시 후 다시 시도해주세요'); return; }
      if (!myNick) { checkNick(); return; }
      const opponent = document.getElementById('form-opponent').value.trim();
      const oppGrade = document.getElementById('form-opp-grade').value;
      const matchDate = document.getElementById('form-date').value;
      if (!opponent) { alert('상대팀을 입력해주세요!'); return; }
      if (!matchDate) { alert('경기 날짜를 선택해주세요!'); return; }
      const periods = getPeriods();
      const scores = [];
      for (let i = 0; i < periods.length; i++) {
        scores.push({ us: parseInt(document.getElementById('us-'+i).value) || 0, them: parseInt(document.getElementById('them-'+i).value) || 0 });
      }
      btn.disabled = true; btn.textContent = '처리 중...';
      try {
        const data = { type: matchType, format: matchType === 'tour' ? tourFormat : null, opponent, oppGrade, matchDate, periods, scores };
        if (editingId) {
          const m = allMatches.find(x => x.id === editingId);
          data.author = m.author || myNick;
          await window._updateDoc(window._doc(db, 'matches', editingId), data);
          alert('수정되었습니다! ✅');
        } else {
          data.author = myNick;
          data.createdAt = new Date();
          await window._addDoc(window._collection(db, 'matches'), data);
          alert('경기가 등록되었습니다! ✅');
        }
        closeModal();
        await loadMatches();
      } catch(e) {
        console.error(e);
        alert('오류가 발생했습니다 😢\n' + e.message);
      } finally {
        btn.disabled = false;
        btn.textContent = editingId ? '✅ 수정 완료' : '🏆 경기 등록';
      }
    };

    updateAdminBtn();
    checkNick();
    initFirebase();
  </script>
</body>
</html>
