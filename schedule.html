<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>일정 · YSFC</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Apple SD Gothic Neo', '맑은 고딕', sans-serif; background: #f0f4f8; }

    .header {
      background: linear-gradient(135deg, #1a7c3e, #25a85a);
      color: white;
      padding: 16px 20px;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .back-btn { font-size: 22px; text-decoration: none; color: white; }
    .header h1 { font-size: 18px; font-weight: 700; }

    .month-header {
      background: #1a7c3e;
      color: white;
      text-align: center;
      padding: 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .month-nav {
      background: rgba(255,255,255,0.2);
      border: none;
      color: white;
      font-size: 20px;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      cursor: pointer;
    }
    .month-title { font-size: 18px; font-weight: 700; }
    .month-sub { font-size: 12px; opacity: 0.8; margin-top: 2px; }

    .calendar-wrap {
      background: white;
      margin: 12px;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 2px 12px rgba(0,0,0,0.08);
    }

    .day-headers {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      background: #1a7c3e;
    }
    .day-header {
      text-align: center;
      padding: 8px 0;
      font-size: 12px;
      font-weight: 700;
      color: rgba(255,255,255,0.9);
    }
    .day-header.sun { color: #ffb3b3; }
    .day-header.sat { color: #b3d4ff; }

    .cal-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      border-left: 0.5px solid #eee;
      border-top: 0.5px solid #eee;
    }
    .cal-cell {
      border-right: 0.5px solid #eee;
      border-bottom: 0.5px solid #eee;
      min-height: 64px;
      padding: 4px 3px;
    }
    .cal-cell.empty { background: #fafafa; }
    .cal-cell.today { background: #f0fff4; }

    .cell-date {
      font-size: 12px;
      font-weight: 700;
      margin-bottom: 3px;
      color: #333;
    }
    .cell-date.sun { color: #ef4444; }
    .cell-date.sat { color: #3b5bdb; }
    .cell-date.today-num {
      background: #1a7c3e;
      color: white;
      width: 20px;
      height: 20px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 11px;
    }

    .cell-tag {
      font-size: 9px;
      font-weight: 600;
      padding: 2px 4px;
      border-radius: 4px;
      display: block;
      text-align: center;
      margin-top: 2px;
      line-height: 1.3;
      word-break: keep-all;
    }
    .tag-normal { background: #e8f5ee; color: #1a7c3e; }
    .tag-off { background: #fce4ec; color: #e91e63; }
    .tag-match { background: #fff3e0; color: #e67e22; }
    .tag-tour { background: #e8f0fb; color: #3b5bdb; }

    .legend {
      display: flex;
      gap: 10px;
      padding: 10px 14px;
      flex-wrap: wrap;
    }
    .legend-item {
      display: flex;
      align-items: center;
      gap: 4px;
      font-size: 11px;
      color: #666;
    }
    .legend-dot {
      width: 10px;
      height: 10px;
      border-radius: 3px;
    }

    .schedule-list { padding: 0 12px 80px; }
    .list-title {
      font-size: 14px;
      font-weight: 700;
      color: #333;
      margin-bottom: 10px;
      padding-left: 4px;
    }
    .schedule-item {
      background: white;
      border-radius: 12px;
      padding: 12px 16px;
      margin-bottom: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .item-date { text-align: center; min-width: 36px; }
    .item-date .d { font-size: 20px; font-weight: 700; color: #1a7c3e; }
    .item-date .w { font-size: 10px; color: #aaa; }
    .item-divider { width: 1px; height: 36px; background: #eee; }
    .item-info { flex: 1; }
    .item-name { font-size: 13px; font-weight: 600; color: #333; }
    .item-detail { font-size: 11px; color: #888; margin-top: 2px; }

    .notice-bar {
      background: #fff8e1;
      border-radius: 10px;
      padding: 10px 14px;
      margin: 0 12px 12px;
      font-size: 12px;
      color: #856404;
      text-align: center;
    }

    .bottom-nav {
      position: fixed;
      bottom: 0; left: 0; right: 0;
      background: white;
      border-top: 1px solid #eee;
      display: flex;
      justify-content: space-around;
      padding: 10px 0 16px;
    }
    .nav-item { text-align: center; text-decoration: none; color: #aaa; font-size: 10px; }
    .nav-item.active { color: #1a7c3e; }
    .nav-item .nav-icon { font-size: 22px; display: block; margin-bottom: 2px; }
  </style>
</head>
<body>

  <div class="header">
    <a href="index.html" class="back-btn">←</a>
    <h1>📅 월간 일정표</h1>
  </div>

  <div class="month-header">
    <button class="month-nav" onclick="changeMonth(-1)">‹</button>
    <div>
      <div class="month-title" id="month-title"></div>
      <div class="month-sub">YSFC 와에스FC · U-12 선수반</div>
    </div>
    <button class="month-nav" onclick="changeMonth(1)">›</button>
  </div>

  <div class="calendar-wrap">
    <div class="day-headers">
      <div class="day-header sun">SUN</div>
      <div class="day-header">MON</div>
      <div class="day-header">TUE</div>
      <div class="day-header">WED</div>
      <div class="day-header">THU</div>
      <div class="day-header">FRI</div>
      <div class="day-header sat">SAT</div>
    </div>
    <div class="cal-grid" id="cal-grid"></div>
  </div>

  <div class="legend">
    <div class="legend-item">
      <div class="legend-dot" style="background:#e8f5ee; border:1px solid #1a7c3e;"></div>정상수업
    </div>
    <div class="legend-item">
      <div class="legend-dot" style="background:#fce4ec; border:1px solid #e91e63;"></div>휴무
    </div>
    <div class="legend-item">
      <div class="legend-dot" style="background:#fff3e0; border:1px solid #e67e22;"></div>경기
    </div>
    <div class="legend-item">
      <div class="legend-dot" style="background:#e8f0fb; border:1px solid #3b5bdb;"></div>대회
    </div>
  </div>

  <div class="notice-bar">※ 6월일정 연습경기·대회일정으로 변경될수있는점 양해부탁드립니다 ※</div>

  <div class="schedule-list">
    <div class="list-title" id="list-title">📋 6월 주요 일정</div>
    <div id="schedule-items"></div>
  </div>

  <nav class="bottom-nav">
    <a href="index.html" class="nav-item">
      <span class="nav-icon">🏠</span>홈
    </a>
    <a href="notice.html" class="nav-item">
      <span class="nav-icon">📢</span>공지
    </a>
    <a href="schedule.html" class="nav-item active">
      <span class="nav-icon">📅</span>일정
    </a>
    <a href="gallery.html" class="nav-item">
      <span class="nav-icon">📸</span>사진
    </a>
    <a href="players.html" class="nav-item">
      <span class="nav-icon">👦</span>선수
    </a>
  </nav>

  <script>
    const allSchedules = {
      '2026-6': {
        days: {
          1:'normal',2:'normal',3:'normal',4:'normal',5:'normal',
          8:'normal',9:'normal',10:'normal',11:'normal',
          12:'tour',13:'tour',14:'tour',
          15:'normal',16:'normal',17:'normal',18:'normal',19:'normal',
          22:'normal',23:'normal',24:'normal',25:'normal',26:'normal',
          29:'off',30:'off'
        },
        labels: {
          12:'서천대회\n출발',13:'KY서천\n대회U-11',14:'KY서천\n대회U-11',
          29:'센터휴무',30:'센터휴무'
        },
        list: [
          { d:12, w:'금', name:'🏆 서천대회 출발', detail:'KY서천 U-11 대회' },
          { d:13, w:'토', name:'🏆 KY서천대회 U-11', detail:'대회 참가' },
          { d:14, w:'일', name:'🏆 KY서천대회 U-11', detail:'대회 참가' },
          { d:29, w:'월', name:'🔴 센터 휴무', detail:'센터 휴무일' },
          { d:30, w:'화', name:'🔴 센터 휴무', detail:'센터 휴무일' },
        ]
      }
    };

    const tagLabel = {
      normal: { cls:'tag-normal', text:'정상수업' },
      off:    { cls:'tag-off',    text:'휴무' },
      match:  { cls:'tag-match',  text:'경기' },
      tour:   { cls:'tag-tour',   text:'대회' }
    };

    let current = new Date();

    function renderCalendar() {
      const year = current.getFullYear();
      const month = current.getMonth();
      const today = new Date();
      const key = `${year}-${month+1}`;
      const data = allSchedules[key] || { days:{}, labels:{}, list:[] };

      document.getElementById('month-title').textContent = `${year}년 ${month+1}월`;
      document.getElementById('list-title').textContent = `📋 ${month+1}월 주요 일정`;

      const firstDay = new Date(year, month, 1).getDay();
      const lastDate = new Date(year, month+1, 0).getDate();

      let html = '';
      for (let i = 0; i < firstDay; i++) {
        html += `<div class="cal-cell empty"></div>`;
      }
      for (let d = 1; d <= lastDate; d++) {
        const dow = (firstDay + d - 1) % 7;
        const isToday = d===today.getDate() && month===today.getMonth() && year===today.getFullYear();
        const event = data.days[d];
        const label = data.labels[d] || '';

        let dateClass = 'cell-date';
        if (dow===0) dateClass += ' sun';
        if (dow===6) dateClass += ' sat';

        let dateNum = isToday
          ? `<div class="${dateClass} today-num">${d}</div>`
          : `<div class="${dateClass}">${d}</div>`;

        let tagHtml = '';
        if (event && tagLabel[event]) {
          const txt = label || tagLabel[event].text;
          tagHtml = `<span class="cell-tag ${tagLabel[event].cls}">${txt.replace(/\n/g,'<br>')}</span>`;
        }

        html += `<div class="cal-cell${isToday?' today':''}">${dateNum}${tagHtml}</div>`;
      }
      document.getElementById('cal-grid').innerHTML = html;

      // 하단 일정 리스트
      const items = data.list || [];
      if (items.length === 0) {
        document.getElementById('schedule-items').innerHTML =
          `<div style="text-align:center; color:#aaa; padding:20px; font-size:13px;">이달 주요 일정이 없습니다</div>`;
      } else {
        document.getElementById('schedule-items').innerHTML = items.map(item => `
          <div class="schedule-item">
            <div class="item-date"><div class="d">${item.d}</div><div class="w">${item.w}</div></div>
            <div class="item-divider"></div>
            <div class="item-info">
              <div class="item-name">${item.name}</div>
              <div class="item-detail">${item.detail}</div>
            </div>
          </div>
        `).join('');
      }
    }

    function changeMonth(dir) {
      current.setMonth(current.getMonth() + dir);
      renderCalendar();
    }

    renderCalendar();
  </script>

</body>
</html>
