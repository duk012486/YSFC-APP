<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>일정 · YSFC</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Apple SD Gothic Neo', '맑은 고딕', sans-serif; background: #f0f4f8; }

    .header { background: linear-gradient(135deg, #1a7c3e, #25a85a); color: white; padding: 16px 20px; display: flex; align-items: center; justify-content: space-between; }
    .header-left { display: flex; align-items: center; gap: 12px; }
    .back-btn { font-size: 22px; text-decoration: none; color: white; }
    .header h1 { font-size: 18px; font-weight: 700; }
    .add-btn { background: rgba(255,255,255,0.2); color: white; border: none; padding: 6px 12px; border-radius: 20px; font-size: 13px; cursor: pointer; }

    .month-header { background: #1a7c3e; color: white; padding: 14px; display: flex; justify-content: space-between; align-items: center; text-align: center; }
    .month-nav { background: rgba(255,255,255,0.2); border: none; color: white; font-size: 20px; width: 36px; height: 36px; border-radius: 50%; cursor: pointer; }
    .month-info { text-align: center; }
    .month-title { font-size: 18px; font-weight: 700; }
    .month-sub { font-size: 12px; opacity: 0.8; margin-top: 2px; }

    .calendar-wrap { background: white; margin: 12px; border-radius: 16px; overflow: hidden; box-shadow: 0 2px 12px rgba(0,0,0,0.08); }
    .day-headers { display: grid; grid-template-columns: repeat(7, 1fr); background: #1a7c3e; }
    .day-header { text-align: center; padding: 8px 0; font-size: 12px; font-weight: 700; color: rgba(255,255,255,0.9); }
    .day-header.sun { color: #ffb3b3; }
    .day-header.sat { color: #b3d4ff; }

    .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); border-left: 0.5px solid #eee; border-top: 0.5px solid #eee; }
    .cal-cell { border-right: 0.5px solid #eee; border-bottom: 0.5px solid #eee; min-height: 64px; padding: 4px 3px; cursor: pointer; }
    .cal-cell.empty { background: #fafafa; cursor: default; }
    .cal-cell.today { background: #f0fff4; }
    .cal-cell.selecting { background: #e8f5ee; outline: 2px solid #1a7c3e; }

    .cell-date { font-size: 12px; font-weight: 700; margin-bottom: 3px; color: #333; }
    .cell-date.sun { color: #ef4444; }
    .cell-date.sat { color: #3b5bdb; }
    .cell-date.today-num { background: #1a7c3e; color: white; width: 20px; height: 20px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 11px; }

    .cell-tag { font-size: 9px; font-weight: 600; padding: 2px 4px; border-radius: 4px; display: block; text-align: center; margin-top: 2px; line-height: 1.3; word-break: keep-all; }
    .tag-normal { background: #e8f5ee; color: #1a7c3e; }
    .tag-off { background: #fce4ec; color: #e91e63; }
    .tag-tour { background: #e8f0fb; color: #3b5bdb; }
    .tag-tour-start { background: #dbeafe; color: #1d4ed8; }
    .tag-tour-end { background: #dbeafe; color: #1d4ed8; }

    .legend { display: flex; gap: 10px; padding: 10px 14px; flex-wrap: wrap; }
    .legend-item { display: flex; align-items: center; gap: 4px; font-size: 11px; color: #666; }
    .legend-dot { width: 10px; height: 10px; border-radius: 3px; }

    .notice-bar { background: #fff8e1; border-radius: 10px; padding: 10px 14px; margin: 0 12px 12px; font-size: 12px; color: #856404; text-align: center; display: none; }
    .notice-bar.show { display: block; }

    .schedule-list { padding: 0 12px 80px; }
    .list-title { font-size: 14px; font-weight: 700; color: #333; margin-bottom: 10px; padding-left: 4px; }
    .schedule-item { background: white; border-radius: 12px; padding: 12px 16px; margin-bottom: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); display: flex; align-items: center; gap: 12px; }
    .item-date { text-align: center; min-width: 36px; }
    .item-date .d { font-size: 20px; font-weight: 700; color: #1a7c3e; }
    .item-date .w { font-size: 10px; color: #aaa; }
    .item-divider { width: 1px; height: 36px; background: #eee; }
    .item-info { flex: 1; }
    .item-name { font-size: 13px; font-weight: 600; color: #333; }
    .item-detail { font-size: 11px; color: #888; margin-top: 2px; }
    .loading { text-align: center; padding: 30px; color: #aaa; font-size: 13px; }

    .modal-bg { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.5); z-index: 100; }
    .modal-bg.show { display: flex; align-items: flex-end; }
    .modal { background: white; width: 100%; border-radius: 20px 20px 0 0; padding: 20px; max-height: 85vh; overflow-y: auto; }
    .modal-title { font-size: 16px; font-weight: 700; margin-bottom: 4px; text-align: center; }
    .modal-sub { font-size: 12px; color: #aaa; text-align: center; margin-bottom: 16px; }

    .selected-dates { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 14px; min-height: 40px; background: #f8f8f8; border-radius: 8px; padding: 8px; align-items: center; }
    .date-chip { background: #1a7c3e; color: white; font-size: 12px; padding: 4px 10px; border-radius: 20px; }

    .type-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 14px; }
    .type-card { padding: 12px 8px; border-radius: 12px; text-align: center; border: 2px solid #eee; cursor: pointer; font-size: 12px; font-weight: 600; color: #aaa; background: white; }
    .type-card.selected { border-color: #1a7c3e; color: #1a7c3e; background: #f0fff4; }
    .type-card .type-icon { font-size: 20px; display: block; margin-bottom: 4px; }

    .tour-section { display: none; margin-bottom: 14px; }
    .tour-section.show { display: block; }
    .form-group { margin-bottom: 14px; }
    .form-label { font-size: 12px; color: #888; margin-bottom: 6px; display: block; }
    .form-input { width: 100%; padding: 10px 12px; border: 1px solid #eee; border-radius: 8px; font-size: 14px; font-family: inherit; }
    .date-row { display: flex; gap: 10px; }
    .date-row .form-input { flex: 1; }

    .form-btn { width: 100%; padding: 14px; background: #1a7c3e; color: white; border: none; border-radius: 12px; font-size: 15px; font-weight: 700; cursor: pointer; margin-top: 8px; }
    .form-btn:disabled { background: #aaa; }
    .cancel-btn { width: 100%; padding: 12px; background: #f4f4f4; color: #666; border: none; border-radius: 12px; font-size: 14px; cursor: pointer; margin-top: 8px; }

    .bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; background: white; border-top: 1px solid #eee; display: flex; justify-content: space-around; padding: 10px 0 16px; }
    .nav-item { text-align: center; text-decoration: none; color: #aaa; font-size: 10px; }
    .nav-item.active { color: #1a7c3e; }
    .nav-item .nav-icon { font-size: 22px; display: block; margin-bottom: 2px; }
  </style>
</head>
<body>

  <div class="header">
    <div class="header-left">
      <a href="index.html" class="back-btn">←</a>
      <h1>📅 월간 일정표</h1>
    </div>
    <button class="add-btn" onclick="openModal()">➕ 일정 추가</button>
  </div>

  <div class="month-header">
    <button class="month-nav" onclick="changeMonth(-1)">‹</button>
    <div class="month-info">
      <div class="month-title" id="month-title"></div>
      <div class="month-sub">YSFC 와에스FC · U-12 선수반</div>
    </div>
    <button class="month-nav" onclick="changeMonth(1)">›</button>
  </div>

  <div class="calendar-wrap">
    <div class="day-headers">
      <div class="day-header sun">SUN</div>
      <div class="day-header">MON</div>
      <div class="day-header">TUE</div>
      <div class="day-header">WED</div>
      <div class="day-header">THU</div>
      <div class="day-header">FRI</div>
      <div class="day-header sat">SAT</div>
    </div>
    <div class="cal-grid" id="cal-grid"></div>
  </div>

  <div class="legend">
    <div class="legend-item"><div class="legend-dot" style="background:#e8f5ee; border:1px solid #1a7c3e;"></div>정상수업</div>
    <div class="legend-item"><div class="legend-dot" style="background:#fce4ec; border:1px solid #e91e63;"></div>센터휴무</div>
    <div class="legend-item"><div class="legend-dot" style="background:#e8f0fb; border:1px solid #3b5bdb;"></div>대회</div>
  </div>

  <div class="notice-bar" id="notice-bar"></div>

  <div class="schedule-list">
    <div class="list-title" id="list-title">📋 이달 주요 일정</div>
    <div id="schedule-items"><div class="loading">불러오는 중...</div></div>
  </div>

  <!-- 일정 추가 모달 -->
  <div class="modal-bg" id="modal-bg">
    <div class="modal">
      <div class="modal-title">➕ 일정 추가</div>
      <div class="modal-sub">달력에서 날짜를 탭탭탭 선택하세요 😊</div>
      <div class="selected-dates" id="selected-dates">
        <span style="color:#aaa; font-size:12px;">선택된 날짜 없음</span>
      </div>
      <div class="type-grid">
        <div class="type-card selected" id="type-normal" onclick="selectType('normal')">
          <span class="type-icon">✅</span>정상수업
        </div>
        <div class="type-card" id="type-off" onclick="selectType('off')">
          <span class="type-icon">🔴</span>센터휴무
        </div>
        <div class="type-card" id="type-tour" onclick="selectType('tour')">
          <span class="type-icon">🏆</span>대회
        </div>
      </div>
      <div class="tour-section" id="tour-section">
        <div class="form-group">
          <label class="form-label">대회명</label>
          <input class="form-input" id="form-tour-name" placeholder="예: KY서천대회 U-11" />
        </div>
        <div class="form-group">
          <label class="form-label">대회 기간 (시작일 ~ 종료일)</label>
          <div class="date-row">
            <input class="form-input" id="form-start-date" type="date" />
            <input class="form-input" id="form-end-date" type="date" />
          </div>
        </div>
      </div>
      <button class="form-btn" id="submit-btn" onclick="submitSchedule()">📅 일정 등록</button>
      <button class="cancel-btn" onclick="closeModal()">취소</button>
    </div>
  </div>

  <nav class="bottom-nav">
    <a href="index.html" class="nav-item"><span class="nav-icon">🏠</span>홈</a>
    <a href="notice.html" class="nav-item"><span class="nav-icon">📢</span>공지</a>
    <a href="schedule.html" class="nav-item active"><span class="nav-icon">📅</span>일정</a>
    <a href="gallery.html" class="nav-item"><span class="nav-icon">📸</span>사진</a>
    <a href="players.html" class="nav-item"><span class="nav-icon">👦</span>선수</a>
  </nav>

  <script>
    const weekdays = ['일','월','화','수','목','금','토'];
    let current = new Date();
    let selectedDates = [];
    let selectedType = 'normal';
    let firebaseSchedules = [];

    // 6월 고정 데이터 (보내주신 계획표 기준)
    const june2026 = {
      1:'normal',2:'normal',3:'normal',4:'normal',5:'normal',
      8:'normal',9:'normal',10:'normal',11:'normal',
      12:'tour-start',13:'tour',14:'tour-end',
      15:'normal',16:'normal',17:'normal',18:'normal',19:'normal',
      22:'normal',23:'normal',24:'normal',25:'normal',26:'normal',
      29:'off',30:'off'
    };
    const june2026Labels = {
      12:'대회출발', 13:'서천대회', 14:'대회종료',
      29:'센터휴무', 30:'센터휴무'
    };
    const june2026Notice = '※ 6월일정 연습경기·대회일정으로 변경될수있는점 양해부탁드립니다 ※';

    const tagLabel = {
      normal: { cls: 'tag-normal', text: '정상수업' },
      off:    { cls: 'tag-off',    text: '센터휴무' },
      tour:   { cls: 'tag-tour',   text: '대회' },
      'tour-start': { cls: 'tag-tour-start', text: '대회출발' },
      'tour-end':   { cls: 'tag-tour-end',   text: '대회종료' },
    };

    // Firebase 초기화
    let db = null;
    async function initFirebase() {
      try {
        const { initializeApp } = await import("https://www.gstatic.com/firebasejs/12.14.0/firebase-app.js");
        const { getFirestore, collection, addDoc, getDocs, orderBy, query } = await import("https://www.gstatic.com/firebasejs/12.14.0/firebase-firestore.js");

        const firebaseConfig = {
          apiKey: "AIzaSyABY7cdBTXJVbnNVVJmhuo9nXNLerbtVEo",
          authDomain: "ysfc-app-ff413.firebaseapp.com",
          projectId: "ysfc-app-ff413",
          storageBucket: "ysfc-app-ff413.firebasestorage.app",
          messagingSenderId: "791661747168",
          appId: "1:791661747168:web:3540aacb15306331afe985"
        };

        const app = initializeApp(firebaseConfig);
        db = getFirestore(app);

        window._addDoc = addDoc;
        window._collection = collection;
        window._getDocs = getDocs;
        window._orderBy = orderBy;
        window._query = query;

        await loadFirebaseSchedules();
      } catch(e) {
        console.error('Firebase 초기화 오류:', e);
        renderCalendar();
        renderList();
      }
    }

    async function loadFirebaseSchedules() {
      try {
        const q = window._query(window._collection(db, 'schedules'), window._orderBy('date'));
        const snapshot = await window._getDocs(q);
        firebaseSchedules = [];
        snapshot.forEach(doc => firebaseSchedules.push({ id: doc.id, ...doc.data() }));
      } catch(e) {
        console.error(e);
      }
      renderCalendar();
      renderList();
    }

    function getScheduleMap(year, month) {
      const map = {};
      const isJune2026 = year === 2026 && month === 5;

      if (isJune2026) {
        Object.entries(june2026).forEach(([d, type]) => {
          map[parseInt(d)] = { type, label: june2026Labels[d] || tagLabel[type]?.text || '' };
        });
      }

      firebaseSchedules.forEach(s => {
        const dateStr = s.date || s.startDate;
        if (!dateStr) return;
        const parts = dateStr.split('-');
        if (parseInt(parts[0]) === year && parseInt(parts[1]) === month+1) {
          const d = parseInt(parts[2]);
          map[d] = { type: s.type, label: s.name || s.detail || tagLabel[s.type]?.text || '', name: s.name };
        }
      });

      return map;
    }

    function renderCalendar() {
      const year = current.getFullYear();
      const month = current.getMonth();
      const today = new Date();
      const isJune2026 = year === 2026 && month === 5;

      document.getElementById('month-title').textContent = `${year}년 ${month+1}월`;

      const noticeBar = document.getElementById('notice-bar');
      if (isJune2026) {
        noticeBar.textContent = june2026Notice;
        noticeBar.classList.add('show');
      } else {
        noticeBar.classList.remove('show');
      }

      const firstDay = new Date(year, month, 1).getDay();
      const lastDate = new Date(year, month+1, 0).getDate();
      const scheduleMap = getScheduleMap(year, month);

      let html = '';
      for (let i = 0; i < firstDay; i++) html += `<div class="cal-cell empty"></div>`;

      for (let d = 1; d <= lastDate; d++) {
        const dow = (firstDay + d - 1) % 7;
        const isToday = d === today.getDate() && month === today.getMonth() && year === today.getFullYear();
        const s = scheduleMap[d];

        let dateClass = 'cell-date';
        if (dow === 0) dateClass += ' sun';
        if (dow === 6) dateClass += ' sat';

        const dateNum = isToday
          ? `<div class="${dateClass} today-num">${d}</div>`
          : `<div class="${dateClass}">${d}</div>`;

        const tagHtml = s && tagLabel[s.type]
          ? `<span class="cell-tag ${tagLabel[s.type].cls}">${s.label || tagLabel[s.type].text}</span>`
          : '';

        html += `<div class="cal-cell${isToday?' today':''}" onclick="toggleDate(${d}, this)">${dateNum}${tagHtml}</div>`;
      }

      document.getElementById('cal-grid').innerHTML = html;
    }

    function renderList() {
      const year = current.getFullYear();
      const month = current.getMonth();
      const isJune2026 = year === 2026 && month === 5;
      document.getElementById('list-title').textContent = `📋 ${month+1}월 주요 일정`;

      let items = [];

      if (isJune2026) {
        const specials = [
          { d: 12, w: '금', name: '🏆 KY서천대회 출발', detail: '' },
          { d: 13, w: '토', name: '🏆 KY서천대회 U-11', detail: '대회 진행' },
          { d: 14, w: '일', name: '🏁 KY서천대회 종료', detail: '' },
          { d: 29, w: '월', name: '🔴 센터 휴무', detail: '' },
          { d: 30, w: '화', name: '🔴 센터 휴무', detail: '' },
        ];
        items = specials.map(s => `
          <div class="schedule-item">
            <div class="item-date"><div class="d">${s.d}</div><div class="w">${s.w}</div></div>
            <div class="item-divider"></div>
            <div class="item-info">
              <div class="item-name">${s.name}</div>
              ${s.detail ? `<div class="item-detail">${s.detail}</div>` : ''}
            </div>
          </div>`);
      }

      const fbItems = firebaseSchedules.filter(s => {
        const d = s.date || s.startDate || '';
        return d.startsWith(`${year}-${String(month+1).padStart(2,'0')}`);
      }).sort((a,b) => (a.date||a.startDate) > (b.date||b.startDate) ? 1 : -1);

      fbItems.forEach(s => {
        const dateStr = s.date || s.startDate;
        const d = new Date(dateStr + 'T00:00:00');
        const day = d.getDate();
        const w = weekdays[d.getDay()];
        const icons = { normal:'✅', off:'🔴', tour:'🏆', 'tour-start':'🏆', 'tour-end':'🏁' };
        const name = s.type === 'tour-start' ? `🏆 ${s.name||'대회'} 출발`
                   : s.type === 'tour-end'   ? `🏁 ${s.name||'대회'} 종료`
                   : s.type === 'tour'       ? `🏆 ${s.name||'대회'}`
                   : s.type === 'off'        ? '🔴 센터휴무'
                   : '✅ 정상수업';
        items.push(`
          <div class="schedule-item">
            <div class="item-date"><div class="d">${day}</div><div class="w">${w}</div></div>
            <div class="item-divider"></div>
            <div class="item-info">
              <div class="item-name">${name}</div>
              ${s.detail ? `<div class="item-detail">${s.detail}</div>` : ''}
            </div>
          </div>`);
      });

      if (items.length === 0) {
        document.getElementById('schedule-items').innerHTML = '<div class="loading">등록된 일정이 없습니다<br>➕ 일정 추가 버튼으로 추가해주세요!</div>';
      } else {
        document.getElementById('schedule-items').innerHTML = items.join('');
      }
    }

    window.toggleDate = function(d, el) {
      if (el.classList.contains('empty')) return;
      const year = current.getFullYear();
      const month = current.getMonth();
      const dateStr = `${year}-${String(month+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
      const idx = selectedDates.indexOf(dateStr);
      if (idx === -1) {
        selectedDates.push(dateStr);
        el.classList.add('selecting');
      } else {
        selectedDates.splice(idx, 1);
        el.classList.remove('selecting');
      }
      updateSelectedDatesUI();
    };

    function updateSelectedDatesUI() {
      const container = document.getElementById('selected-dates');
      if (selectedDates.length === 0) {
        container.innerHTML = '<span style="color:#aaa; font-size:12px;">달력에서 날짜를 탭탭탭 선택하세요</span>';
      } else {
        const sorted = [...selectedDates].sort();
        container.innerHTML = sorted.map(d => {
          const date = new Date(d + 'T00:00:00');
          return `<span class="date-chip">${date.getMonth()+1}/${date.getDate()}(${weekdays[date.getDay()]})</span>`;
        }).join('');
      }
    }

    window.selectType = function(type) {
      selectedType = type;
      document.querySelectorAll('.type-card').forEach(c => c.classList.remove('selected'));
      document.getElementById('type-' + type).classList.add('selected');
      document.getElementById('tour-section').classList.toggle('show', type === 'tour');
    };

    window.openModal = function() {
      selectedDates = [];
      selectedType = 'normal';
      document.querySelectorAll('.type-card').forEach(c => c.classList.remove('selected'));
      document.getElementById('type-normal').classList.add('selected');
      document.getElementById('tour-section').classList.remove('show');
      document.getElementById('selected-dates').innerHTML = '<span style="color:#aaa; font-size:12px;">달력에서 날짜를 탭탭탭 선택하세요</span>';
      document.getElementById('modal-bg').classList.add('show');
    };

    window.closeModal = function() {
      document.getElementById('modal-bg').classList.remove('show');
      selectedDates = [];
      document.querySelectorAll('.cal-cell.selecting').forEach(c => c.classList.remove('selecting'));
    };

    window.submitSchedule = async function() {
      const btn = document.getElementById('submit-btn');
      if (!db) { alert('잠시 후 다시 시도해주세요'); return; }

      if (selectedType === 'tour') {
        const name = document.getElementById('form-tour-name').value.trim();
        const startDate = document.getElementById('form-start-date').value;
        const endDate = document.getElementById('form-end-date').value;
        if (!name || !startDate || !endDate) { alert('대회명과 기간을 입력해주세요!'); return; }

        btn.disabled = true; btn.textContent = '등록 중...';
        try {
          const start = new Date(startDate + 'T00:00:00');
          const end = new Date(endDate + 'T00:00:00');
          for (let d = new Date(start); d <= end; d.setDate(d.getDate()+1)) {
            const dateStr = d.toISOString().split('T')[0];
            const type = dateStr === startDate ? 'tour-start' : dateStr === endDate ? 'tour-end' : 'tour';
            const detail = type === 'tour-start' ? '대회 출발' : type === 'tour-end' ? '대회 종료' : '대회 진행중';
            await window._addDoc(window._collection(db, 'schedules'), { date: dateStr, type, name, detail, createdAt: new Date() });
          }
          alert(`${name} 일정이 등록되었습니다! ✅`);
          closeModal();
          await loadFirebaseSchedules();
        } catch(e) {
          alert('등록 중 오류가 발생했습니다 😢');
        } finally {
          btn.disabled = false; btn.textContent = '📅 일정 등록';
        }

      } else {
        if (selectedDates.length === 0) { alert('날짜를 선택해주세요!'); return; }
        btn.disabled = true; btn.textContent = `등록 중... (0/${selectedDates.length})`;
        try {
          const detail = selectedType === 'normal' ? '정상수업' : '센터휴무';
          for (let i = 0; i < selectedDates.length; i++) {
            btn.textContent = `등록 중... (${i+1}/${selectedDates.length})`;
            await window._addDoc(window._collection(db, 'schedules'), { date: selectedDates[i], type: selectedType, detail, createdAt: new Date() });
          }
          alert(`${selectedDates.length}개 일정이 등록되었습니다! ✅`);
          closeModal();
          await loadFirebaseSchedules();
        } catch(e) {
          alert('등록 중 오류가 발생했습니다 😢');
        } finally {
          btn.disabled = false; btn.textContent = '📅 일정 등록';
        }
      }
    };

    window.changeMonth = function(dir) {
      current.setMonth(current.getMonth() + dir);
      selectedDates = [];
      renderCalendar();
      renderList();
    };

    initFirebase();
  </script>

</body>
</html>
